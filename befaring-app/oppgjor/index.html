<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oppgjør — HoY Portal</title>
  <style>
    :root{--navy:#0a2140;--gold:#c9a84c;--white:#fff;--surface:#f5f7fa;--gray:#dde3ec;--gray-dark:#6b7a8d;--text:#12233a;--green:#166534;--green-bg:#dcfce7;--red:#991b1b;--red-bg:#fee2e2;--amber:#92400e;--amber-bg:#fef3c7;--blue:#1d4ed8;--blue-bg:#e0edff;--radius:12px}
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--surface);color:var(--text);margin:0;min-height:100vh;-webkit-font-smoothing:antialiased}
    .loading-screen,.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy)}
    .loading-text{color:rgba(255,255,255,0.5);font-size:15px}
    .login-box{background:white;border-radius:20px;padding:40px 36px;max-width:400px;width:calc(100% - 32px);text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
    .login-logo{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:4px}
    .login-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:28px}
    .login-form{display:flex;flex-direction:column;gap:12px;text-align:left;margin-bottom:8px}
    .login-form label{font-size:13px;font-weight:600;color:var(--navy);display:block;margin-bottom:4px}
    .login-form input{width:100%;padding:13px 15px;border:2px solid var(--gray);border-radius:10px;font-size:16px;font-family:inherit}
    .btn-login{width:100%;padding:15px;background:var(--navy);color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
    .login-error{color:var(--red);font-size:13px;font-weight:600;margin-top:10px;display:none}
    .header{background:var(--navy);color:white;padding:14px 20px;position:sticky;top:0;z-index:200}
    .header-inner{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand{display:flex;flex-direction:column}
    .brand a{color:rgba(255,255,255,0.55);font-size:11px;text-decoration:none;margin-bottom:2px}
    .brand-name{font-size:15px;font-weight:800;letter-spacing:0.8px}
    .btn-logout{background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.18);border-radius:20px;color:rgba(255,255,255,0.85);padding:6px 14px;font-size:12px;font-family:inherit;cursor:pointer}
    .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 90px}
    h1{font-size:22px;color:var(--navy);margin:0 0 4px}
    .sub{font-size:13px;color:var(--gray-dark);margin:0 0 18px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
    .kpi{background:white;border:2px solid var(--gray);border-radius:14px;padding:12px 14px}
    .kpi .l{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray-dark)}
    .kpi .v{font-size:20px;font-weight:800;color:var(--navy);margin-top:3px}
    .kpi .s{font-size:12px;color:var(--gray-dark);margin-top:2px}
    .kpi.warn{border-color:#f5d78e;background:#fffbeb}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
    .toolbar input[type=search]{flex:1;min-width:180px;padding:10px 14px;border:2px solid var(--gray);border-radius:10px;font-size:15px;font-family:inherit;background:white}
    .seg{display:flex;background:white;border:2px solid var(--gray);border-radius:10px;overflow:hidden}
    .seg button{border:none;background:none;padding:9px 13px;font-size:13px;font-weight:600;color:var(--gray-dark);cursor:pointer;font-family:inherit}
    .seg button.on{background:var(--navy);color:white}
    .section-label{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--gray-dark);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
    .section-label .n{font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}
    .card{background:white;border:2px solid var(--gray);border-radius:14px;overflow:hidden;margin-bottom:14px}
    .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--gray);cursor:pointer}
    .row:last-child{border-bottom:none}
    .row:hover{background:var(--surface)}
    .row .navn{font-weight:700;font-size:14px;color:var(--navy)}
    .row .navn small{font-weight:600;color:var(--gray-dark);margin-left:6px}
    .row .meta{font-size:12px;color:var(--gray-dark)}
    .row .neste{font-size:13px;color:var(--text);margin-top:2px}
    .row .neste b{color:var(--navy)}
    .row .hoyre{text-align:right;white-space:nowrap}
    .row .sum{font-size:14px;font-weight:700;color:var(--navy)}
    .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 9px;background:var(--gray);color:var(--text)}
    .pill.kontrakt{background:var(--gray)} .pill.forskudd{background:var(--blue-bg);color:var(--blue)} .pill.innbetalt{background:var(--blue-bg);color:var(--blue)}
    .pill.overtatt{background:var(--amber-bg);color:var(--amber)} .pill.klar{background:var(--amber-bg);color:var(--amber)} .pill.fakturert{background:#ede9fe;color:#5b21b6}
    .pill.utbetalt{background:var(--green-bg);color:var(--green)} .pill.oppgjort{background:var(--green-bg);color:var(--green)} .pill.annullert{background:var(--red-bg);color:var(--red)}
    .bar{height:5px;background:var(--gray);border-radius:3px;overflow:hidden;margin-top:6px;width:120px;margin-left:auto}
    .bar i{display:block;height:100%;background:var(--green)}
    .empty{padding:26px 16px;text-align:center;color:var(--gray-dark);font-size:14px}
    /* panel */
    .overlay{position:fixed;inset:0;background:rgba(10,33,64,0.55);display:none;align-items:flex-end;justify-content:center;z-index:300}
    .overlay.open{display:flex}
    .panel{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:820px;max-height:94vh;overflow-y:auto;padding:0 0 40px}
    @media(min-width:900px){.overlay{align-items:center}.panel{border-radius:20px;max-height:92vh}}
    .ph{position:sticky;top:0;background:var(--navy);color:white;padding:16px 20px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .ph h2{font-size:18px;margin:0}
    .ph .pid{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}
    .ph button{background:rgba(255,255,255,.12);border:none;color:white;border-radius:20px;padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer}
    .pb{padding:14px 16px}
    .blk{background:white;border:2px solid var(--gray);border-radius:14px;padding:14px 16px;margin-bottom:12px}
    .blk h3{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-dark);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
    .blk h3 .st{font-size:11px;letter-spacing:0;text-transform:none;font-weight:600}
    .kv{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:14px}
    .kv .k{color:var(--gray-dark)} .kv .v{text-align:right;font-weight:600;color:var(--navy);white-space:nowrap}
    .kv .tot{border-top:2px solid var(--navy);padding-top:6px;margin-top:4px;font-weight:800;font-size:15px}
    .steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
    .step{flex:1;min-width:88px;text-align:center;font-size:11px;color:var(--gray-dark);padding:8px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--gray)}
    .step.done{background:var(--green-bg);color:var(--green);border-color:#a7dfb9}
    .step.now{background:var(--navy);color:white;border-color:var(--navy)}
    .step b{display:block;font-size:12px}
    .step span{display:block;font-size:10px;opacity:.8;margin-top:2px}
    .tx{display:grid;grid-template-columns:70px 1fr auto auto;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--gray)}
    .tx:last-child{border-bottom:none}
    .tx .d{color:var(--gray-dark);font-size:12px} .tx .a{font-weight:700;text-align:right;white-space:nowrap} .tx .a.inn{color:var(--green)} .tx .a.ut{color:var(--red)}
    .tx .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .tx .n small{display:block;color:var(--gray-dark);font-size:11px;white-space:normal}
    .tag{font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;background:var(--gray);color:var(--text);text-transform:uppercase;letter-spacing:.3px}
    .btn{border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--navy);color:white}
    .btn.sec{background:var(--surface);color:var(--navy);border:2px solid var(--gray)}
    .btn.small{padding:5px 10px;font-size:12px;border-radius:7px}
    .btn.danger{background:var(--red-bg);color:var(--red)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .copy{background:var(--surface);border:1px dashed var(--gray);border-radius:10px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;line-height:1.55;position:relative}
    .copy button{position:absolute;top:8px;right:8px}
    .inp{width:100%;padding:9px 11px;border:2px solid var(--gray);border-radius:9px;font-size:14px;font-family:inherit;background:white}
    .inp:focus,.toolbar input:focus{outline:none;border-color:var(--navy)}
    textarea.inp{min-height:64px;resize:vertical}
    .frm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .frm .full{grid-column:1/-1}
    label.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer}
    label.chk input{width:18px;height:18px}
    .hint{font-size:12px;color:var(--gray-dark);margin-top:6px;line-height:1.45}
    .warnbox{background:var(--amber-bg);color:var(--amber);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:8px}
    .okbox{background:var(--green-bg);color:var(--green);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:8px}
    .pay{border:2px solid var(--gray);border-radius:12px;padding:10px 12px;margin-top:8px}
    .pay .t{font-size:12px;font-weight:700;color:var(--gray-dark);text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:500;display:none}
    .ukoblet .tx{grid-template-columns:70px 1fr auto}
  </style>
</head>
<body>
<div id="loadingScreen" class="loading-screen"><div class="loading-text">Starter…</div></div>
<div id="loginScreen" class="login-screen" style="display:none">
  <div class="login-box">
    <div class="login-logo">House of Yachts</div>
    <div class="login-sub">Oppgjør</div>
    <div class="login-form">
      <div><label>E-post</label><input id="loginEmail" type="email" autocomplete="username" placeholder="deg@h-y.no"></div>
      <div><label>Passord</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">🔐 Logg inn</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<div id="appScreen" style="display:none">
  <div class="header"><div class="header-inner">
    <div class="brand"><a href="/">← Portal</a><span class="brand-name">Oppgjør</span></div>
    <button class="btn-logout" onclick="doLogout()">Logg ut</button>
  </div></div>
  <div class="wrap">
    <h1>Solgte båter — fra kontrakt til oppgjort</h1>
    <p class="sub">Kjøpekontrakt og protokoll fra Oneflow, kjøpers penger lest rett fra klientkontoen, utlegg og faktura fra PowerOffice. Klikk en båt for avregning og det som mangler.</p>
    <div class="kpis" id="kpis"></div>
    <div class="toolbar">
      <input type="search" id="sok" placeholder="Søk båt, nr, selger, kjøper …" oninput="render()">
      <div class="seg" id="visning">
        <button data-v="aktive" class="on" onclick="setVis('aktive')">Aktive</button>
        <button data-v="oppgjort" onclick="setVis('oppgjort')">Oppgjort</button>
        <button data-v="alle" onclick="setVis('alle')">Alle</button>
      </div>
      <div class="seg" id="meglerSeg" style="display:none"></div>
    </div>
    <div id="liste"></div>
    <div id="ukoblet"></div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)lukk()"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
const IDENTITY = location.origin + '/.netlify/identity';
const API = '/.netlify/functions/oppgjor-v2';
const $ = (id) => document.getElementById(id);
let accessToken = null, D = null, vis = 'aktive', megler = 'alle', DET = null;
function showScreen(id){['loadingScreen','loginScreen','appScreen'].forEach(s=>$(s).style.display='none');$(id).style.display=(id==='appScreen')?'block':'flex';}
window.addEventListener('DOMContentLoaded', async () => {
  const tok = localStorage.getItem('hoy_access_token');
  if (tok) { try { const r = await fetch(`${IDENTITY}/user`, { headers: { Authorization: `Bearer ${tok}` } }); if (!r.ok) throw 0; accessToken = tok; onLogin(); return; } catch { localStorage.removeItem('hoy_access_token'); } }
  showScreen('loginScreen');
});
async function doLogin(){
  const err=$('loginError');err.style.display='none'; const btn=$('loginBtn');btn.disabled=true;btn.textContent='Logger inn…';
  try{ const r=await fetch(`${IDENTITY}/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=password&username=${encodeURIComponent($('loginEmail').value.trim())}&password=${encodeURIComponent($('loginPassword').value)}`});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error_description||'Feil passord eller e-post');}
    accessToken=(await r.json()).access_token; localStorage.setItem('hoy_access_token',accessToken); onLogin();
  }catch(e){err.textContent=e.message;err.style.display='block';btn.disabled=false;btn.textContent='🔐 Logg inn';}
}
function doLogout(){localStorage.removeItem('hoy_access_token');location.reload();}
async function api(params, body){
  const r=await fetch(`${API}?${new URLSearchParams(params)}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${accessToken}`,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({error:'Ugyldig svar'})); if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`); return d;
}
const nok=(n)=>n==null||isNaN(n)?'—':Math.round(Number(n)).toLocaleString('nb-NO');
const dato=(s)=>s?new Date(s).toLocaleDateString('nb-NO',{day:'numeric',month:'short'}):'—';
const datoL=(s)=>s?new Date(s).toLocaleDateString('nb-NO',{day:'numeric',month:'long',year:'numeric'}):'—';
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200);}
async function kopier(txt,btn){try{await navigator.clipboard.writeText(txt);}catch{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}if(btn){const o=btn.textContent;btn.textContent='Kopiert ✓';setTimeout(()=>btn.textContent=o,1500);}}
const STATUS_NAVN={kontrakt:'Kontrakt',forskudd:'Forskudd inne',innbetalt:'Fullt innbetalt',overtatt:'Overtatt',klar:'Klar for oppgjør',fakturert:'Fakturert',utbetalt:'Utbetalt',oppgjort:'Oppgjort',annullert:'Annullert'};
const REKKE=['kontrakt','forskudd','innbetalt','overtatt','klar','fakturert','utbetalt','oppgjort'];
const meglerTxt=(r)=>r.oppdrag_inn&&r.solgt_av&&r.oppdrag_inn!==r.solgt_av?`${r.oppdrag_inn} / ${r.solgt_av}`:(r.solgt_av||r.oppdrag_inn||'—');
// Hva er neste steg for denne båten — det Sindre ellers må finne ut selv
function neste(r){
  const rest=(r.salgssum||0)-(r.innbetalt||0);
  switch(r.status){
    case 'kontrakt': return `Venter <b>forskudd ${nok(r.forskudd_forventet)}</b> fra kjøper (kontrakt ${dato(r.kk_signert)}${r.overtakelse_avtalt?`, overtakelse avtalt ${dato(r.overtakelse_avtalt)}`:''})`;
    case 'forskudd': return `Forskudd inne — venter <b>rest ${nok(rest)}</b>${r.overtakelse_avtalt?` før overtakelse ${dato(r.overtakelse_avtalt)}`:''}`;
    case 'innbetalt': return `Fullt innbetalt — <b>venter overtakelsesprotokoll</b>${r.overtakelse_avtalt?` (avtalt ${dato(r.overtakelse_avtalt)})`:''}`;
    case 'overtatt': return `Overtatt ${dato(r.op_signert)} — <b>sjekk heftelser</b> i Skipsregisteret`;
    case 'klar': return `Alt inne — <b>lag faktura</b>, nettoproveny ${nok(r.nettoproveny)} til selger`;
    case 'fakturert': return `Faktura ${r.po_invoice_no} sendt — <b>betal selger ${nok(r.nettoproveny)}</b> og drift ${nok(r.po_invoice_belop)} fra klientkonto`;
    case 'utbetalt': return r.po_invoice_betalt?`Utbetalt — venter bekreftelse`:`Selger utbetalt ${dato(r.selger_utbetalt_dato)} — <b>faktura ${r.po_invoice_no||''} ikke registrert betalt</b> i PowerOffice`;
    case 'oppgjort': return `Oppgjort ${dato(r.status_dato)}`;
    case 'annullert': return `Annullert`;
  } return '';
}
async function onLogin(){ showScreen('appScreen'); await last(); }
async function last(){
  $('liste').innerHTML='<div class="card"><div class="empty">Laster …</div></div>';
  try{ D=await api({action:'liste'}); }catch(e){ $('liste').innerHTML=`<div class="card"><div class="empty">${esc(e.message)}</div></div>`; return; }
  if(D.bruker.admin){ const ms=['alle','Sindre','Henrik','Daniel']; $('meglerSeg').style.display='flex'; $('meglerSeg').innerHTML=ms.map(m=>`<button data-m="${m}" class="${m===megler?'on':''}" onclick="setMegler('${m}')">${m==='alle'?'Alle meglere':m}</button>`).join(''); }
  kpis(); render();
}
function setVis(v){vis=v;document.querySelectorAll('#visning button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();}
function setMegler(m){megler=m;document.querySelectorAll('#meglerSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));kpis();render();}
function filtrert(){ const q=($('sok').value||'').toLowerCase(); return D.rader.filter(r=>{
  if(megler!=='alle'&&r.oppdrag_inn!==megler&&r.solgt_av!==megler)return false;
  if(vis==='aktive'&&(r.status==='oppgjort'||r.status==='annullert'))return false;
  if(vis==='oppgjort'&&r.status!=='oppgjort')return false;
  if(q&&!`${r.navn} ${r.oppdragsnr} ${r.selger_navn||''} ${r.kjoper_navn||''}`.toLowerCase().includes(q))return false; return true; }); }
function kpis(){
  const akt=D.rader.filter(r=>!['oppgjort','annullert'].includes(r.status)&&(megler==='alle'||r.oppdrag_inn===megler||r.solgt_av===megler));
  const paVei=akt.reduce((a,r)=>a+Math.max(0,(r.salgssum||0)-(r.innbetalt||0)),0);
  const tilSelger=akt.filter(r=>['innbetalt','overtatt','klar','fakturert'].includes(r.status)).reduce((a,r)=>a+(r.nettoproveny||0),0);
  const honorar=akt.reduce((a,r)=>a+(r.provisjon_inkl||0),0);
  const prov={}; for(const p of D.provisjon){ if(megler!=='alle'&&p.megler!==megler)continue; const x=(prov[p.megler]??={o:0,u:0}); x.o+=+p.opptjent; x.u+=+p.utbetalt; }
  const kk=D.klientkonto; const synk=(D.synk||[]).find(s=>s.data_type==='oppgjor');
  let h=`<div class="kpi"><div class="l">Klientkonto</div><div class="v">${kk?nok(kk.bokfort):'—'}</div><div class="s">${kk?`tilgjengelig ${nok(kk.tilgjengelig)} · synket ${kk.siste_synk?new Date(kk.siste_synk).toLocaleString('nb-NO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}`:'ikke synket'}${D.bruker.admin?` · <a href="#" onclick="synkKK();return false">synk nå</a>`:''}</div></div>`;
  h+=`<div class="kpi"><div class="l">Solgt, ikke oppgjort</div><div class="v">${akt.length} båter</div><div class="s">honorar ${nok(honorar)} inkl. mva</div></div>`;
  h+=`<div class="kpi"><div class="l">På vei inn fra kjøpere</div><div class="v">${nok(paVei)}</div><div class="s">${akt.filter(r=>(r.salgssum||0)-(r.innbetalt||0)>0).length} båter ikke fullt innbetalt</div></div>`;
  h+=`<div class="kpi"><div class="l">Skal ut til selgere</div><div class="v">${nok(tilSelger)}</div><div class="s">fullt innbetalt, ikke utbetalt</div></div>`;
  for(const [m,x] of Object.entries(prov)) h+=`<div class="kpi ${x.o-x.u>0?'warn':''}"><div class="l">${m} til gode</div><div class="v">${nok(x.o-x.u)}</div><div class="s">opptjent ${nok(x.o)} · utbetalt ${nok(x.u)}</div></div>`;
  $('kpis').innerHTML=h+(synk?`<div class="kpi"><div class="l">Registeret</div><div class="v" style="font-size:14px">${synk.last_sync_at?new Date(synk.last_sync_at).toLocaleString('nb-NO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}</div><div class="s">${synk.last_error?'<span style="color:var(--red)">feil: '+esc(synk.last_error).slice(0,60)+'</span>':'bygges hver natt · klientkonto hver time'}</div></div>`:'');
}
function render(){
  const rows=filtrert(); const grupper={};
  const ord=vis==='oppgjort'?['oppgjort']:['fakturert','klar','overtatt','innbetalt','forskudd','kontrakt','utbetalt','oppgjort','annullert'];
  for(const r of rows)(grupper[r.status]??=[]).push(r);
  const TIT={fakturert:'Betal fra klientkonto',klar:'Klar — lag faktura',overtatt:'Overtatt — sjekk heftelser',innbetalt:'Fullt innbetalt — venter overtakelse',forskudd:'Forskudd inne — venter rest',kontrakt:'Kontrakt signert — venter forskudd',utbetalt:'Utbetalt — venter fakturabetaling',oppgjort:'Oppgjort',annullert:'Annullert'};
  let h='';
  for(const s of ord){ const g=grupper[s]; if(!g||!g.length)continue;
    if(s==='oppgjort')g.sort((a,b)=>(b.status_dato||b.kk_signert||'').localeCompare(a.status_dato||a.kk_signert||'')); else g.sort((a,b)=>(a.overtakelse_avtalt||a.kk_signert||'').localeCompare(b.overtakelse_avtalt||b.kk_signert||''));
    h+=`<div class="section-label"><span>${TIT[s]}</span><span class="n">${g.length} · ${nok(g.reduce((a,r)=>a+(r.salgssum||0),0))}</span></div><div class="card">`;
    for(const r of g){ const pct=r.salgssum?Math.min(100,Math.round((r.innbetalt||0)/r.salgssum*100)):0;
      h+=`<div class="row" onclick="apne('${r.oppdragsnr}')"><div><div class="navn">${esc(r.navn)}<small>${r.oppdragsnr}</small></div><div class="meta">${esc(meglerTxt(r))} · selger ${esc(r.selger_navn||'—')} → ${esc(r.kjoper_navn||'—')}</div><div class="neste">${neste(r)}</div></div>
        <div class="hoyre"><div class="sum">${nok(r.salgssum)}</div><span class="pill ${r.status}">${STATUS_NAVN[r.status]}</span>${s!=='oppgjort'&&s!=='annullert'?`<div class="bar" title="innbetalt ${nok(r.innbetalt)}"><i style="width:${pct}%"></i></div><div class="meta">inn ${nok(r.innbetalt)}</div>`:''}</div></div>`; }
    h+='</div>'; }
  $('liste').innerHTML=h||'<div class="card"><div class="empty">Ingen båter</div></div>';
  // ukoblede klientkonto-transaksjoner (admin)
  if(D.bruker.admin&&vis==='aktive'&&D.ukoblet.length){ const u=D.ukoblet.slice(0,40);
    $('ukoblet').innerHTML=`<div class="section-label"><span>Klientkonto — ikke koblet til noen båt</span><span class="n">${D.ukoblet.length} transaksjoner</span></div><div class="card ukoblet" style="padding:4px 16px">${u.map(t=>`<div class="tx"><span class="d">${dato(t.bokfort_dato)}</span><span class="n">${esc(t.motpart_navn||'')}<small>${esc(t.tekst||'')}</small></span><span class="a ${t.belop>0?'inn':'ut'}">${nok(t.belop)}</span></div>`).join('')}</div><p class="hint">Bankfinansiering, returer og småbeløp som ikke matcher noen kontrakt. Koble manuelt fra båtens detaljvisning (Penger inn → Koble transaksjon).</p>`;
  } else $('ukoblet').innerHTML='';
}
async function synkKK(){ toast('Henter klientkontoen …'); try{ const r=await api({action:'synk_klientkonto',days:30},{}); if(!r.ok)throw new Error(r.error); toast(`Klientkonto oppdatert — ${r.transaksjoner} transaksjoner`); await last(); }catch(e){toast('Feil: '+e.message);} }

// ── Detalj ──
async function apne(nr){ $('overlay').classList.add('open'); $('panel').innerHTML='<div class="pb"><div class="empty">Laster …</div></div>'; try{ DET=await api({action:'detalj',nr}); tegn(); }catch(e){ $('panel').innerHTML=`<div class="pb"><div class="empty">${esc(e.message)}</div></div>`; } }
function lukk(){ $('overlay').classList.remove('open'); DET=null; }
function tegn(){
  const r=DET.rad, A=DET.admin, J=DET.justeringer, T=DET.transaksjoner;
  const paslag=r.utlegg_paslag_pct??20, utleggInkl=Math.round((r.utlegg_eks||0)*(1+paslag/100)*1.25*100)/100;
  const jS=J.filter(j=>j.pavirker==='selger').reduce((a,j)=>a+ +j.belop,0), jP=J.filter(j=>j.pavirker==='provisjon').reduce((a,j)=>a+ +j.belop,0);
  const rest=Math.max(0,(r.salgssum||0)-(r.innbetalt||0)); const fullt=r.salgssum&&(r.innbetalt||0)>=r.salgssum*0.995;
  const idx=REKKE.indexOf(r.status);
  const stegDato={kontrakt:r.kk_signert,forskudd:T.find(t=>['forskudd','innbetaling'].includes(t.koblet_type))?.bokfort_dato,innbetalt:r.innbetalt_dato,overtatt:r.op_signert,klar:r.heftelser_sjekket,fakturert:r.po_invoice_dato,utbetalt:r.selger_utbetalt_dato||r.drift_overfort_dato,oppgjort:r.status==='oppgjort'?r.status_dato:null};
  const melding=`Oppgjør ${r.navn} ${r.oppdragsnr}`;
  const kr=(n)=>Number(n||0).toLocaleString('nb-NO',{minimumFractionDigits:0,maximumFractionDigits:2}).replace(/\u00a0| /g,'.')+',-';   // samme format som fakturaene i PO: 2.600.000,-
  const fakturaTekst=`Fakturaen er trukket i oppgjøret. Nettoprovenyet er utbetalt selger.\n\n${r.oppdragsnr} - ${r.navn}\nSalgssum: ${kr(r.salgssum)}\n\nHonorar og utlegg: ${kr((r.provisjon_inkl||0)+jP+utleggInkl)}\n\nUtbetalt nettoproveny: ${kr(r.nettoproveny)}\nSelgers kontonr: ${r.selger_konto||'________'}`;
  const heftTekst=`Båt: ${r.navn}\nOppdragsnr: ${r.oppdragsnr}\nKjenningssignal: ${r.kjenningssignal||'—'}\nHIN/CIN: ${r.hin||'—'}\nÅrsmodell: ${r.arsmodell||'—'}\nSelger: ${r.selger_navn||'—'}`;
  const driftBelop=r.po_invoice_belop||((r.provisjon_inkl||0)+jP+utleggInkl);
  let h=`<div class="ph"><div><h2>${esc(r.navn)} <span style="font-weight:500;opacity:.7">${r.oppdragsnr}</span></h2><div class="pid">${esc(r.selger_navn||'—')} → ${esc(r.kjoper_navn||'—')} · ${esc(meglerTxt(r))}${r.fordeling==='50/50'?' (50/50)':''} · <span class="pill ${r.status}" style="background:rgba(255,255,255,.15);color:#fff">${STATUS_NAVN[r.status]}</span></div></div><button onclick="lukk()">Lukk ✕</button></div><div class="pb">`;
  // steg
  h+=`<div class="blk"><div class="steps">${REKKE.map((s,i)=>`<div class="step ${r.status==='annullert'?'':i<idx?'done':i===idx?'now':''}"><b>${STATUS_NAVN[s]}</b><span>${stegDato[s]?dato(stegDato[s]):'·'}</span></div>`).join('')}</div>
    <div class="hint" style="margin-top:10px;font-size:13px;color:var(--text)">${neste(r)}</div></div>`;
  // kontrakt
  h+=`<div class="blk"><h3>Kjøpekontrakt <span class="st">${r.kk_contract_id?`<a href="https://app.oneflow.com/contracts/${r.kk_contract_id}" target="_blank">åpne i Oneflow ↗</a>`:'fra ark'}</span></h3><div class="kv">
    <span class="k">Signert</span><span class="v">${datoL(r.kk_signert)}</span><span class="k">Salgssum</span><span class="v">${nok(r.salgssum)}</span><span class="k">Overtakelse avtalt</span><span class="v">${datoL(r.overtakelse_avtalt)}</span>
    <span class="k">Overtakelsesprotokoll</span><span class="v">${r.op_signert?`signert ${datoL(r.op_signert)}${r.op_contract_id?` · <a href="https://app.oneflow.com/contracts/${r.op_contract_id}" target="_blank">↗</a>`:''}`:'ikke signert'}</span></div>
    ${A?`<label class="chk" style="margin-top:10px"><input type="checkbox" ${r.op_anmerkninger?'checked':''} onchange="lagre({op_anmerkninger:this.checked})"> Protokoll med anmerkninger (vurder tilbakehold)</label>`:''}${r.op_anmerkninger?'<div class="warnbox">Protokoll signert med anmerkninger — legg inn tilbakehold under justeringer før utbetaling til selger.</div>':''}</div>`;
  // penger inn
  h+=`<div class="blk"><h3>Penger inn på klientkonto <span class="st">${fullt?'<span style="color:var(--green)">fullt innbetalt</span>':`mangler ${nok(rest)}`}</span></h3><div class="kv"><span class="k">Forventet forskudd (10 %)</span><span class="v">${nok(r.forskudd_forventet)}</span><span class="k">Innbetalt</span><span class="v">${nok(r.innbetalt)} av ${nok(r.salgssum)}</span></div>
    <div style="margin-top:10px">${T.length?T.map(t=>`<div class="tx"><span class="d">${dato(t.bokfort_dato)}</span><span class="n">${esc(t.motpart_navn||'')}<small>${esc(t.tekst||'')}</small></span><span class="a ${t.belop>0?'inn':'ut'}">${nok(t.belop)}</span><span><span class="tag">${esc(t.koblet_type||'')}</span>${A?` <button class="btn small sec" onclick="koble('koble_slett','${t.id}')" title="Fjern kobling">✕</button>`:''}</span></div>`).join(''):'<div class="hint">Ingen transaksjoner koblet ennå. Klientkontoen leses hver time.</div>'}</div>
    ${A&&DET.kandidater.length?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)">Koble transaksjon manuelt (${DET.kandidater.length} ukoblede rundt kontraktsdato)</summary><div style="margin-top:8px">
      ${DET.kandidater.map(t=>`<div class="tx" style="grid-template-columns:70px 1fr auto auto"><span class="d">${dato(t.bokfort_dato)}</span><span class="n">${esc(t.motpart_navn||'')}<small>${esc(t.tekst||'')}</small></span><span class="a ${t.belop>0?'inn':'ut'}">${nok(t.belop)}</span><span><select class="inp" style="padding:4px 6px;font-size:12px;width:auto" id="ty-${t.id}">${(t.belop>0?['forskudd','rest','fullt','annet']:['selger_utbetaling','drift_overforing','gjeld_bank','annet']).map(x=>`<option>${x}</option>`).join('')}</select> <button class="btn small" onclick="koble('koble','${t.id}',$('ty-${t.id}').value)">Koble</button></span></div>`).join('')}</div></details>`:''}</div>`;
  // heftelser + gjeld
  h+=`<div class="blk"><h3>Heftelser (Skipsregisteret) <span class="st">${r.heftelser_sjekket?`<span style="color:var(--green)">sjekket ${dato(r.heftelser_sjekket)} · ${esc((r.heftelser_av||'').split('@')[0])}</span>`:'ikke sjekket'}</span></h3>
    <div class="copy">${esc(heftTekst)}<button class="btn small sec" onclick="kopier(${JSON.stringify(heftTekst).replace(/"/g,'&quot;')},this)">Kopier</button></div>
    <div class="hint">Søk på kjenningssignal eller HIN i <a href="https://www.sdir.no/skipsregistrene/" target="_blank">Skipsregistrene ↗</a>. Har båten pant, legg inn beløp og bankens kontonr under — nettoproveny til selger reduseres og en tredje betaling vises.</div>
    ${A?`<div class="frm"><label class="chk full"><input type="checkbox" ${r.heftelser_sjekket?'checked':''} onchange="lagre({heftelser_sjekket:this.checked})"> Heftelser sjekket</label>
      <input class="inp" id="f-gjeld" type="number" placeholder="Gjeld innfris til bank (kr)" value="${r.gjeld_bank_belop||''}"><input class="inp" id="f-gjeldkonto" placeholder="Bankens kontonr" value="${esc(r.gjeld_bank_konto||'')}">
      <input class="inp full" id="f-heftnotat" placeholder="Notat (panthaver, saksnr …)" value="${esc(r.heftelser_notat||'')}"><button class="btn sec full" onclick="lagre({gjeld_bank_belop:$('f-gjeld').value,gjeld_bank_konto:$('f-gjeldkonto').value,heftelser_notat:$('f-heftnotat').value})">Lagre heftelser og gjeld</button></div>`:(r.gjeld_bank_belop?`<div class="warnbox">Gjeld ${nok(r.gjeld_bank_belop)} innfris til ${esc(r.gjeld_bank_konto||'bank')}</div>`:'')}</div>`;
  // avregning
  h+=`<div class="blk"><h3>Avregning <span class="st">${r.po_project_id?`PowerOffice-prosjekt ${r.oppdragsnr}`:'ingen PO-prosjekt'}</span></h3><div class="kv">
    <span class="k">Salgssum</span><span class="v">${nok(r.salgssum)}</span>
    <span class="k">− Honorar inkl. mva${r.oms_eks?` (${nok(r.oms_eks)} eks.)`:''}</span><span class="v">− ${nok(r.provisjon_inkl)}</span>
    ${jP?`<span class="k">± Justering av honorar</span><span class="v">${jP>0?'− ':'+ '}${nok(Math.abs(jP))}</span>`:''}
    <span class="k">− Utlegg ${nok(r.utlegg_eks)} eks. + ${paslag} % påslag + mva</span><span class="v">− ${nok(utleggInkl)}</span>
    ${J.filter(j=>j.pavirker==='selger').map(j=>`<span class="k">${j.belop>0?'+':'−'} ${esc(j.type)}${j.beskrivelse?` · ${esc(j.beskrivelse)}`:''}</span><span class="v">${j.belop>0?'+ ':'− '}${nok(Math.abs(j.belop))} <button class="btn small sec" onclick="justSlett(${j.id})" title="Slett">✕</button></span>`).join('')}
    ${r.gjeld_bank_belop?`<span class="k">− Gjeld innfris til bank</span><span class="v">− ${nok(r.gjeld_bank_belop)}</span>`:''}
    <span class="k tot">Nettoproveny til selger</span><span class="v tot">${nok(r.nettoproveny)}</span></div>
    <details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)">Legg til justering</summary><div class="frm">
      <select class="inp" id="j-type"><option value="tilbakehold">Tilbakehold (anmerkninger)</option><option value="retur_kjoper">Retur til kjøper</option><option value="rabatt">Rabatt på honorar</option><option value="tillegg">Tillegg</option><option value="annet">Annet</option></select>
      <input class="inp" id="j-belop" type="number" placeholder="Beløp (− reduserer selgers utbetaling)">
      <select class="inp" id="j-pav"><option value="selger">Påvirker selgers utbetaling</option><option value="provisjon">Påvirker honoraret</option></select>
      <input class="inp" id="j-besk" placeholder="Beskrivelse"><button class="btn full" onclick="justLegg()">Legg til</button></div>
      <div class="hint">Tilbakehold og retur til kjøper legges inn som negative beløp. Rabatt på honorar: velg «påvirker honoraret» og negativt beløp inkl. mva.</div></details>
    <div class="frm"><input class="inp" id="f-konto" placeholder="Selgers kontonr (fra oppgjørsskjema)" value="${esc(r.selger_konto||'')}"><button class="btn sec" onclick="lagre({selger_konto:$('f-konto').value})">Lagre kontonr</button></div></div>`;
  // faktura
  h+=`<div class="blk"><h3>Provisjonsfaktura <span class="st">${r.po_invoice_no?`nr ${r.po_invoice_no} · ${dato(r.po_invoice_dato)} · ${nok(r.po_invoice_belop)} · ${r.po_invoice_betalt?'<span style="color:var(--green)">betalt</span>':'<span style="color:var(--red)">ikke betalt</span>'}`:'ikke laget'}</span></h3>
    ${r.po_invoice_no?'':`<div class="copy">${esc(fakturaTekst)}<button class="btn small sec" onclick="kopier(${JSON.stringify(fakturaTekst).replace(/"/g,'&quot;')},this)">Kopier</button></div>
    <div class="hint">Linjer: provisjon ${nok(r.oms_eks)} eks. mva${r.utlegg_eks?` · utlegg ${nok(Math.round((r.utlegg_eks||0)*(1+paslag/100)*100)/100)} eks. mva (${nok(r.utlegg_eks)} + ${paslag} %)`:''}. Lag fakturaen fra prosjektet ${r.oppdragsnr} i PowerOffice med teksten over — «lag utkast automatisk» kommer så snart PO-fakturaflyten er verifisert.</div>`}
    ${A&&!r.po_invoice_no?`<button class="btn" disabled title="Aktiveres etter verifisering av SalesOrders-API">Lag fakturautkast i PowerOffice</button>`:''}</div>`;
  // utbetalinger
  const pay=(tittel,konto,belop,msg,status)=>`<div class="pay"><div class="t"><span>${tittel}</span><span>${status}</span></div><div class="copy" style="margin-top:6px">Til konto: ${esc(konto||'________')}\nBeløp: ${nok(belop)}\nMelding: ${esc(msg)}<button class="btn small sec" onclick="kopier(${JSON.stringify(`${konto||''}\n${Math.round(belop||0)}\n${msg}`).replace(/"/g,'&quot;')},this)">Kopier</button></div></div>`;
  h+=`<div class="blk"><h3>Utbetalinger fra klientkonto ${DET.klientkonto.replace(/(\d{4})(\d{2})(\d{5})/,'$1.$2.$3')}</h3>
    ${pay('1 · Nettoproveny til selger',r.selger_konto,r.nettoproveny,melding,r.selger_utbetalt?`<span style="color:var(--green)">utbetalt ${nok(r.selger_utbetalt)} · ${dato(r.selger_utbetalt_dato)}</span>`:(fullt&&r.op_signert?'klar':'ikke klar'))}
    ${r.gjeld_bank_belop?pay('2 · Innfrielse til bank',r.gjeld_bank_konto,r.gjeld_bank_belop,`${r.navn} ${r.oppdragsnr} innfrielse`,''):''}
    ${pay(`${r.gjeld_bank_belop?'3':'2'} · Faktura til drift`,D.drift_konto,driftBelop,`Faktura ${r.po_invoice_no||''} ${r.navn} ${r.oppdragsnr}`.replace(/\s+/g,' '),r.drift_overfort?`<span style="color:var(--green)">overført ${nok(r.drift_overfort)} · ${dato(r.drift_overfort_dato)}</span>`:(r.po_invoice_no?'klar':'etter faktura'))}
    <div class="hint">Når betalingene dukker opp på klientkontoen kobles de automatisk og båten går til «Utbetalt» → «Oppgjort» når fakturaen er registrert betalt i PowerOffice.</div></div>`;
  // provisjon
  if(DET.provisjon.length) h+=`<div class="blk"><h3>Meglerprovisjon</h3><div class="kv">${DET.provisjon.map(p=>`<span class="k">${esc(p.megler)} · ${Math.round(p.sats*100)} %${p.utbetalt_kilde?` · ${esc(p.utbetalt_kilde)}`:''}</span><span class="v">${nok(p.opptjent)} opptjent · ${nok(p.utbetalt)} utbetalt${p.opptjent-p.utbetalt>0?` · <span style="color:var(--amber)">${nok(p.opptjent-p.utbetalt)} til gode</span>`:''}</span>`).join('')}</div></div>`;
  // notat + annuller
  h+=`<div class="blk"><h3>Notat</h3><textarea class="inp" id="f-notat">${esc(r.notat||'')}</textarea><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sec" onclick="lagre({notat:$('f-notat').value})">Lagre notat</button>
    ${A?(r.status==='annullert'?`<button class="btn sec" onclick="lagre({annullert:false})">Gjenopprett salget</button>`:`<button class="btn danger" id="ann1" onclick="this.style.display='none';$('ann2').style.display='inline-block'">Annuller salget</button><button class="btn danger" id="ann2" style="display:none" onclick="lagre({annullert:true})">Bekreft annullering — ingen provisjon</button>`):''}</div></div>`;
  h+='</div>'; $('panel').innerHTML=h;
}
async function lagre(patch){ try{ const r=await api({action:'lagre',nr:DET.rad.oppdragsnr},patch); toast('Lagret'); await oppdater(); }catch(e){toast('Feil: '+e.message);} }
async function justLegg(){ const b=Number($('j-belop').value); if(!b){toast('Beløp mangler');return;} try{ await api({action:'justering',nr:DET.rad.oppdragsnr},{type:$('j-type').value,belop:b,pavirker:$('j-pav').value,beskrivelse:$('j-besk').value}); toast('Justering lagt til'); await oppdater(); }catch(e){toast('Feil: '+e.message);} }
async function justSlett(id){ try{ await api({action:'justering_slett'},{id}); toast('Slettet'); await oppdater(); }catch(e){toast('Feil: '+e.message);} }
async function koble(action,id,type){ try{ await api({action},{id,nr:DET.rad.oppdragsnr,type}); toast(action==='koble'?'Koblet':'Kobling fjernet'); await oppdater(); }catch(e){toast('Feil: '+e.message);} }
async function oppdater(){ const nr=DET.rad.oppdragsnr; const y=$('panel').scrollTop; DET=await api({action:'detalj',nr}); tegn(); $('panel').scrollTop=y; D=await api({action:'liste'}); kpis(); render(); }
</script>

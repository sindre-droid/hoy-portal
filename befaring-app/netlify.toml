[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"
  # pdfkit inneholder .afm-fontfiler som esbuild ikke plukker opp — la Netlify inkludere
  # hele pakken ubundlet slik at pdfkit finner data-filene sine i runtime.
  external_node_modules = ["pdfkit"]

# Prospekt-publisering og AI-generering trenger mer tid
[functions."prospekt"]
  timeout = 26

# Oppdragsnummer: signing_dates og backfill kan ta tid med mange Oneflow-kontrakter
[functions."oppdragsnummer"]
  timeout = 26

# Servicehistorikk: ned­lasting av flere PDF/bilder + Anthropic vision-kall
[functions."servicehistorikk"]
  timeout = 26

# Annonsegenerator V2.1: stort system-prompt (~16K tokens) + lang Claude-generering
[functions."annonsegenerator"]
  timeout = 26

# Serve subfolder routes cleanly
[[redirects]]
  from = "/befaring"
  to = "/befaring/"
  status = 301

[[redirects]]
  from = "/handbok"
  to = "/handbok/"
  status = 301

[[redirects]]
  from = "/soper"
  to = "/soper/"
  status = 301

[[redirects]]
  from = "/sjekkliste"
  to = "/sjekkliste/"
  status = 301

[[redirects]]
  from = "/budmodul"
  to = "/budmodul/"
  status = 301

[[redirects]]
  from = "/prospekt"
  to = "/prospekt/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/avspasering"
  to = "/avspasering/"
  status = 301

[[redirects]]
  from = "/servicehistorikk"
  to = "/servicehistorikk/"
  status = 301

[[redirects]]
  from = "/oneone"
  to = "/oneone/"
  status = 301

[[redirects]]
  from = "/workshop"
  to = "/workshop/"
  status = 301

# 1:1-prep gjør parallelle HubSpot-søk + pipeline-stage-fetch
[functions."oneone"]
  timeout = 26


# Prishistorikk: nattlig upsert av HubSpot-prishistorikk til Supabase price_history
[functions."price-history-sync"]
  schedule = "15 3 * * *"
  timeout = 26

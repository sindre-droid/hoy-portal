[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # pdfkit inneholder .afm-fontfiler som esbuild ikke plukker opp — la Netlify inkludere
  # hele pakken ubundlet slik at pdfkit finner data-filene sine i runtime.
  external_node_modules = ["pdfkit"]

# Prospekt-publisering og AI-generering trenger mer tid
[functions."prospekt"]
  timeout = 26

# Serve subfolder routes cleanly
[[redirects]]
  from = "/befaring"
  to = "/befaring/"
  status = 301

[[redirects]]
  from = "/handbok"
  to = "/handbok/"
  status = 301

[[redirects]]
  from = "/soper"
  to = "/soper/"
  status = 301

[[redirects]]
  from = "/sjekkliste"
  to = "/sjekkliste/"
  status = 301

[[redirects]]
  from = "/budmodul"
  to = "/budmodul/"
  status = 301

[[redirects]]
  from = "/prospekt"
  to = "/prospekt/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301


<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorecard — House of Yachts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f3f4f2; --panel:#ffffff; --panel2:#f7f8f6; --line:#e3e6e1; --line2:#cfd4cc;
  --ink:#141a16; --ink2:#4b554f; --ink3:#7d867f;
  --brand:#1F3D2E; --brand2:#2f5d47; --brand-ink:#ffffff; --brand-soft:#e3ece6;
  --red:#b93a2b; --red-bg:#fbeae7; --amber:#a8730a; --amber-bg:#fbf1dc; --green:#2b8a4b; --green-bg:#e3f3e8; --blue:#2b5b86; --blue-bg:#e5edf5;
  --shadow:0 1px 2px rgba(15,25,18,.05),0 6px 20px rgba(15,25,18,.05);
  --font:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{--bg:#0f1311;--panel:#171c19;--panel2:#1c221e;--line:#2a322d;--line2:#3b453f;--ink:#eaeeeb;--ink2:#aab3ad;--ink3:#767f79;--brand:#7fb79a;--brand2:#a9d4bf;--brand-ink:#0f1311;--brand-soft:#1d2a22;--red:#e46b5d;--red-bg:#2c1b18;--amber:#e0a83a;--amber-bg:#2b2314;--green:#5fbf7e;--green-bg:#17281c;--blue:#7fb0d8;--blue-bg:#17222c;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;font-feature-settings:"tnum" 1,"cv11" 1}
h1,h2,h3{margin:0}a{color:var(--brand2)}button{font-family:inherit}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.screen .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 36px;text-align:center;max-width:420px;box-shadow:var(--shadow)}

/* layout */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.main{padding:22px 26px 70px;min-width:0}
.logo{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand2)}
.logo b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink);text-transform:none;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{text-align:left;border:0;background:transparent;color:var(--ink2);font-size:14px;font-weight:600;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.nav button small{font-weight:500;font-size:11px;opacity:.7}
.goal{background:var(--brand-soft);border-radius:12px;padding:14px}
.goal .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand2)}
.goal .g{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px;font-size:13px;color:var(--ink2)}
.goal .g b{font-size:15px;font-weight:800;color:var(--ink)}
.goal .g.sub{margin-top:4px;font-size:12px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:12.5px;font-weight:600;padding:7px 6px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.sidefoot{margin-top:auto;font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;gap:8px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);margin:2px 2px 0 0}
.src .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.src.bad{background:var(--red-bg);color:var(--red);border-color:transparent}.src.bad .dot{background:var(--red)}
.btn{font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink2);padding:7px 11px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line2);color:var(--ink)}.btn.warn{background:var(--amber-bg);border-color:transparent;color:var(--amber)}.btn[disabled]{opacity:.5;cursor:default}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.topbar .meta{font-size:12.5px;color:var(--ink3);margin-top:2px}
.pane{display:none}.pane.on{display:block}

/* cards */
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:2fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .sub{color:var(--ink2);font-size:12.5px;margin-top:3px}
.k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.1}.v.xl{font-size:40px}.v.md{font-size:22px}.v.sm{font-size:17px}
.v.neg{color:var(--red)}.v.pos{color:var(--green)}.unit{font-size:13px;color:var(--ink2);font-weight:500;margin-left:6px}
.note{font-size:12px;color:var(--ink3);margin-top:8px}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%;background:var(--brand2)}.bar i.exp{opacity:.35}.bar i.g{background:var(--green)}.bar i.r{background:var(--red)}.bar i.a{background:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.chip.red{background:var(--red-bg);color:var(--red);border-color:transparent}.chip.amber{background:var(--amber-bg);color:var(--amber);border-color:transparent}.chip.green{background:var(--green-bg);color:var(--green);border-color:transparent}.chip.blue{background:var(--blue-bg);color:var(--blue);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right;white-space:nowrap}td.muted{color:var(--ink2)}tr.total td{border-top:2px solid var(--line2);font-weight:700;background:var(--panel2)}tr.now td{background:var(--brand-soft)}
.cell{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.15}.cell .f{font-weight:700}.cell .p{font-size:10.5px;color:var(--ink3)}
.cell.r .f{color:var(--red)}.cell.a .f{color:var(--amber)}.cell.g .f{color:var(--green)}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:13px;margin-top:10px}.kv .l{color:var(--ink2)}.kv .r{text-align:right;font-weight:600;white-space:nowrap}.kv .r.neg{color:var(--red)}.kv .r.pos{color:var(--green)}

/* "her er vi" */
.statement{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--brand);color:var(--brand-ink);border-radius:16px;overflow:hidden}
.statement > div{padding:20px 22px;border-right:1px solid rgba(255,255,255,.14)}.statement > div:last-child{border-right:0}
.statement .k{color:var(--brand-ink);opacity:.7}.statement .v{color:var(--brand-ink)}.statement .t{font-size:13px;opacity:.85;margin-top:6px;line-height:1.4}
.statement .bar{background:rgba(255,255,255,.16);border-color:transparent}.statement .bar i{background:var(--brand-ink)}
.statement .must{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.statement .must span{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600}
:root[data-theme="dark"] .statement{color:var(--brand-ink)}

/* funnel */
.chain{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.step{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;position:relative;min-width:0}
.step.push{border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.step.push::before{content:"PUSH HER";position:absolute;top:-9px;left:10px;font-size:9.5px;font-weight:800;letter-spacing:.1em;background:var(--red);color:#fff;padding:1px 7px;border-radius:999px}
.step .k{display:block}.step .v{font-size:24px}.step .m{font-size:11.5px;color:var(--ink2);margin-top:3px}
.step .d{font-size:12px;font-weight:700;margin-top:5px}.step .d.r{color:var(--red)}.step .d.a{color:var(--amber)}.step .d.g{color:var(--green)}.step .d.n{color:var(--ink3);font-weight:500}
.list{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px}
.list li .n{font-size:12px;color:var(--ink2);white-space:nowrap}.list li .n b{color:var(--red)}
.empty{font-size:12.5px;color:var(--ink3);padding:10px 0}
.line{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:14px}
.line .k{display:block}.line .v{font-size:18px}.line .st{font-weight:800;font-size:14px}.line .st.r{color:var(--red)}.line .st.g{color:var(--green)}
details summary{font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;margin-top:10px}
.tabs2{display:inline-flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs2 button{border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer}.tabs2 button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
/* chart */
.chartwrap{position:relative;margin-top:10px}.chartwrap svg{width:100%;height:auto;display:block}
svg .grid{stroke:var(--line);stroke-width:1}svg .axis{fill:var(--ink3);font-size:10.5px;font-family:var(--font)}
svg .b-act{fill:var(--brand2)}svg .b-ly{fill:var(--ink3);opacity:.35}svg .plan{fill:none;stroke:var(--amber);stroke-width:2}svg .plan-dot{fill:var(--amber)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;opacity:0;transform:translate(-50%,-115%);transition:opacity .1s}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2)}.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.scen{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel2)}
.scen.hl{border-color:var(--brand2);box-shadow:inset 0 0 0 1px var(--brand2)}
.scen h3{font-size:14px;font-weight:700}.scen .res{display:flex;gap:18px;margin-top:8px}.scen .res .v{font-size:22px}
@media (max-width:1100px){.chain{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.statement{grid-template-columns:1fr}.g2,.g3,.g4,.g21{grid-template-columns:1fr}.chain{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="loading" class="screen"><div class="box"><div class="k">Scorecard</div><p style="margin-top:10px">Laster…</p></div></div>
<div id="authError" class="screen" style="display:none"><div class="box"><h2>Ingen tilgang</h2><p>Scorecard krever administratortilgang.</p><a class="btn" href="/">Tilbake til portalen</a></div></div>

<div id="app" class="shell" style="display:none">
  <aside class="side">
    <div class="logo">House of Yachts<b>Scorecard</b></div>
    <div class="goal" id="goal"></div>
    <div class="nav" id="nav">
      <button data-tab="na" aria-selected="true">Nå <small>uke for uke</small></button>
      <button data-tab="aar">Året <small>måned · fjorår · lønnsomhet</small></button>
      <button data-tab="plan">Planen <small>2027 · 1-3-5 · gate</small></button>
    </div>
    <div>
      <div class="k" style="margin-bottom:6px">Vis for</div>
      <div class="seg" id="unitSeg"><button data-u="Selskap" aria-pressed="true">Selskap</button><button data-u="Sindre">Sindre</button><button data-u="Henrik">Henrik+Marte</button></div>
    </div>
    <div class="sidefoot">
      <div id="sources"></div>
      <div id="bank"></div>
      <div id="builtAt"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="rebuildBtn" type="button">↻ Bygg på nytt</button><button class="btn" id="themeBtn" type="button">☾</button><a class="btn" href="/">Portal</a></div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><div><h1 id="title">Nå</h1><div class="meta" id="subtitle"></div></div><div id="topright"></div></div>
    <div id="degrade" class="card" style="display:none;border-left:4px solid var(--amber);margin-bottom:14px"></div>
    <section class="pane on" id="pane-na"></section>
    <section class="pane" id="pane-aar"></section>
    <section class="pane" id="pane-plan"></section>
  </main>
</div>

<script>
'use strict';
const ORIGIN=window.location.origin, API=`${ORIGIN}/.netlify/functions/scorecard-state`, EB_API=`${ORIGIN}/.netlify/functions/enablebanking`, IDENTITY=`${ORIGIN}/.netlify/identity`;
let token=null,S=null,builtAt=null,UNIT='Selskap',TAB='na',LON='per_prisklasse';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNum=n=>typeof n==='number'&&Number.isFinite(n);
const nok=(n,o={})=>{if(!isNum(n))return '—';const r=Math.round(n);return (r<0?'−':(o.sign&&r>0?'+':''))+Math.abs(r).toLocaleString('nb-NO');};
const mnok=n=>isNum(n)?(n<0?'−':'')+(Math.abs(n)/1e6).toLocaleString('nb-NO',{minimumFractionDigits:1,maximumFractionDigits:1})+' M':'—';
const n1=n=>isNum(n)?n.toLocaleString('nb-NO',{maximumFractionDigits:1}):'—';
const pct=n=>isNum(n)?`${Math.round(n)} %`:'—';
const dato=(iso,t)=>{if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return '—';const s=d.toLocaleDateString('nb-NO',{day:'2-digit',month:'short'});return t?s+' '+d.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'}):s;};
const daysUntil=iso=>{if(!iso)return null;const d=new Date(iso);return isNaN(d)?null:Math.ceil((d-Date.now())/864e5);};
const parseJwt=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch{return null;}};
const cls=(f,m)=>{if(!isNum(m)||m<=0)return 'n';const r=f/m;return r>=1?'g':(r>=0.7?'a':'r');};
const UNAME={Selskap:'Selskap',Sindre:'Sindre',Henrik:'Henrik + Marte',Daniel:'Daniel'};
const MN=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];

function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');const dark=t==='dark';$('themeBtn').textContent=dark?'☀':'☾';}
$('themeBtn').onclick=()=>{const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';try{localStorage.setItem('hoy_cockpit_theme',next);}catch{}applyTheme(next);};
try{applyTheme(localStorage.getItem('hoy_cockpit_theme')||'light');}catch{applyTheme('light');}
document.querySelectorAll('#unitSeg button').forEach(b=>b.onclick=()=>{UNIT=b.dataset.u;document.querySelectorAll('#unitSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));render();});
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function showTab(t){TAB=['na','aar','plan'].includes(t)?t:'na';document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===TAB?'true':'false'));['na','aar','plan'].forEach(x=>$('pane-'+x).classList.toggle('on',x===TAB));$('title').textContent={na:'Nå',aar:'Året',plan:'Planen'}[TAB];if(location.hash!=='#'+TAB)history.replaceState(null,'','#'+TAB);}
window.addEventListener('hashchange',()=>showTab(location.hash.slice(1)));

async function init(){
  const tok=localStorage.getItem('hoy_access_token');if(!tok){window.location.href='/';return;}
  try{const r=await fetch(`${IDENTITY}/user`,{headers:{Authorization:`Bearer ${tok}`}});if(!r.ok)throw 0;}catch{localStorage.removeItem('hoy_access_token');window.location.href='/';return;}
  if(!(parseJwt(tok)?.app_metadata?.roles||[]).includes('admin')){$('loading').style.display='none';$('authError').style.display='flex';return;}
  token=tok;await load();$('loading').style.display='none';$('app').style.display='';showTab(location.hash.slice(1)||'na');
}
async function load(){const r=await fetch(`${API}?action=get`,{headers:{Authorization:`Bearer ${token}`}});if(!r.ok){fatal(`scorecard-state svarte ${r.status}`);return;}const j=await r.json();S=j.state;builtAt=j.built_at;if(!S){fatal('Ingen lagret scorecard ennå — trykk «Bygg på nytt» (~25 s).');return;}render();}
function fatal(m){$('loading').style.display='none';$('app').style.display='';$('degrade').style.display='';$('degrade').innerHTML=`<b>Ingen data</b><div>${esc(m)}</div>`;}
$('rebuildBtn').onclick=async()=>{const b=$('rebuildBtn');b.disabled=true;b.textContent='↻ Starter…';const before=builtAt;
  try{const r=await fetch(`${API}?action=rebuild`,{method:'POST',headers:{Authorization:`Bearer ${token}`}});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||('status '+r.status));
    for(let i=1;i<=24;i++){b.textContent=`↻ Bygger… ${i*5} s`;await new Promise(res=>setTimeout(res,5000));const g=await fetch(`${API}?action=get`,{headers:{Authorization:`Bearer ${token}`}});const gj=await g.json();if(gj.state&&gj.built_at!==before){S=gj.state;builtAt=gj.built_at;render();break;}if(i===24)alert('Bygget er startet, men er ikke ferdig etter 2 min — last siden på nytt om litt.');}}
  catch(e){alert('Rebuild feilet: '+e.message);}b.disabled=false;b.textContent='↻ Bygg på nytt';};

function render(){
  const age=builtAt?Math.round((Date.now()-new Date(builtAt))/36e5):null;
  $('builtAt').innerHTML=`Bygget ${dato(builtAt,true)}${age!=null?` (${age<1?'<1':age} t siden)`:''}.<br>Neste automatiske bygg 04:00.`;
  $('subtitle').textContent=`${UNAME[UNIT]} · uke ${(S.plan?.uke_na||'').slice(-2)} · ${S.plan?.uker_igjen} hele uker igjen av H2`;
  renderGoal();renderSources();renderBank();renderNa();renderAar();renderPlan();
}
function renderGoal(){
  const A=S.aar||{},H=A.helaar||{},L=S.likviditet||{};
  $('goal').innerHTML=`<div class="k">Målet</div>
    <div class="g"><span>H2 2026</span><b>${mnok(S.plan.maal.Selskap)}</b></div>
    <div class="g sub"><span>levert ${pct(100*S.plan.levert.Selskap/S.plan.maal.Selskap)}</span><span>${nok(S.plan.levert.Selskap)}</span></div>
    <div class="g"><span>Helår 2026</span><b>${mnok(H.maal)}</b></div>
    <div class="g sub"><span>levert ${pct(100*H.levert/H.maal)}</span><span>${nok(H.levert)}</span></div>
    <div class="g"><span>2027 resultat</span><b>i pluss</b></div>
    <div class="g sub"><span>North Star 1,5 M → 3 M → 5 M</span></div>
    <div class="g"><span>Ansette Q1</span><b style="color:${L.status==='GRØNT'?'var(--green)':'var(--red)'}">${L.status==='GRØNT'?'JA':'NEI'}</b></div>`;
}
const SRC_LABELS={ark:'Oppgjørsark',hubspot:'HubSpot',oneflow:'Oneflow',finn:'FINN',kurver:'Kurver',livslop:'Livsløp',aar:'Året',lonnsomhet:'PowerOffice',plan2027:'Motor',likviditet:'Likviditet'};

    <div class="sub">Close-rate = solgt av avgjorte. Bidrag = provisjonsinntekt − meglerlønn − direkte kost på PowerOffice-prosjektet (bilag fra mai 2025, kun der prosjektet har bilag). ${esc(LO.note||'')}</div>
    <div style="overflow-x:auto"><table style="margin-top:8px"><thead><tr><th>${groups[LON]}</th><th class="num">Oppdrag</th><th class="num">Solgt</th><th class="num">Close</th><th class="num">Median oms</th><th class="num">Sum oms</th><th class="num">Median dager</th><th class="num">Median direkte kost</th><th class="num">Median bidrag</th><th class="num">n (PO)</th></tr></thead><tbody>
    ${rows.length?rows.map(g=>`<tr><td><b>${esc(g.gruppe)}</b></td><td class="num">${g.oppdrag}</td><td class="num">${g.solgt}</td><td class="num">${pct(g.close_rate)}</td><td class="num">${nok(g.median_oms)}</td><td class="num">${nok(g.sum_oms)}</td><td class="num">${g.median_dager??'—'}</td><td class="num">${nok(g.median_direkte)}</td><td class="num" style="color:${(g.median_bidrag||0)<0?'var(--red)':'inherit'}">${nok(g.median_bidrag)}</td><td class="num muted">${g.po_n}</td></tr>`).join(''):'<tr><td colspan="10" class="empty">ingen grupper med ≥3 oppdrag — for kilde: fyll «Oppdragskilde» i arket</td></tr>'}</tbody></table></div></div>`;
  // spaker
  const sp=S.spaker||{},ipb=sp.inntekt_per_bat||{},ep=sp.eff_provisjonsgrad||{},u6=sp.under_6pct||{},sb=sp.snittbat||{};const P27=S.plan2027;const eff=P27?P27.scenarioer[1].med_spaker.resultat-P27.scenarioer[1].baseline.resultat:null;
  const spak=`<div class="card" style="margin-top:14px"><h2>Spakene · bedre økonomi per båt før flere stoler <span class="chip green">verdt ${nok(eff)} på 2027-resultatet</span></h2><div class="sub">status YTD mot spak-målene i 1-3-5-planen. Effekten er forskjellen mellom baseline og «med spakene» i motoren for beslutnings-bemanningen.</div>
    <div style="overflow-x:auto"><table style="margin-top:8px"><thead><tr><th>Spak</th><th class="num">Nå (YTD)</th><th class="num">H2</th><th class="num">Fasit 12 mnd</th><th class="num">Mål</th><th>Status</th></tr></thead><tbody>
    <tr><td><b>Inntekt per solgt båt</b><div class="note" style="margin:0">premium-miks + 6 %-disiplin</div></td><td class="num"><b>${nok(ipb.ytd)}</b></td><td class="num">${nok(ipb.h2)}</td><td class="num muted">${nok(ipb.fasit)}</td><td class="num">${nok(ipb.spak_maal)}</td><td>${isNum(ipb.h2)&&ipb.h2>=ipb.spak_maal?'<span class="chip green">over mål i H2</span>':'<span class="chip amber">under mål</span>'}</td></tr>
    <tr><td><b>Effektiv provisjonsgrad</b><div class="note" style="margin:0">gap til 6 % = rabatter</div></td><td class="num"><b>${isNum(ep.ytd_pct)?ep.ytd_pct.toLocaleString('nb-NO')+' %':'—'}</b></td><td class="num">${isNum(ep.h2_pct)?ep.h2_pct.toLocaleString('nb-NO')+' %':'—'}</td><td class="num muted">5,79 %</td><td class="num">6 %</td><td>${isNum(ep.h2_pct)&&ep.h2_pct>=5.95?'<span class="chip green">holder i H2</span>':'<span class="chip amber">rabatter gis</span>'}</td></tr>
    <tr><td><b>Salg under 6 %</b><div class="note" style="margin:0">${esc(u6.note||'')}</div></td><td class="num"><b>${u6.antall??'—'} av ${u6.av??'—'}</b></td><td class="num"></td><td class="num muted">13 av 38 (H1)</td><td class="num">0</td><td>${(u6.antall||0)>0?'<span class="chip red">krever godkjenning</span>':'<span class="chip green">ingen</span>'}</td></tr>
    <tr><td><b>Snitt salgssum</b><div class="note" style="margin:0">premium-miks</div></td><td class="num"><b>${nok(sb.ytd)}</b></td><td class="num"></td><td class="num muted">1 260 458</td><td class="num">${nok(sb.spak_maal)}</td><td>${isNum(sb.ytd)&&sb.ytd>=sb.spak_maal?'<span class="chip green">over</span>':'<span class="chip amber">under</span>'}</td></tr>
    <tr><td><b>Markedskost per signert oppdrag</b><div class="note" style="margin:0">15k-tak; fra PowerOffice-prosjektene</div></td><td class="num"><b>${nok((LO.per_megler||[]).length?median((LO.oppdrag||[]).filter(o=>o.signert>='2026').map(o=>o.po.direkte)):null)}</b></td><td class="num"></td><td class="num muted">6 600</td><td class="num">4 552</td><td><span class="chip">median direkte kost 2026-oppdrag</span></td></tr>
    </tbody></table></div></div>`;
  $('pane-aar').innerHTML=head+chart+lon+spak;
  document.querySelectorAll('[data-lon]').forEach(b=>b.onclick=()=>{LON=b.dataset.lon;renderAar();});
  const wrap=$('aarChart'),tip=$('aarTip');if(wrap){wrap.querySelectorAll('rect.hit').forEach(r=>{r.addEventListener('mouseenter',()=>{const m=+r.dataset.m;const b=wrap.getBoundingClientRect(),rb=r.getBoundingClientRect();tip.innerHTML=`<b>${MN[m-1]} ${A.year}</b> ${nok(act[m])} · plan ${nok(pl[m])} · ${A.year-1}: ${nok(ly[m])} · ${sold[m]||0} salg`;tip.style.left=(rb.left-b.left+rb.width/2)+'px';tip.style.top=(rb.top-b.top+10)+'px';tip.style.opacity=1;});r.addEventListener('mouseleave',()=>tip.style.opacity=0);});}
}
function median(a){a=a.filter(isNum).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null;}

/* ── PLANEN ─────────────────────────────────────────────────────────────── */
function renderPlan(){
  const P27=S.plan2027,L=S.likviditet||{},K=S.kurver;if(!P27){$('pane-plan').innerHTML='<div class="empty">Plan mangler.</div>';return;}
  const ns=P27.north_star;
  const top=`<div class="statement"><div><span class="k">North Star</span><div class="v xl">1,5 M</div><div class="t">resultat før skatt i 2027 → 3 M i 2029 → 5 M i 2031, etter Sindre-lønn kappet på 7,1 G</div></div>
    <div><span class="k">Hva 2027 faktisk er</span><div class="v md">Ende i pluss</div><div class="t">Absorbere Daniel · bygge kapasitet · bevise spakene · ende i pluss. Gapet til 1,5 M tas i 2028–29. Det er planen rådgiveren godkjente.</div></div>
    <div><span class="k">Hva som avgjør neste år</span><div class="v md">${L.status==='GRØNT'?'Gaten er åpen':'Gaten er stengt'}</div><div class="t">Laveste ventet bank ${nok(L.laveste_plan)} mot buffer ${nok(L.buffer)} → ${L.status==='GRØNT'?'én ansettelse i Q1 kan besluttes':'ingen ansettelse før ' + nok(L.mangler) + ' er lukket'} · frist ${dato(L.gate_frist)}</div></div></div>`;
  const row=(l,f,cls)=>`<tr><td>${l}</td>${P27.scenarioer.map(s=>`<td class="num ${cls||''}">${f(s)}</td>`).join('')}</tr>`;
  const scen=`<div class="card" style="margin-top:14px"><h2>2027 med to bemanninger · samme motor som 1-3-5-planen</h2><div class="sub">${esc(P27.note)}</div>
    <div style="overflow-x:auto"><table style="margin-top:8px"><thead><tr><th>Økonomimotor 2027</th>${P27.scenarioer.map((s,i)=>`<th class="num" style="${i<2?'color:var(--ink)':''}">${esc(s.navn)}</th>`).join('')}</tr></thead><tbody>
    ${row('Rampede stoler ved nyttår + nye',s=>`${s.rampede_ved_start} + ${s.nyansettelser.reduce((a,b)=>a+b,0)}`)}
    ${row('Producing FTE',s=>n1(s.baseline.fte))}
    ${row('Omsetning eks. mva',s=>nok(s.baseline.omsetning))}
    ${row('− meglerkost 55 %',s=>nok(s.baseline.meglerkost),'muted')}
    ${row('− Sindre 7,1 G',s=>nok(s.baseline.sindre),'muted')}
    ${row('− markedskost',s=>nok(s.baseline.markedskost),'muted')}
    ${row('− kostbase',s=>nok(s.baseline.kostbase),'muted')}
    <tr class="total"><td>Resultat baseline</td>${P27.scenarioer.map(s=>`<td class="num" style="color:${s.baseline.resultat>=0?'var(--green)':'var(--red)'}">${nok(s.baseline.resultat)}</td>`).join('')}</tr>
    <tr class="total"><td>Resultat med spakene</td>${P27.scenarioer.map(s=>`<td class="num" style="color:${s.med_spaker.resultat>=0?'var(--green)':'var(--red)'}">${nok(s.med_spaker.resultat)}</td>`).join('')}</tr>
    ${row('Gap til North Star 1,5 M (m/spaker)',s=>nok(s.med_spaker.resultat-ns[2027]))}
    ${row('Signerte oppdrag inn per år',s=>n1(s.baseline.oppdrag_inn))}
    ${row('Omsetning per uke (46 uker)',s=>nok(s.baseline.uke_oms))}
    </tbody></table></div>
    <div class="note">${P27.scenarioer.map(s=>`<b>${esc(s.navn)}:</b> ${esc(s.note)}`).join('<br>')}</div></div>`;
  const gate=`<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Gaten · hva som må være sant før én ansettelse</h2><div class="sub">beslutning 28.08: maks 1 megler Q1 2027, utbytte utsatt, buffer 500k normal / 300k kun styregodkjent</div>
    <ul class="list"><li><span>Laveste ventet bank (plan, P75) ≥ 500k <b>etter</b> ny stol</span><span class="n" style="color:${L.status==='GRØNT'?'var(--green)':'var(--red)'}">${nok(L.laveste_plan)} nå</span></li><li><span>Utbytte formelt utsatt (styret)</span><span class="n">ikke bekreftet</span></li><li><span>Faktiske bankdatoer avstemt (deal-for-deal)</span><span class="n">ikke bekreftet</span></li><li><span>Signert kandidat med startdato, onboarding og ramp</span><span class="n">ikke bekreftet</span></li><li><span>≥ 500k også etter kostnadsavviks-margin</span><span class="n">ikke bekreftet</span></li></ul>
    <div class="note">Sekvensering: bevis 1 stol, frys 1 kvartal, så vurder neste. Kilde: Ansettelsesgate-artifacten / company-state.</div></div>
    <div class="card"><h2>Datagrunnlaget · sannsynlighet for salg</h2><div class="sub">${esc(K?.note||'')} — oppdateres hver natt.</div>
    <div style="overflow-x:auto"><table style="margin-top:8px"><thead><tr><th>Prisklasse</th><th class="num">n</th><th class="num">solgt ≤90 d</th><th class="num">≤180 d</th><th class="num">≤365 d</th><th>grunnlag</th></tr></thead><tbody>${Object.entries(K?.klasser||{}).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="num">${v.n}</td><td class="num">${pct(100*v.solgt_innen_90)}</td><td class="num">${pct(100*v.solgt_innen_180)}</td><td class="num">${pct(100*v.solgt_innen_365)}</td><td class="muted">${v.slatt_sammen_med?`slått sammen med ${esc(v.slatt_sammen_med)} (n=${v.n_brukt})`:'egen kurve'}</td></tr>`).join('')}</tbody></table></div>
    <div class="note">Avsluttede usolgte oppdrag regnes som «selger aldri». Aktive oppdrag teller som usolgt fram til i dag. Kurven blir bedre for hvert salg.</div></div></div>`;
  $('pane-plan').innerHTML=top+scen+gate;
}
init();
</script>

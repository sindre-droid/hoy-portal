edia/b99d91_7937035b8e074c2c85d0f9c7a1075799~mv2.jpg", "_wix_title": "Bayliner Avanti 4085 Express Cruiser", "_wix_year": "1999", "_not_sold": false}, {"slug": "ibiza-881-t-special-edition", "action": "update", "hs_id": "351388463346", "props": {"boat_name": "Ibiza 811 T Special Edition", "page_path2": "ibiza-881-t-special-edition", "merke": "Ibiza", "modell": "811 T Special Edition", "arsmodell": "2019", "lengde_i_fot": "27 fot", "pris": "Solgt!", "price_two": "1095000", "motorfabrikant": "2 x Suzuki 200", "motortype": "Utenbords", "motorstorrelse": "400 HK", "customer_comment": "<p class=\"font_7\"><em><strong>Denne Ibiza 811 T Special Edition er en unik og svært godt utstyrt daycruiser – og den eneste 811<br>\nsom er levert med dobbelmotorinstallasjon. Med høy komfort, praktiske løsninger og solid<br>\nkvalitet er dette en båt som skiller seg ut i både ytelse og design. . En sjelden mulighet til å sikre<br>\nseg en komplett, kraftfull og klar-for-sesongen Ibiza.</strong></em></p>\n<p class=\"font_7\"><br>\nVi har nå gleden av å tilby en Ibiza 811 T Special Edition – en sjelden mulighet for deg som er på utkikk etter en<br>\nkraftfull og gjennomført daycruiser med solid norsk kvalitet og gode sjøegenskaper. Dette er den eneste 811 vi<br>\nkjenner til som er levert med dobbelmotorinstallasjon, noe som både gir imponerende ytelse og trygghet på<br>\nsjøen.</p>\n<p class=\"font_7\"><br>\nBåten fremstår som svært godt vedlikeholdt, med alle servicer utført hos merkeforhandler. Den har ikke vært i<br>\nbruk etter sjøsetting i 2025 (pr. 6. mai), og eier har lagt mye vekt på riktig lagring og vedlikehold gjennom hele<br>\neierskapet. Dette er med andre ord en båt som virkelig er klar for en ny sesong.</p>\n<p class=\"font_7\"><br>\nIbiza 811 T er kjent for sitt brukervennlige design, komfortable cockpit og praktiske løsninger – perfekt for både<br>\ndagsturer og helgeturer med familie og venner. Special Edition-versjonen gir deg et eksklusivt uttrykk og en unik<br>\nsammensetning du ikke finner hos andre modeller på markedet.</p>\n<p class=\"font_7\"><br>\nHer får du en sporty og romslig kvalitetsbåt som kombinerer komfort og kjøreglede på en sjelden god måte.<br>\nBåten ligger klar for visning i Åsgårdstrand – ta kontakt for mer informasjon eller for å avtale tid.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Daniel Ruud + 47 479 61 918</strong></p>\n<p class=\"font_7\"><strong>daniel@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-12-17"}, "image_url": "https://static.wixstatic.com/media/ad1ced_d227a730749242c9a789bd69c14e090e~mv2.webp", "_wix_title": "Ibiza 811 T Special Edition", "_wix_year": "2019", "_not_sold": false}, {"slug": "princess-415", "action": "update", "hs_id": "351417864409", "props": {"boat_name": "Princess 415", "page_path2": "princess-415", "merke": "Princess", "modell": "415", "arsmodell": "1989", "lengde_i_fot": "42 fot", "pris": "Solgt!", "price_two": "999000", "motorfabrikant": "2x Volvo Penta tamd61a", "motortype": "Innenbords", "motorstorrelse": "604 HK", "customer_comment": "<p class=\"font_7\"><strong>House of Yachts har nå en ekte moderne klassiker til salgs; den ultimate Cabincruiser-drømmen fra sent 80-tall, Princess 415. Båten har gjennomgått en omfattende renovering av nåværende eier, og er klar salg og levering.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Den forlengede badeplattformen er meget romslig, og er flott til av- og påstigning, bading, og oppbevaring av jolle eller vannscooter.</p>\n<p class=\"font_7\">Videre har båten en romslig og luksuriøs utendørs aktersalong, med behagelig sofa og mulighet for et salongbord. God plass til solsenger eller dekkstoler etter eget ønske.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Inn skyvedøren finner du salongen, fint innredet med detaljer i lakkert tre og teak. Behagelig lysinnfall fra alle kanter. Mulighet til å trekke igjen skyvedøren og gardiner ut mot akterdekket gir privatliv i havn.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ned trappa finner du en velutstyrt bysse, med ny gasskomfyr, vask, god benkplass og avtrekksvifte. Det er rikelig med oppbevaringsplass til mat og servise, samt 3 kjøleskap. Fremover i båten er det to romslige dobbeltlugarer, med hvert sitt bad. Båten rommer dermed to par eller en familie med høy grad av komfort, over lang tid.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten er nyrenovert, motorene har vært ute og overhalt, og kun gått 30t etter det. Nye gass- og gir-wires. Båten ligger i Kristiansand.&nbsp;</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Ta kontakt med båtmegler Henrik Bratz (47875838) for visning!</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-07-23"}, "image_url": "https://static.wixstatic.com/media/ad1ced_e0205f8aa9b9431ab5eb6a08a42107b8~mv2.webp", "_wix_title": "Princess 415", "_wix_year": "1989", "_not_sold": false}, {"slug": "beneteau-gran-turismo-38", "action": "update", "hs_id": "351456244965", "props": {"boat_name": "Beneteau Gran Turismo 38", "page_path2": "beneteau-gran-turismo-38", "merke": "Beneteau", "modell": "Gran Turismo 38", "arsmodell": "2012", "lengde_i_fot": "40 fot", "pris": "Solgt!", "price_two": "1990000", "motorfabrikant": "2 x Volvo Penta D4-260", "motortype": "Innenbords", "motorstorrelse": "520 HK", "customer_comment": "<p class=\"font_7\"><strong>Vi har nå fått for salg en utrolig flott og velholdt Benetau Gran Turismo 38 som kan</strong></p>\n<p class=\"font_7\"><strong>by på både en romslig cockpit, gode kjøreegenskaper som bidrar til lavt forbruk og et spennende utstyrsnivå. Med joystick styring som sørger for enkel manøvrering og en svært oversiktlig førerposisjon utgjør dette en båt du kan føle deg trygg i og nyte lange dager på sjøen.&nbsp;</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Om båten:</strong></p>\n<p class=\"font_7\">Denne båten kombinerer elegant design med gode ytelser og komfortable løsninger. Den gir en fin balanse mellom gode kjøreegenskaper og komfortabel innredning, noe som gjør den populær blant både erfarne båtfolk og nybegynnere.</p>\n<p class=\"font_7\">Cockpiten består av tre sitteplasser i kjøreretning, en stor sittegruppe med tilhørende bord som gir god plass til hele familien, i tillegg til kjøleskap og kokebluss. Det hele toppes med det elektriske skyvetaket som gjør at du får en fantastisk åpen og fin følelse ombord og dermed får du utnyttet godværsdagene enda mer. Dette må bare oppleves.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Byssa under dekk er smart utført og har masse skapplass. Her finner du et romslig kjøles- kap, dobbelt kokebluss, mikrobølgeovn og vask. Godt lysinnslipp sørger for et lyst og fint miljø. Spisegruppen kan enkelt gjøres om til en seng som rommer to personer. Det er montert TV både i salongen og i forkabin for avslappende kvelder.</p>\n<p class=\"font_7\">Lugarene er romslig og har rikelig med skapplass. Også i lugarene vil du oppleve at det er lyst og åpent med takluker og ventiler i begge. Toalettrommet har praktiske løsninger med god takhøyde, stativ for å henge håndkle, dusj og servant og ett oppgradert toalett fra TMC.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Denne båten er utstyrt med to Volvo Penta D4-motorer som yter totalt 520HK, med tilhørende joystick styring. Timeantall på motor er 966 timer.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Denne båten er registrert i skipsregistret, vi kan derfor tilby gunstig finansiering gjennom vår samarbeidspartner. Båten ligger på Østlandet, visning etter avtale.&nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Verdt å nevne:</p>\n<ul class=\"font_7\">\n  <li><p class=\"font_7\">Ny kalesje ble installert i 2022.</p></li>\n  <li><p class=\"font_7\">Fusion DAB-radio for utmerket lydkvalitet og musikkopplevelse.</p></li>\n  <li>< lby gunstig finansiering og forsikring gjennom vår samarbeidspartner.<br>\nIngen heftelser. Båten ligger i opplag.</em></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><em><strong>Ta kontakt med megler:</strong></em></p>\n<p class=\"font_7\"><strong>Sindre Jacobsen</strong><br>\n+47 938 40 189<br>\nsindre@h-y.no</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><em><strong>Om</strong></em><em><strong> oss:</strong></em><br>\nHouse of Yachts er din selvsagte samarbeidspartner når det kommer til kjøp og salg av båt i annenhåndsmarkedet.</p>\n<p class=\"font_7\">Vi skiller oss fra våre konkurrenter ved å tilby personlig service og rådgiving, bilder og video av ypperste kvalitet, og en enkel og forutsigbar kostnadsmodell.<br>\nVårt fokus er å være en markedsledende aktør og samarbeidspartner, enten du er i markedet for å kjøpe, selge, bytte eller chartre. Sammen kartlegger vi dine behov og ønsker, og finner riktig løsning for deg.<br>\n<br>\nGjennom et etablert internasjonalt nettverk kan vi bistå med å fremskaffe de fleste båter for import, eller tilrettelegge for ditt båthold i utlandet.<br>\nVi kan bistå med frakt, forsikring, finansiering, verdivurdering og verditakst. Vi tar forbehold om eventuelle feil i salgsoppgaven.&nbsp;<br>\nKjøpet er regulert av kjøpsloven eller forbrukerkjøpsloven. Kjøper gjøres uttrykkelig oppmerksom på at House of Yachts AS opererer kun som mellommann og er således ikke solidarisk ansvarlig med selger.<br>\nSelger har opplysningsplikt for eventuelle feil og mangler ved båten.</p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_d3eb2bed2a14496c9fcdd4c466cf55ec~mv2.jpg", "_wix_title": "Windy 39 Camira", "_wix_year": "2014", "_not_sold": false}, {"slug": "nimbus-w9-t-top", "action": "update", "hs_id": "351481042113", "props": {"boat_name": "Nimbus W9 T-Top", "page_path2": "nimbus-w9-t-top", "merke": "Nimbus", "modell": "W9", "arsmodell": "2020", "lengde_i_fot": "31 fot", "pris": d-coupe-905---2x300hk", "action": "update", "hs_id": "351446935756", "props": {"boat_name": "Nordkapp Grand Coupe 905 - 2x300HK", "page_path2": "nordkapp-grand-coupe-905---2x300hk", "merke": "Nordkapp", "modell": "Grand Coupe 905", "arsmodell": "2020", "lengde_i_fot": "30 fot", "pris": "Solgt!", "price_two": "1500000", "motorfabrikant": "2 x Evinrude 200", "motortype": "Utenbords", "motorstorrelse": "400 HK", "customer_comment": "<p class=\"font_7\"><strong>House of Yachts presenterer nå en flott utstyrt Nordkapp 905 Grand Coupe. Med sine 2x200 Evinrude motorer har båten et stort kraftoverskudd, og er god for over 50 knop. Gode sjøegenskaper og mange bruksområder, med stor komfort selv i dårlig vær. Båten er skipsregistrert og kan belånes.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Nordkapp 905 Grand Coupe er en skikkelig kvalitetsbåt for norske forhold. Med solide sjøegenskaper, tøft design og et meget høyt utstyrsnivå er dette et godt valg for deg som søker en allsidig bruksbåt - hvor komfort og estetikk også er vektlagt.</p>\n<p class=\"font_7\">Med 2 store påhengsmotorer har båten et sporty uttrykk. Høye skrogsider, solid rekke og brede passasjer gjør det lett og trygt å bevege seg på båten. Sittegruppen akter har mulighet for tildekking med kalesje. Det er god passasje forbi styrhuset og frem på dekk, hvor det er en flott solmadrass med integrerte koppholdere.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Styrhuset har store vindusflater, og elektrisk åpning/lukking av softtop-taket. Takluka er stor, og med dørene åpne får du mer enn nok luft inn på varme dager, og det er lett å skape gjennomtrekk ned til kabinen. Interiøret viser få tegn til bruk og slitasje. Til babord har du en U-formet sofa med salongbord. Stort kjøleskap med 2 skuffer under passasjerstolen til babord.</p>\n<p class=\"font_7\">Kabinen nede er romslig, med eget toalettrom. En enkeltkøye til babord og stor V-køye forut, gir mulighet til komfortabel overnatting for 3.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten er klar for salg og overtagelse, og ligger på Killingen/Bygdøy i Oslo.</strong></p>\n<p class=\"font_7\"><strong>Ta kontakt med Båtmegler Henrik Bratz på +47 47875838 eller henrik@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-10-02"}, "image_url": "https://static.wixstatic.com/media/ad1ced_d16c4e2ff1034869b119b008fa867754~mv2.webp", "_wix_title": "Nordkapp Grand Coupe 905 - 2x300HK", "_wix_year": "2020", "_not_sold": false}, {"slug": "pershing-64", "action": "update", "hs_id": "351443214523", "props": {"boat_name": "Pershing 64", "page_path2": "pershing-64", "merke": "Pershing", "modell": "64", "arsmodell": "2009", "lengde_i_fot": "64 fot", "pris": "Solgt!", "motorfabrikant": "2 x MAN 1550V12", "motortype": "Innenbords", "motorstorrelse": "3100 HK", "customer_comment": "<p style=\"font-size: 14px;\"><span style=\"font-style:italic;\"><span style=\"font-weight:bold;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\">Bud innkommet. Ta kontakt for ytterligere informasjon.</span></span></span></span></p>\n\n<p style=\"font-size: 14px;\"><span style=\"font-style:italic;\"><span style=\"font-weight:bold;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\">B&aring;ten selges for &euro;870.000,- inkl. EU-MVA.</span></span></span></span></p>\n\n<p style=\"font-size: 14px;\"><br />\n<span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\"><span style=\"font-style:italic;\"><span style=\"font-weight:bold;\">Vi har f&aring;tt inn for salg en meget velholdt Pershing 64. B&aring;ten er fra 2009 og ligger i Kroatia, hvor hun blir profesjonelt ivaretatt &aring;ret rundt. Norskeiet b&aring;t, med stort charterpotensiale.<br />\nEu-mva er betalt, s&aring; b&aring;ten kan fritt flyttes rundt i hele Europa. 2 x Man 1550 V12 motorer, med kun 400 timer gangtid. Arneson overflatedrev s&oslash;rger for h&oslash;y marsjfart, og en toppfart p&aring; hele 46 knop.</span></span><br />\n<br />\n<span style=\"font-weight:bold;\">Om b&aring;ten:</span><br />\nPershing kan sies &aring; v&aelig;re trendsetteren for st&oslash;rre hardtop expresscruisere. En av de mest i&oslash;yenfallende kvalitetene til b&aring;ten er mengden naturlig lys som kommer inn. B&aring;de gjennom den massive frontruen, sidevinduene og de to store soltakene. I tillegg er hele akterveggen i glass som skiller salongen fra akterdekket nedfellbar. Dette skaper en unik harmoni som skyller ut forskjellen mellom &aring; v&aelig;re inne og ute.<br />\nBadeplattformen er stor med enkel adgang opp til akterdekket via trapper p&aring; begge sider. Jollegarasjen heises hydraulisk, og med pasarellen l&oslash;fter du enkelt ut en Williams Jet Tender 325.<br />\nSalongen og akterdekket har meget godt med b&aring;de sitteplasser og solseng. Stor og fin wetbar med grill og vask p&aring; akterdekket. Til babord finner du godt med oppbevaringsplass, elektrisk oppfellbar TV, isbitmaskin og eget rom for bestikk og glass. Brede dollbord p&aring; begge sider av b&aring;ten leder deg trygt frem til fordekket som har en stor solseng.<br />\n<br />\nF&oslash;rerplassen er romslig, med sitteplass for to. Gjennom den store frontruten har du meget godt oversikt i alle fartsomr&aring;der. Instrumenteringen er enkelt og fornuftig plassert innen god rekkevidde. Til babord for f&oslash;rerposisjonen er det en fin L-sofa, slik at ytterliggere to mennesker kan sitte i fartsretning underveis. Fremfor denne g&aring;r det en trapp ned til byssa, som inneholder det du trenger for &aring; lage gode m&aring;ltider ombord. Her finner du ogs&aring; oppvaskmaskin og stort kj&oslash;leskap samt fryser.</span></span></p>\n\n<p style=\"font-size: 14px;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\">B&aring;ten er utstyrt med 3 kabiner + 1 mannskapslugar. I baugen en stor gjestekabin med dobbeltseng, og eget tilh&oslash;rende bad med dusj. Til styrbord har kabinen to separate sengeplasser, ogs&aring; denne har eget bad med adskilt dusj.<br />\nMaster&acute;s cabin ligger midtskips og strekker seg over hele b&aring;tens bredde. Her har du to store garderober med full st&aring;h&oslash;yde, en sjeselong til babord har fantastisk havutsikt sett fra havniv&aring; gjennom store ovale vinduer. Dobbeltseng i midten, og ytterligere skapplass og sminkebord p&aring; styrbord side.<br />\nStort, ekslusivt baderom med meget romslig dusjkabinett og &quot;waterfall&quot; dusj. Master&acute;s cabin har ogs&aring; eget kj&oslash;leskap. Alle kabinene ombord har egen TV.</span></span></p>\n\n<p style=\"font-size: 14px;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\">Under solsengen p&aring; akterdekket er det luke ned til mannskapslugar, romslig kabin med en enkeltseng og adskilt toalettrom.</span></span></p>\n\n<p style=\"font-size: 14px;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\">Fuel: 3500 liter.<br />\nVann: 900 liter.</span></span></p>\n\n<p style=\"font-size: 14px;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\">Prisen er basert p&aring; &euro;870.000 og dagens kurs + norsk mva (25%). Vi tar forbehold om kursendringer.<br />\nGrunnet finn.no retningslinjer m&aring; prisen inkludere norsk mva, men denne selges for &euro;870.000,- inklusiv eu-mva.</span></span></p>\n\n<p style=\"font-size: 14px;\">&nbsp;</p>\n\n<p style=\"font-size: 14px;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\"><span style=\"font-style:italic;\"><span style=\"font-weight:bold;\">B&aring;ten ligger klar visning i Kroatia.<br />\nTa kontakt for ytterliggere informasjon og avtale om visning.</span></span></span></span><br />\n&nbsp;</p>\n\n<p style=\"font-size: 14px;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\"><s     state[phase][b.slug] = { status: 'running' };
    const tr = document.querySelector(`tr[data-slug="${CSS.escape(b.slug)}"]`);
    if (tr) { tr.dataset.status = 'running'; tr.querySelector('.status-pill').className = 'status-pill st-running'; tr.querySelector('.status-pill').textContent = 'RUNNING'; }
  });
  saveState(state);

  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ boats: items.map(b => ({ slug: b.slug, action: b.action, hs_id: b.hs_id, props: b.props, image_url: b.image_url })) }),
    });
    const data = await res.json();
    if (!data.results) throw new Error('Unexpected response: ' + JSON.stringify(data).slice(0,200));

    data.results.forEach(r => {
      state[phase][r.slug] = {
        status: r.ok ? 'done' : 'error',
        hs_id: r.hs_id,
        error: r.error,
        duration_ms: r.duration_ms,
      };
    });
    saveState(state);
    log(`Batch: ${data.ok}/${data.total} OK`, data.failed ? 'log-err' : 'log-ok');
    if (data.failed) {
      data.results.filter(r => !r.ok).forEach(r => log(`  ✗ ${r.slug}: ${(r.error||'').slice(0,140)}`, 'log-err'));
    }
  } catch (e) {
    log('Batch failed: ' + e.message, 'log-err');
    items.forEach(b => {
      state[phase][b.slug] = { status: 'error', error: 'batch-error: ' + e.message };
    });
    saveState(state);
  }
  renderRows();
}

document.getElementById('btn-next').addEventListener('click', async () => {
  const batchSize = parseInt(document.getElementById('batch-size').value, 10) || 10;
  const pending = currentList.filter(b => !state[phase][b.slug] || state[phase][b.slug].status === 'pending');
  if (pending.length === 0) { log('Ingen pending i denne fasen', 'log-ok'); return; }
  const btn = document.getElementById('btn-next');
  btn.disabled = true;
  await runBatch(pending.slice(0, batchSize));
  btn.disabled = false;
});

document.getElementById('btn-retry-errors').addEventListener('click', async () => {
  const errs = currentList.filter(b => state[phase][b.slug]?.status === 'error');
  if (errs.length === 0) { log('Ingen feilede', 'log-ok'); return; }
  log(`Retry ${errs.length} feilede…`);
  const batchSize = parseInt(document.getElementById('batch-size').value, 10) || 10;
  await runBatch(errs.slice(0, batchSize));
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Tilbakestille ALL progress for ' + phase + '-fasen?')) return;
  state[phase] = {};
  saveState(state);
  renderRows();
  log('Progress tilbakestilt for ' + phase);
});

document.getElementById('btn-export').addEventListener('click', () => {
  const lines = ['phase,slug,title,year,action,hs_id,status,duration_ms,error'];
  ['update','create'].forEach(ph => {
    const list = ph === 'update' ? UPDATES : CREATES;
    list.forEach(b => {
      const s = state[ph][b.slug] || { status: 'pending' };
      const e = (s.error||'').replace(/"/g,'""').replace(/\n/g,' ').slice(0,500);
      lines.push([ph, b.slug, '"'+(b._wix_title||'').replace(/"/g,'""')+'"', b._wix_year||'', b.action, s.hs_id||b.hs_id||'', s.status, s.duration_ms||'', '"'+e+'"'].join(','));
    });
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'migration-results.csv';
  a.click();
});

renderRows();
log(`Loaded. Phase 1 UPDATE: ${UPDATES.length} boats. Phase 2 CREATE: ${CREATES.length} boats.`);
</script>
</body></html>

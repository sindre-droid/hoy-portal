_fot": "23 fot", "pris": "Solgt!", "price_two": "1185000", "motorfabrikant": "Mercury Verado 250", "motortype": "Utenbords", "motorstorrelse": "250 HK", "customer_comment": "<p class=\"font_8\"><em><strong>Vi har fått inn for salg en nesten splitter ny Nordkapp 720 Noblesse. Båten er fullstendig topputstyrt, og kan leveres omtrent på dagen. Vi nevner bla: Mercury Vesselview 403, Smart boat one, Hihgline+ pakke og 12 kartplotter fra Garmin.</strong></em></p>\n<p class=\"font_8\"><em><strong>Se full utstyrsliste nederst i prospektet, som du laster ned på våre hjemmesider. Link i margen til høyre.</strong></em></p>\n<p class=\"font_8\"><em><strong>Fantastisk motorisering med Mercury 250 HK. Sømløs giring og voldsomt kraftoverskudd.</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><em><strong>Om båten:</strong></em></p>\n<p class=\"font_8\">Nordkapps 720 Noblesse er en fantastisk familiebåt. Det er fokus på kvalitet, kjøreegenskaper og design. Båten er full av gode løsninger, og svarer til omtrent samtlige forventninger familien ønsker av en dagsbåt eller hyttebåt.</p>\n<p class=\"font_8\">Du får meget godt fartspotensiale i 48 knop, sosial planløsning som inkluderer alle ombord, fantastiske sol og badeforhold, samt alt utstyret du kan drømme om i en 24 foter: WC, kjøleskuff, elektrisk ankervinsj og enkel manøvrering med baugpropell. Kort fortalt en perfekt familiebåt/landstedsbåt.</p>\n<p class=\"font_8\">Denne spesifikke båten er ekstra godt utstyrt utover normalen. Eier har fått satt inn Mercury Vesselview 403 (istedenfor analogt motorinstrument), Det er Smart Boat One og firstMate fra Mercury med 4 fob’er. I tillegg er det oppgraderte høyttallere til Rockford Fosgate, og det er lithium forbruksbatteri.</p>\n<p class=\"font_8\">Båten er skipsregistrert, hvilket gir mulighet for finansering med pant i båt.</p>\n<p class=\"font_8\">Båten ligger i Oslo, og kan vises etter avtale med megler.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Ta kontakt for avtale:</p>\n<p class=\"font_8\"><em><strong>Sindre Jacobsen</strong></em></p>\n<p class=\"font_8\"><em><strong>938 40 189</strong></em></p>\n<p class=\"font_8\"><em><strong>sindre@h-y.no</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><em><strong>Om oss:</strong></em></p>\n<p class=\"font_8\"><em>House of Yachts er din selvsagte samarbeidspartner når det kommer til kjøp og salg av båt i annenhåndsmarkedet.</em></p>\n<p class=\"font_8\"><em>Vi skiller oss fra våre konkurrenter ved å tilby personlig service og rådgiving, bilder og video av ypperste kvalitet, og en enkel og forutsigbar kostnadsmodell. Vårt fokus er å være en markedsledende aktør og samarbeidspartner, enten du er i markedet for å kjøpe, selge, bytte eller chartre.</em></p>\n<p class=\"font_8\"><em>Sammen kartlegger vi dine behov og ønsker, og finner riktig løsning for deg.</em></p>\n<p class=\"font_8\"><em>Gjennom et etablert internasjonalt nettverk kan vi bistå med å fremskaffe de fleste båter for import, eller tilrettelegge for ditt båthold i utlandet.</em></p>\n<p class=\"font_8\"><em>Vi kan bistå med frakt, forsikring, finansiering, verdivurdering og verditakst.</em></p>\n<p class=\"font_8\"><em>Vi tar forbehold om eventuelle feil i salgsoppgaven.</em></p>\n<p class=\"font_8\"><em>Fartøyet selges “as is”. Kjøpet er regulert av kjøpsloven og House of Yachts AS er kun mellomann og således ikke part i kjøpekontrakten.</em></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2022-07-05"}, "image_url": "https://static.wixstatic.com/media/ad1ced_49220baa64cb43b9b042d6c856571acb~mv2.jpg", "_wix_title": "Nordkapp 720 Noblesse", "_wix_year": "2022", "_not_sold": false}, {"slug": "axopar-28-cabin", "action": "update", "hs_id": "351482889416", "props": {"boat_name": "Axopar 28 Cabin", "page_path2": "axopar-28-cabin", "merke": "Axopar", "modell": "28 Cabin", "arsmodell": "2022", "lengde_i_fot": "28 fot", "pris": "Solgt!", "price_two": "1440000", "motorfabrikant": "Yamaha XTO XF375XSA", "motortype": "Utenbords", "motorstorrelse": "375", "customer_comment": "<p class=\"font_8\"><em><strong>Vi har for salg en meget godt utstyrt Axopar 28 Cabin. Båten ble levert ny av Herhold Andersen AS 4 sommeren 2022. Båten er kun brukt 10-12 småturer i Oslofjorden og fremstår derfor som ny. Med Yamaha 375hk på hekken så oppnår du fint en toppfart på godt over 45 knop.</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><em><strong>Hvis du er ute etter store mengder kraft og fraspark, og den banebrytende teknologien Yamahas XTO-serie tilbyr, er Yamaha XTO 375hp V8 valget. Ikke bare er XTO-serien er en ytelsesrevolusjon som vekker oppsikt i havna, men den gir Axopar 28 en helt annen kjøreopplevelse enn de tradisjonelle Axopar 28 båtene som oftest leveres med 300hp.</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><em><strong>Dette eksemplaret er svært godt utstyrt. Du har Webasto varmer for kjøligere høst/vår-utflukter. &nbsp;I tillegg så er båten utstyrt med et ferskvannssystem med 45 L vanntank og 40L septic tank. Under førerstolen finner du en kjøleboks på 42L, og under passasjerstolen en vask tilkoblet ferskvannssystemet. For å sikre enkel enkel manøvring er denne også utstyrt med baugpropell fra Side-Power.</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><em><strong>Båten ligger nå i vinteropplag hos forhandler med gangtid på ca. 50 timer. En godt utstyrt utgave, som må oppleves!</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Om båten:<br>\n</strong>Axopar er et finsk merke som har vunnet hjertet til uttalige nordmenn de siste årene. Med gode kjøreegenskaper og et lukket pilothus så er Axopar 28 Cabin en båt skapt for norske forhold. Den romslige utformingen sikrer god plass til både familie og venner på tur.</p>\n<p class=\"font_8\">Store vindusflater og et enkelt oppsett gjør at kabinen oppleves som romslig tross størrelsen. Store dører og skyveluke i taket gir deg følelsen av å være i en åpen båt på de varmere sommerdagene.&nbsp; Med cabin versjonen får du tilgang på en akterkabin med seng for to personer, to takluker, sidevinduer og indirekte LED belysning. Denne akterkabinen er direkte tilknyttet til pilothuset som både skaper rom for overnatting og som en super oppbevaringsplass/skifterom. I baugen finner du en sosial sittegruppe, samt et separat rom med både toalett og vask.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">I baugen finner du en sosial sitteplass som også kan gjøres om til en stor solseng. Pilothuset huser et oversiktlig dashboard, fører- og passasjerstol, samt en sittebenk med tilhørende ryggstøtte. Her kan både fører og passasjerstol vris rundt, noe som skaper enda en sosial plass. Med noen enkle grep, så kan også begge stolene + sittebenk gjøres om til en ekstra seng. I akter finner vi en romslig kabin med fine detaljer. Med utstyrt akter-kabin skaper man en tredje sosial plass i form av en solseng på dekk.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Axopar 28 Cabin en bestselger fra den finske produsenten. Med plass til opptil fem personer i et lyst og luftig, men værbeskyttet miljø skaper båten rikelig med insentiver for både eier og gjester til å være ombord. Været, spesielt i Norge er uforutsigbart og muligheten for å lukke av deler av båten appellerer derfor til mange.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Båten ligger i Tønsberg og vises etter avtale med megler.<br>\n<br>\nSindre Jacobsen<br>\n938 40 189<br>\nsindre@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2024-01-26"}, "image_url": "https://static.wixstatic.com/media/ad1ced_8458ea53f00247acbd6e8372456916ed~mv2.jpeg", "_wix_title": "Axopar 28 Cabin", "_wix_year": "2022", "_not_sold": false}, {"slug": "goldfish-28-bullet-%23024", "action": "update", "hs_id": "351443263688", "props": {"boat_name": "Goldfish 28 Bullet #024", "page_path2": "goldfish-28-bullet-%23024", "merke": "Goldfish", "modell": "28 Bullet", "arsmodell": "2021", "lengde_i_fot": "28 fot", "pris": "1.340.000,-", "price_two": "1340000", "motorfabrikant": "Mercury 8,2 430", "motortype": "Innenbords", "motorstorrelse": "430 HK", "customer_comment": "<p class=\"font_7\">Vi har for salg en nydelig Goldfish 28 Bullet fra 2021. Mercury 8,2 430 gir toppfart på opp mot 67 knop og med beskjedent timetall fremstår båten godt vedlikeholdt.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">28 Bullet er skarpere og mer aggressiv enn sammenlignbare modeller som Tender og 29/30 Sport. Enkel, lett og svært sportslig er nøkkelord for bullet. Mindre vekt, mer fart og bedre drivstofføkonomi.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Svært pen spec med Branca Black Skrog, Black Carbon Tubes og Silver Grey upholstery.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Av utstyr utover normalen nevner vi bla:</p>\n<p class=\"font_7\">- Mercury Racing ITS</p>\n<p class=\"font_7\">- Trims tabs</p>\n<p class=\"font_7\">- Flagpole</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten ligger i varmt opplag hos Brinkmann &amp; Bredahl i Moss.</p>\n<p class=\"font_7\">Vises kun etter avtale med megler.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ta kontakt med</p>\n<p class=\"font_7\">Sindre Jacobsen</p>\n<p class=\"font_7\">T. 938 40 189</p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_010d5e1fe03d4b2fbf09dbbcb3e401fa~mv2.webp", "_wix_title": "Goldfish 28 Bullet #024", "_wix_year": "2021", "_not_sold": false}, {"slug": "sunseeker-44-camargue", "action": "update", "hs_id": "351481042110", "props": {"boat_name": "Sunseeker 44 Camargue", "page_path2": "sunseeker-44-camargue", "merke": "Sunseeker", "modell": "44 Camargue", "arsmodell": "2000", "lengde_i_fot": "44 fot", "pris": "Solgt!", "price_two": "1740000", "motorfabrikant": "2 x Volvo Penta TAMD 74 EDC", "motortype": "Innenbords", "customer_comment": "<h6 class=\"font_6\"><em><strong>Vi har nå for salg en nydelig, hvit Sunseeker 44 Camargue! Båten er oppgradert i senere år, og med godt, jevnlig vedlikehold fremstår hun som meget pen. Mye utstyr og en svært hyggelig løsning på byssen som er unik for modellen, må sees og oppleves!</strong></em></h6>\n<h6 class=\"font_6\"><em><strong>Båten ligger i Asker, vises kun etter avtale.</strong></em></h6>\n<h6 class=\"font_6\"><br></h6>\n<h6 class=\"font_6\"><strong>Om båten:</strong></h6>\n<h6 class=\"font_6\">Sunseeker 44 Camargue er nærmest som en klassiker å regne i dagens båtpark. Svært gjennomprøvd modell som står seg like godt i dag som da den kom. Nydelige linjer, smarte løsninger og effektiv planløsning er stikkord som kjennetegner båten.</h6>\n<h6 class=\"font_6\">Med en veldig god utstyrsspec ligger alt til rette for både lange ferieturer med hele</h6>\n<h6 class=\"font_6\">familien såvel som raske dagsturer i finværet.</h6>\n<h6 class=\"font_6\">Stor og sosial cockpit med nedfellabart bord. En hyggelig wetbar til styrbord og tre gode sitteplasser i farstretning ved førerposisjonen. Oppgradert navigasjon og radar.</h6>\n<h6 class=\"font_6\">På fordekket finner du en stor avtagbar solseng. Under dekk har du to kabiner med tilhørende toalettrom og dusj, samt en svært hyggelig salong. I byssen har tidligere eier gjort en smart ombygging av bysseområdet som frigjør plass og gir en imponerende størrelse på kjøkkenet. Her finner du både integrert stekeovn, to gassbluss og utslagsvask.</h6>\n<h6 class=\"font_6\">Med generator ombord er nok strøm i uthavn aldri et problem. Båten er også utstyrt med baugpropell for enkel manøvrering.</h6>\n<h6 class=\"font_6\"><br></h6>\n<h6 class=\"font_6\">Utstyr verdt å nevne:</h6>\n<h6 class=\"font_6\">- Generator (overhalt 2023)</h6>\n<h6 class=\"font_6\">- Ankervinsj</h6>\n<h6 class=\"font_6\">- Pasarelle</h6>\n<h6 class=\"font_6\">- Nye niroxx-tekstiler i cockpit</h6>\n<h6 class=\"font_6\">- Ny kalesje</h6>\n<h6 class=\"font_6\">- Raymarine Radar og Kartplotter</h6>\n<h6 class=\"font_6\"><br></h6>\n<h6 class=\"font_6\">Vises etter avtale med megler.</h6>\n<h6 class=\"font_6\">Ta kontakt med</h6>\n<h6 class=\"font_6\">Sindre Jacobsen</h6>\n<h6 class=\"font_6\">938 40 189</h6>\n<h6 class=\"font_6\">sindre@h-y.no</h6>", "activated": "no", "status": "sold", "sold_date_proxy": "2024-06-06"}, "image_url": "https://static.wixstatic.com/media/ad1ced_6bc9cb12ba8a4713a1c6568abec0cac2~mv2.jpg", "_wix_title": "Sunseeker 44 Camargue", "_wix_year": "2000", "_not_sold": false}, {"slug": "riva-dolceriva-48", "action": "update", "hs_id": "351456244966", "props": {"boat_name": "Riva Dolceriva 48", "page_path2": "riva-dolceriva-48", "merke": "Riva", "modell": "Dolceriva 48", "arsmodell": "2022", "lengde_i_fot": "49 fot", "pris": "18.900.000,-", "price_two": "18900000", "motorfabrikant": "2 x Volvo Penta D13-1000", "motortype": "Innenbords", "motorstorrelse": "2000 HK", "customer_comment": "<p class=\"font_7\"><em><strong>Vi har for salg én av kun tre Riva Dolceriva 48 i Norge, og den eneste i fargen Shark Grey. Største motoralternativ med 2x Volvo D13-1000 motorer, i kombinasjon med joystick for enklere manøvrering. Båten er svært godt utstyrt, og har alle tilvalgene en båt som dette skal ha; vi nevner generator, gyrostabilisator, joystickstyring, air condition, icemaker m.m.</strong></em></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Om båten:</strong><br>\nRiva Dolceriva er en mesterklasse i luksus, power og italiensk design. Håndverket og utførelsen er noe av det ypperste som kan kjøpes for penger. Båten er et resultat av en svært vellykket kombinasjon av fremtidsrettet design og tradisjonelle Riva design-elementer.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Dolceriva har en enorm åpen cockpit, som gjør båten til en sikker vinner på solfylte dager. Med et knappetrykk felles en stor biminitopp over cockpiten. Det medfølger kalesjevegger slik at man kan få et komplett lukket kalesjekapell. To store solsenger pryder akterenden av båten. Ved å felle ned transomluken akter, får man ytterligere to solsenger, helt i vannskorpen. Lenger frem i cockpiten er to sidestilte sofaer, med et tilhørende salongbord. Lengst frem er tre førerstoler i fartsretning. Fra førerposisjonen har man en overraskende god sikt, og brytere, joystick og gir er plassert i en behagelig og naturlig posisjon. Med to store multifunksjonsskjermer har man god kontroll over motor- og kartdata. Rett bak kapteinstolen finnes en stor og dyp locker med god oppbevaringsplass.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Gitt båtens linjer er det lett å tenke at dette kun er en forvokst daycruiser. Mange vil derfor bli overrasket over hvor stor båten er under dekk. Her kan inntil fire personer overnatte i overlegen komfort fordelt på to temperaturkontrollerte lugarer, takket være båtens air condition. Ligger man i uthavn, vil du garantert sette pris på at båten er utstyrt med gyrostabilisator fra Seakeeper, som eliminerer inntil 95% av båtens sideveis bevegelser.</p>\n<p class=\"font_7\">Standarden og finishen under dekk er eksklusiv og behagelig. Takhøyden er gjennomgående god. Skinn, glass, mahogni og blankpolert rustfritt stål pryder interiøret i kjent Riva-stil. Fullt utstyrt bysse med kjøl/frys, induksjonstopp, mikrobølgeovn, ice-maker og oppvaskmaskin. Elegant og romslig toalettrom med separat dusj, som har inngang fra både salong og master.</p>\n<p class=\"font_7\">Dette eksemplaret er svært godt utstyrt, med options til en verdi av over 6 MNOK utover standard båt.&nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Full utstyrsliste finner du i salgsprospektet som kan lastes ned fra våre nettsider.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Nøkkelutstyr verdt å nevne:</strong><br>\n- Største motorer 2 x Volvo Penta D13 1000 HK<br>\n- Seakeeper NG6 gyrostabilisator<br>\n- Oppgradert generator: Onan 11 kW<br>\n- Joystickkontroller<br>\n- Super tropic air conditioning<br>\n- 2 lugars layout med gloss mahogany interiør</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten ligger sentralt i Oslo. Vises kun etter avtale.</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/b99d91_932406d6c47f425eb0f7e80ba6c2fdc8~mv2.jpg", "_wix_title": "Riva Dolceriva 48", "_wix_year": "2022", "_not_sold": false}, {"slug": "goldfish-32-sc-2001", "action": "update", "hs_id": "351419699391", "props": {"boat_name": "Goldfish 32 SC 2001", "page_path2": "goldfish-32-sc-2001", "merke": "Goldfish", "modell": "32 SC", "arsmodell": "2001", "lengde_i_fot": "32 fot", "pris": "1.190.000,-", "price_two": "1190000", "motorfabrikant": "2 x Yanmar 6LP-STZE", "motortype": "Innenbords", "motorstorrelse": "540 HK", "customer_comment": "<p class=\"font_7\"><em><strong>Goldfish 32 SC – klassisk skandinavisk kraftpakke med oppgradert teknisk stand</strong></em></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Vi har gleden av å presentere en Goldfish 32 SC fra 2001 – en ekte klassiker fra det norske performance-merket som satte standarden for offshore daycruisere. Denne modellen kombinerer sporty linjer, lav profil og fremragende sjøegenskaper med et tidløst design som fortsatt imponerer.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten fremstår i svært godt vedlikeholdt stand, med omfattende teknisk oppgradering utført vinteren 2023/2024 av Vollen Slipp. Blant annet ble motorene tatt ut og gjennomgått i detalj:&nbsp;</p>\n<ul class=\"font_7\">\n  <li><p class=\"font_7\">Nye dyser&nbsp;</p></li>\n  <li><p class=\"font_7\">Rens av intercooler, turbo og oljekjøler&nbsp;</p></li>\n  <li><p class=\"font_7\">Justerte ventiler&nbsp;</p></li>\n  <li><p class=\"font_7\">Nye reimer&nbsp;</p></li>\n  <li><p class=\"font_7\">Eksosbend og ledningsnett – alt for å sikre maksimal driftssikkerhet og ytelse.</p></li>\n</ul>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Om båten:</strong></p>\n<p class=\"font_7\">Layouten er typisk Goldfish: praktisk og funksjonell, men med fokus på fart og føreropplevelse. Under fordekket finner du en romslig dobbeltkøye og separat toalettrom. Cockpit byr på sosial sittegruppe, nedfellbart pantry og god lagringsplass.</p>\n<p class=\"font_7\">Solseng akter og badeplattform gir enkel tilgang til sjøen – dette er en perfekt båt for raske overfarter, helgeturer eller late dager i solen.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten ligger på Nesodden, visning etter avtale.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ta kontakt med</p>\n<p class=\"font_7\">Sindre Jacobsen</p>\n<p class=\"font_7\">938 40 189</p>\n<p class=\"font_7\">sindre@h-y.no</p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_c0347c1971214a43b58884fe014a4011~mv2.webp", "_wix_title": "Goldfish 32 SC 2001", "_wix_year": "2001", "_not_sold": false}, {"slug": "bavaria-37-cruiser---2006", "action": "update", "hs_id": "351481028816", "props": {"boat_name": "Bavaria 37 Cruiser - 2006", "page_path2": "bavaria-37-cruiser---2006", "merke": "Bavaria", "modell": "37 Cruiser", "arsmodell": "2006", "lengde_i_fot": "37 fot", "pris": "Solgt!", "price_two": "750000", "motorfabrikant": "Volvo Penta D1-30", "motortype": "Innenbords", "motorstorrelse": "28 HK", "customer_comment": "<p class=\"font_8\"><em>House of Yachts Sail Division presenterer nå denne godt utstyrte Bavaria 37 for salg. Båten er tatt godt vare på av sine to eiere, og har hatt vesentlige oppdraderinger i senere år.</em><br>\n<br>\nBavaria 37 passer ypperlig for en familie på 3-4 personer. Størrelsen er en flott kombinasjon av mye plass om bord og enkel håndtering av båten. Denne utgaven er en 2-kabins versjon, som i tillegg til å ha en stor dobbel køye akter, også har et svært romslig oppbevaringsrom med plass til alt fra fendere til gummijolle eller båtsykler.&nbsp;<br>\n<br>\nNåværende eier er en erfaren seiler og har prioritert sikkerhet og utstyr for en trygg og komfortabel seilas. Det er også gjort en rekke oppgraderinger med tanke på instrumentoptimalisering. Insturmentene er koplet sammen NMEA2000 nettverk. B&amp;G Triton multiinstrument, Zeus 9 plotter, VHF med AIS sender og mottaker, Simrad 4G radar, Lithium forbruksbatterier, Seil Elvstrøm HighTec storseil fullspilet m/ vogner og Elvstrøm Genoa 150%, Dynema storseilfall og akterstag. Dyp jernskjøl på 1,95m, for å nevne noe.&nbsp;<br>\n<br>\nBåten er klar for overtagelse 15.juli.&nbsp;<br>\n<br>\n<strong>Båten kan vises etter avtale i Sætre båthavn.&nbsp;</strong><br>\n<br>\n<strong>Ta kontakt med&nbsp;</strong><br>\n<br>\n<strong>Jeanette Arntzen</strong><br>\n<strong>909 39 610</strong><br>\n<strong>jeanette@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2021-11-10"}, "image_url": "https://static.wixstatic.com/media/b99d91_15e81c29c9d34d73ae100b3e49480f2f~mv2.jpg", "_wix_title": "Bavaria 37 Cruiser - 2006", "_wix_year": "2006", "_not_sold": false}, {"slug": "fjord-terne-24", "action": "update", "hs_id": "351479119074", "props": {"boat_name": "Fjord Terne 24", "page_path2": "fjord-terne-24", "merke": "Fjord Terne", "modell": "24", "arsmodell": "2006", "lengde_i_fot": "24 fot", "pris": "Solgt!", "price_two": "480000", "motorfabrikant": "Yanmar", "motortype": "Innenbords", "motorstorrelse": "95 HK", "customer_comment": "<p class=\"font_7\"><strong>House of Yachts har nå for salg en Fjord Terne 24. Tidløs klassiker, bygget i tradisjonelle linjer med Skandinavisk håndverk. Ingen motorbåt er vel mer synonym med sommer på fjorden, som Fjord Ternen.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Dette eksemplaret fra 2006 er velutstyrt, og nylig gjennomgått med service hos Killingen. Skrog, dekk, puter og kabin er i fin stand for alderen, men det må nok påregnes noen timer på å gjenopplive treverk i interiøret, eller foreta enkelte utskiftninger.</p>\n<p class=\"font_7\">Med Yanmar innenbords dieselmotor er båten velbalansert. Fjord Ternen når lett sin karakteristiske halvplan, som er meget behagelig og drivstoffeffektiv. Det er ingen merkbar terskel der båten skal ut av vannet, og akselerasjonen føles uanstrengt.</p>\n<p class=\"font_7\"><strong>Båten ligger i Oslo, og er klar for besiktigelse.&nbsp;</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Ta kontakt med megler Henrik Bratz på:</strong></p>\n<p class=\"font_7\"><strong>Tel: 47875838</strong></p>\n<p class=\"font_7\"><strong>Email: henrik@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-08-08"}, "image_url": "https://static.wixstatic.com/media/ad1ced_6b2cbd2981b148bba0bf8d353bce5f3c~mv2.webp", "_wix_title": "Fjord Terne 24", "_wix_year": "2006", "_not_sold": false}, {"slug": "bavaria-e34-fly", "action": "update", "hs_id": "351482889412", "props": {"boat_name": "Bavaria E34 Fly", "page_path2": "bavaria-e34-fly", "merke": "Bavaria", "modell": "E34 Fly", "arsmodell": "2019", "lengde_i_fot": "34 fot", "pris": "Solgt!", "price_two": "2670000", "motorfabrikant": "Volvo Penta D3-220", "motortype": "Innenbords", "motorstorrelse": "220 HK", "customer_comment": "<p class=\"font_7\"><em><strong>Vi har for salg en fantastisk, ferieklar Bavaria E34 Fly. Båten er en 2019 modell som ble tatt i bruk første gang sesongen 2021. Kun én eier, med full servicehistorikk og profesjonelt opplag og vedlikehold. Hun ligger klar for overtakelse i Østfold. Meget godt utstyrt og oppgradert båt, her ligger alt til rette for familien som skal på tur.</strong></em></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><em><strong>E 34 Fly svarer på svært mange av kriteriene du som båteier i denne kategorien er ute etter. Som bobåt, hytte på sjøen, weekendcruiser eller den ultimate uthavns-båten for lange ferier egner hun seg svært godt. Strake akslinger og kjøl bidrar til stabilitet under gange og svært lave drivstoffkostnader. 6-7 liter pr. time i 2400 omdreininger og 6-7 knop er optimalt for behagelige overfarter.</strong></em></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Om båten:</strong></p>\n<p class=\"font_7\">Den revolusjonerende og prisbelønte E-serien fra Bavaria tok</p>\n<p class=\"font_7\">markedet med storm fra start. En helt ny måte å tenke båtliv på hvor bokomfort, plassutnyttelse og økonomiske driftskostnader la grunnlaget. Bavaria var tidlig ute i en økende trend hvor saktegående båter med fokus på komfort er svært etterspurt.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten er proppfull med utstyr, og byr samtidig på mest plass og bo komfort av alle sine konkurrenter i klassen. Du finner to store lukkede lugarer, to toalettrom og en separat dusj, perfekt for hele familien. Grunnet de store vinduene er lysinnslippet utmerket og bidrar til det lyse og moderne inntrykket du får i salongen. Midtmontert styreposisjon gir deg full kontroll og svært god oversikt over alt rundt deg.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Flybridge med styreposisjon, sofagruppe og solseng inviterer til god oversikt og kremutsikt under lange overfarter i fint vær.</p>\n<p class=\"font_7\">Av utstyr nevner vi blandt annet: Baug og hekkthruster, Nedsenkbar badeplattform og Ankervinsj akter. Lithium batterier, Ettermontert baugspyd og Blendingstrekk til vinduene er alle ekstrautstyrspunkter som gjør båten meget behagelig i bruk.&nbsp;</p>\n<p class=\"font_7\">Se forøvrig komplett utstyrsliste i prospektet du laster ned fra våre nettsider. Link i margen til høyre.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten ligger nå klargjort på sjøen i Østfold.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Vises kun etter avtale med megler</p>", "activated": "no", "status": "sold", "sold_date_proxy": "2024-01-26"}, "image_url": "https://static.wixstatic.com/media/ad1ced_fed4721aa2144a788223e2ed384cddf7~mv2.jpg", "_wix_title": "Bavaria E34 Fly", "_wix_year": "2019", "_not_sold": false}, {"slug": "nimbus-230r---2007", "action": "update", "hs_id": "351443229934", "props": {"boat_name": "Nimbus 230R - 2007", "page_path2": "nimbus-230r---2007", "merke": "Nimbus", "modell": "230R", "arsmodell": "2007", "lengde_i_fot": "23 fot", "pris": "460.000,-", "price_two": "460000", "motorfabrikant": "Volvo Penta D3-190", "motortype": "Innenbords", "motorstorrelse": "190 HK", "customer_comment": "<p class=\"font_7\"><strong>Flott eksemplar av klassikeren Nimbus 230R selges nå hos House of Yachts.</strong></p>\n<p class=\"font_7\">Båten er fra 2007, og er meget godt ettersett hele veien. Den har fått innendørs opplag og service på samme sted i ca 15 år, hos Drøbak Båtservice AS.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Dette eksemplaret har <strong>nytt </strong>&nbsp;stort kapell / akterkalesje, som er både kostbart og sjeldent ekstrautstyr på 230R, samt oppgradert kartplotter og stereo.</p>\n<p class=\"font_7\">Båten har den foretrukne dieselmotoren, Volvo Penta D3-190. Motoren er kyndig ettersett i hele båtens levetid, går meget pent og viser ingen aldringstegn. Timetallet på 748 er på ingen måte avskrekkende, når vi vet at båten har ryddig servicehistorikk.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Nimbus 230R har virkelig blitt en moderne klassiker, hvor prisene igjen har begynt å øke. Mange har et forhold til den fra da den ble lansert, og søker tilbake til et velprøvd design med solide sjøegenskaper og fornuftige løsninger.</p>\n<p class=\"font_7\">Ta kontakt i dag for visning – båten ligger i Oslo-området og er klar for overlevering.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Prospekt med full utstyrsliste, samt flere bilder, kan fremsendes ved kontakt, eller via nedlasting i margen til venstre.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Kontakt:</strong></p>\n<p class=\"font_7\"><strong>Båtmegler Henrik Bratz</strong></p>\n<p class=\"font_7\"><strong>47875838</strong></p>\n<p class=\"font_7\"><strong>Henrik@h-y.no</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_da005ae0501140c1920a75086b13bbc6~mv2.webp", "_wix_title": "Nimbus 230R - 2007", "_wix_year": "2007", "_not_sold": false}, {"slug": "nord-west-370-coup%C3%A9", "action": "update", "hs_id": "351484720350", "props": {"boat_name": "Nord West 370 Coupé", "page_path2": "nord-west-370-coup%C3%A9", "merke": "Nord West", "modell": "370 Coupé", "arsmodell": "2010", "lengde_i_fot": "36 fot", "pris": "Solgt!", "price_two": "1990000", "motorfabrikant": "Volvo Penta D4", "motortype": "Innenbords", "motorstorrelse": "520 HK", "customer_comment": "<p class=\"font_7\">Tidløs klassiker fra Nord West 370 Coupé er et referansepunkt for skandinavisk båtbygging.</p>\n<p class=\"font_7\">Med sitt elegante design, kompromissløse håndverk og velkjente sjøegenskaper, representerer den det beste av komfort og kvalitet på sjøen.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Nord West 370 Coupé er et gjennomført kvalitetsprodukt, kjent for sin solide konstruksjon, høye komfort og utsøkte håndverk. Dette er en båt som kombinerer klassisk skandinavisk design med moderne funksjonalitet, og gir en følelse av kvalitet i alle detaljer.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Innredningen er håndbygget i vakkert treverk og skinn, med en lys og innbydende salong. Rundt salongbordet er det god plass til både familie og venner, og den praktiske byssa er utstyrt med alt man trenger for lengre opphold om bord – kombiovn, to kjøleskap, gassbluss og rikelig skapplass.&nbsp;</p>\n<p class=\"font_7\">Sett med originalt Nord West-bestikk og håndblåste krystallglass underbygger kvalitetsfølelsen og helheten i</p>\n<p class=\"font_7\">interiøret.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Med tre lugarer, separat bad med dusj og gjennomtenkte løsninger overalt, byr båten Innenbords", "motorstorrelse": "29 HK", "customer_comment": "<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\"><span style=\"font-weight:bold\"><span style=\"font-style:italic\">Vi har f&aring;tt inn for salg en meget oppgradert og velholdt Bavaria 37 AC. Kun 1 eier, som har kontinuerlig oppgradert og ivaretatt henne. I 2014 - 2015 gikk b&aring;ten gjennom en totalrenovering som kostet ca 500.000,-. Dette ga b&aring;ten et betydelig l&oslash;ft, og fremstilte den som ny. B&aring;ten fremst&aring;r n&aring; unik mot andre Bavaria modeller, med moderne fargevalg, skikkelig rigg og seil og oppgraderte vinsjer.</span></span></span></span><br />\n&nbsp;</p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\"><span style=\"font-weight:bold\">Om b&aring;ten:</span><br />\nBavaria 37 AC er en romslig og lettseilt familieb&aring;t med 2 lugarer.&nbsp;<br />\nStor salong med U-sofa til styrbord og to gode stoler motsatt. Bord i mellom gir plass til mange mennesker.<br />\n<br />\nDa dette er en 2 kabiners-versjon er kabinen i baugen stor, noe ogs&aring; toalettrommet er akter. I tillegg er det en fin akterkabin under cockpit.<br />\nDet er ogs&aring; godt med oppbevaringsplass i hele b&aring;ten.</span></span></p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">Stor bysse til babord i direkte adkomst fra trapp ned til salong, kartbord til styrbord.</span></span></p>\n\n<p style=\"font-size:14px\"><br />\n<span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\"><span style=\"font-weight:bold\">Oppgraderinger:</span><br />\nB&aring;ten er kontinerlig oppgradert gjennom sin levetid, men den st&oslash;rste oppgraderingen ble gjort mellom 2015 og 2016 hos MK Baat. Dette arbeidet er omfattende og detaljert, det finnes dokumentasjon ned til minste detalj.&nbsp;<br />\nTa kontakt dersom du &oslash;nsker dette tilsendt. Her er en kort liste over det som er utf&oslash;rt:<br />\n<br />\n<span style=\"font-weight:bold\">Dekk og skrog:</span><br />\n- Skrog slip helt ned og bygd opp igjen med flere lag epoxy primer og nytt bunnstoff. (skroget hadde ingen tegn til plastpest)<br />\n- Fjernet gammelt teakdekk, slip og lagt p&aring; epoxydekke i gr&aring;tt, med antiskli-belegg<br />\n- Spraylakkert nye dekor-linjer i gr&aring;tt p&aring; overbygg og skrogsider<br />\n- Rengjort, slipt og natet om teak i cockpit og baugspyd<br />\n<br />\n<span style=\"font-weight:bold\">Ettermontert utstyr:</span><br />\n- Nye Dyneema fall og skj&oslash;t (top of the line kvalitet)<br />\n- Ny topplanterne (LED)<br />\n- Ny Windex<br />\n- Ny vindgiver i mastetopp<br />\n- Ny bomvang<br />\n- Nytt Elgskinn sydd p&aring; ratt<br />\n- Nytt cockpitbord montert<br />\n- Nye rekkewire begge sider<br />\n- Nye vantbeskyttere begge sider<br />\n- Nye blokker og winsj-avlastere, alt av h&oslash;y kvalitet<br />\n- Nye kraftige Winsjer, Andersen rustfrie, oppgradert st&oslash;rrelse (Andersen 46 ST skj&oslash;tewinsjer, Andersen 40 ST fallwinsjer)<br />\n- Ny kartplotter Raymarine C97<br />\n<br />\n<span style=\"font-weight:bold\">Seil:</span><br />\n- Nytt storseil og ny rullegenoa, elvstr&oslash;m epex i vectran og technora med dobbel tafetta. Begge uv-beskyttet.<br />\n- Seilareaet har &oslash;kt fra standard 61m2 til 69m2, noe som merkes godt ved seiling i lett vind.<br />\n- Storseil har positivt akterlik og st&aring;ende karbonspiler i full lengde. Det er innrullbart og enkelt &aring; h&aring;ndtere. Areal 35,3 m2.<br />\n- Seilene er vinterlagret og ettersett hos Elvstr&oslash;m i T&oslash;nsberg, senest vinter 2018.<br />\n- Det medf&oslash;lger en nesten ubrukt Genaker, triradial, i r&oslash;dt og gr&aring;tt.<br />\n<br />\n<span style=\"font-weight:bold\">Rigg:</span><br />\n- Fullt rigg-ettersyn hos MK baat og senere fintrim av rigg hos Elvstr&oslash;m Seil.<br />\n<br />\nDet er ogs&aring; byttet batteribank i 2016, (1 start, 3 forbruk)<br />\n<br />\n<span style=\"font-weight:bold\"><span style=\"font-style:italic\">Se utstyrsliste nedenfor.</span></span></span></span></p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\"><span style=\"font-weight:bold\"><span style=\"font-style:italic\">B&aring;ten ligger klar visning i n&aelig;rheten av Drammen.</span></span><br />\n<span style=\"font-weight:bold\"><span style=\"font-style:italic\">Ta kontakt for ytterliggere informasjon og avtale om visning.</span></span><br />\n<br />\n<span style=\"font-weight:bold\">Torben Kragstad<br />\n916 16 767<br />\ntorben@kragstad.no</span><br />\n<br />\n<span style=\"font-weight:bold\"><span style=\"font-style:italic\">eller</span></span></span></span><br />\n&nbsp;</p>\n\n<p style=\"font-size:14px\"><span style=\"font-weight:bold\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">Sindre Jacobsen<br />\n938 40 189<br />\nsindre@kragstadpartners.no</span></span></span></p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\"><span class=\"wixGuard\">​</span></span></span></p>\n\n<h2 style=\"font-size:14px\"><span style=\"font-weight:bold\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">Utstyr</span></span></span></h2>\n\n<p style=\"font-size:14px\">&nbsp;</p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">- 2 kabinsversjon<br />\n- Motor: Volvo Penta MD 2030 29 Hk med seildrev og 2 krets kj&oslash;ling.<br />\n- 150 l ferskvannstank<br />\n- Rulleforstag og rullemast<br />\n- Stort ratt (tilvalg &ndash; bedre &aring; ratte for seil)<br />\n- Ankerwinsj foran med fjernkontroll, 15 kg Bruceanker og 50 m kjetting<br />\n- Dusj med v/k vann ute<br />\n- Webasto 5kw varmer med 5 utbl&aring;sningspunkter _7\"><br></p>\n<p class=\"font_7\"><strong>OM BÅTEN:<br>\n2016 Lagoon 560 S2 med MYE utstyr! EU VAT og Norsk MVA er ikke betalt.<br>\nDenne 5+2 kabiners versjonen er svært godt vedlikeholdt og fremstår ikke som en tradisjonell \"sliten\" charterbåt du normalt finner i middelhavet. Her har Norsk eier fulgt opp båten svært nøye i samråd med kvalifiserte fagfolk.</strong></p>\n<p class=\"font_7\"><strong>Hun er meget godt utstyrt, og utover normalen nevner vi blandt annet:</strong><br>\n<br>\n- Tenderlift Hydraulic Platform (350kg)<br>\n- Watermaker 280l/h Sea Recovery Aquamatic<br>\n- Bose Lifestyle V25 HIFI/DVD Home Cinema in saloon &amp; 4 speakers in cockpit &amp; fly<br>\n- Largest engines:&nbsp;2 x 110 HP (Yanmar 4JH4-110) WITH STRAIGHT SHAFT<br>\n-&nbsp;ONAN GENSET 17,5Kva 1500rpm 220V / 50 Hz + COCOON</p>\n<p class=\"font_7\">2016 Lagoon 560 S2 – en lekker katamaran som gir deg den ultimate blandingen av fart, komfort og stil. Båten har et romslig interiør og alle toppmoderne bekvemmeligheter, noe som gjør den ideell for både korte turer og lange eventyr.<br>\nLagoon 560 S2 har hele fem komfortable lugarer, hver med sitt eget bad, slik at opptil ti personer kan sove behagelig. Det er også en mannskapslugar med eget toalett, så alle om bord kan nyte litt privatliv og ro.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Innvendig er det lagt vekt på eleganse, med bruk av førsteklasses materialer som skaper en varm og innbydende atmosfære. I salongen er det store vinduer som slipper inn rikelig med dagslys, og kjøkkenet er fullt utstyrt med alt du trenger for å lage deilige måltider til gjestene dine.<br>\nUtenfor tilbyr Lagoon 560 S2 en rekke sosiale soner for avslapping, spising og solbading. Cockpiten har et stort bord, perfekt for utendørs måltider, og det er koselige sitteområder for å slappe av og nyte utsikten. På flybridge-dekket har kapteinen full overiskt og kontroll, mens det på fordekket er enormt med plass for gjester.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Med toppmoderne funksjoner og teknologi kan du være sikker på en komfortabel og problemfri seilopplevelse. Båtens sterke motorer gir deg god kraft, og avanserte navigasjons- og kommunikasjonssystemer sikrer en trygg og smidig reise.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Alt i alt er denne Lagoon 560 S2 en eksepsjonell båt som gir deg den perfekte kombinasjonen av luksus og ytelse. Enten du planlegger en avslappende familieferie eller et minneverdig eventyr med venner, vil denne båten gi deg en uforglemmelig opplevelse på vannet.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten ligger i Kroatia.<br>\nKan vises etter avtale med megler:</strong><br>\n<br>\n<strong>Sindre Jacobsen</strong><br>\n<strong>+ 47 938 40189</strong><br>\n<strong>sindre@h-y.no</strong><br>\n<br>\nOm oss:<br>\n<em>House of Yachts er din selvsagte samarbeidspartner når det kommer til kjøp og salg av båt i annenhåndsmarkedet.</em><br>\n<em>Vi skiller oss fra våre konkurrenter ved å tilby personlig service og rådgiving, og en enkel og forutsigbar kostnadsmodell.</em><br>\n<em>Vårt fokus er å være en markedsledende aktør og samarbeidspartner, enten du er i markedet for å kjøpe, selge, bytte eller charter. Sammen kartlegger vi dine behov og ønsker, og finner riktig løsning for deg.</em><br>\n<br>\n<em>Gjennom et etablert internasjonalt nettverk kan vi bistå med å fremskaffe de fleste båter for import, eller tilrettelegge for ditt båthold i utlandet.</em><br>\n<em>Vi kan bistå med frakt, forsikring, finansiering, verdivurdering og verditakst. Vi tar forbehold om eventuelle feil i salgsoppgaven.</em><br>\n<em>Fartøyet selges “as is”. Kjøpet er regulert av kjøpsloven og House of Yachts AS er kun</em><br>\n<em>mellomann og således ikke part i kjøpekontrakten.</em></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-02-25"}, "image_url": "https://static.wixstatic.com/media/ad1ced_0d856e7734d14707bfbefe8a54d7ac61~mv2.jpg", "_ kap. De to stikk-kabinene akter er lyse og innbydende, med køyer, skap og en liten benk.</p>\n<p class=\"font_7\">Toalettet/badet er akkurat som forventet; Velkjent Jabsco pumpetoalett og en håndvask med mulighet for dusjing dekker alle behovene en familie eller vennegjeng på tur måtte ha.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Til sjøs er Dufour Grand Large 385 en forutsigbar og enkel seiler. Rullemast- og genua reduserer behovet for å gå frem på dekk når en er ute til sjøs betraktelig, og er velkomment under seilas med familie. I gode forhold får du lett god fart i skroget. Man krysser uproblematisk alene, med hovedvinsjene plassert nærme styreposisjonene. For motor holder du greit 7 knop med lav belastning på motoren.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten ligger på Oksenøya Marina, klar til fremvisning.</p>\n<p class=\"font_7\"><strong>Ta kontakt med:</strong></p>\n<p class=\"font_7\">Henrik Bratz</p>\n<p class=\"font_7\">47 87 58 38</p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-03-27"}, "image_url": "https://static.wixstatic.com/media/ad1ced_18fae41c399542f98dcd7017ed3668e9~mv2.jpg", "_wix_title": "Dufour 385 GL", "_wix_year": "2005", "_not_sold": false}, {"slug": "goldfish-29-rib-tender---2009", "action": "update", "hs_id": "351446935762", "props": {"boat_name": "Goldfish 29 RIB Tender - 2009", "page_path2": "goldfish-29-rib-tender---2009", "merke": "Goldfish", "modell": "29 RIB Tender", "arsmodell": "2009", "lengde_i_fot": "29 fot", "pris": "789.000,-", "price_two": "789000", "motorfabrikant": "Mercruiser 8,2l", "motortype": "Innenbords", "motorstorrelse": "425 HK", "customer_comment": "<p class=\"font_7\">Strøken klassiker fra Goldfish – 29 Tender er en av modellene som virkelig har satt standarden<br>\nfor hva en RIB kan være. Med sitt tidløse design, kompromissløse byggekvalitet og legendariske<br>\nkjøreegenskaper, leverer denne båten en kjøreopplevelse få andre kan matche.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Vi har gleden av å presentere en Goldfish 29 RIB Tender fra 2009, en båt som kombinerer<br>\nklassisk Goldfish-DNA med solid historikk og nøye oppfølging.<br>\nDenne båten har kun hatt to voksne eiere. Den har alltid stått tørt og trygt innendørs i<br>\noppvarmet lokale, og alt vedlikehold er utført hos autoriserte verksteder. Med komplett<br>\ndokumentasjon og kvitteringer fra ny, får man full trygghet for at båten er fulgt opp slik den skal.<br>\n</p>\n<p class=\"font_7\">Motoren, en MerCruiser 8.2L V8 Magnum, byr på brutal kraft og den velkjente V8-lyden. Takket<br>\nvære nytt eksosanlegg med Silent Choice kan lyden styres med fjernkontroll – fra stillegående<br>\ncruising til rått og heftig brøl. I tillegg er kostbare oppgraderinger allerede gjort de siste årene,<br>\ninkludert starter, dynamo, vannpumpe, tennplugger og kabler, samt stor service. Ny propell ble<br>\nmontert for to år siden.<br>\n</p>\n<p class=\"font_7\">Dette er en båt som gir den ekte Goldfish-opplevelsen, en kombinasjon av kraft, presise<br>\nsjøegenskaper og tidløst design. En sjelden mulighet til å skaffe seg en velholdt klassiker, klar<br>\nfor mange nye sesonger på vannet.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Ta kontakt for Visning</strong></p>\n<p class=\"font_7\"><strong>Daniel Ruud</strong></p>\n<p class=\"font_7\"><strong>479 61 918</strong></p>\n<p class=\"font_7\"><strong>Daniel@h-y.no</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_d4055e6187d142f9a545e4474307e60d~mv2.webp", "_wix_title": "Goldfish 29 RIB Tender - 2009", "_wix_year": "2009", "_not_sold": false}, {"slug": "goldfish-28-tender-%23064", "action": "update", "hs_id": "351419699407", "props": {"boat_name": "Goldfish 28 Tender #064", "page_path2": "goldfish-28-tender-%23064", "merke": "Goldfish", "modell": "28 Tender", "arsmodell": "2022", "lengde_i_fot": "30 fot", "pris": "Solgt!", "price_two": "1290 "motorfabrikant": "Volvo Penta D6-370", "motortype": "Innenbords", "motorstorrelse": "370 HK", "customer_comment": "<p class=\"font_7\">House of Yachts har nå for salg en relativt lite brukt og pen Skorgenes 350 Fly. Skorgenes er kjent for båter preget av godt</p>\n<p class=\"font_7\">håndverk, laget for nordiske forhold. Med 2 romslige kabiner, stort akterdekk og en velutformet flybridge, synes vi båten har</p>\n<p class=\"font_7\">mye å by på i en relativt beskjeden størrelse og pris.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Akterdekket i teak har god plass til bord og stoler, og med kalesjen nede blir det et flott oppholdsrom også om kvelden eller i</p>\n<p class=\"font_7\">dårlig vær. Det er en solid og god trapp opp til flybridgen, som også er pent utført med komfortabelt møblement samt</p>\n<p class=\"font_7\">velutformet styreposisjon. Flybridgen har godt med solsenger, og vi er særlig begeistret for den bakovervendte og meget</p>\n<p class=\"font_7\">behagelige solsengen til styrbord.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Inn skyvedøren finner du først byssa til styrbord, og en sosial sittegruppe til babord. Salongen er preget av fine materialvalg og få tegn til slitasje.</p>\n<p class=\"font_7\">Ved styreposisjonen inne, finner du en komfortabel kapteinstol, og et oversiktlig dashbord med oppgradert Raymarine</p>\n<p class=\"font_7\">navigasjonselektronikk. Lenger frem i båten finner du en dobbel kabin helt forut, et veldig pent og praktisk utformet bad, samt en dobbel stikk-kabin til babord.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten har blitt godt vedlikeholdt, og har kun rett over 1000t på Volvo Penta D6-370-motoren. Fast aksel er nok litt mer</p>\n<p class=\"font_7\">bekymrings- og vedlikeholdsfritt enn andre løsninger med hekkaggregat, og med kraftig thruster foran og akter er båten</p>\n<p class=\"font_7\">fortsatt lettmanøvrert i havn og trange farvann. Motoren er kjent for lav vibrasjon og lite støy, og passer båten godt. Den var</p>\n<p class=\"font_7\">sist på land om våren 2025, hvor den ble slipt og stoffet, samt fikk annet vedlikehold.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten ligger i Dilling/Moss, og er klar for visning. Kontakt båtmegler Henrik Olaf Bratz for mer info, bilder eller visning.</p>\n<p class=\"font_7\">47875838 – henrik@h-y.no</p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-12-17"}, "image_url": "https://static.wixstatic.com/media/ad1ced_e60e45d4d34a483e8e923628d86c72d2~mv2.webp", "_wix_title": "Skorgenes 350 Fly", "_wix_year": "2007", "_not_sold": false}, {"slug": "swan-48", "action": "update", "hs_id": "351417864416", "props": {"boat_name": "Swan 48", "page_path2": "swan-48", "merke": "Swan", "modell": "48", "arsmodell": "2000", "lengde_i_fot": "48 fot", "pris": "Solgt!", "price_two": "3990000", "motorfabrikant": "Volvo D2-75", "motortype": "Innenbords", "motorstorrelse": "75 HK", "customer_comment": "<p class=\"font_7\"><strong>House of Yachts har gleden av å presentere et vakkert og meget velholdt eksemplar av den legendariske Swan 48. S/Y Galatea er produsert i Finland i år 2000, og representerer etter vårt syn den høyeste kvaliteten og komforten du finner i noen båt i samme kategori. Swan har gjort ytelse og komfort av ypperste klasse til sitt varemerke, og i denne 48’en tegnet av German Frers, har de truffet blink på alle mulige måter. Eleganse og komfort, en lett håndterbar størrelse, i kombinasjon med uslåelige seilegenskaper både i skjærgården og til havs, gjør Swan 48 til et perfekt valg for den kresne. Flere bilder, 3D-tour og prospekt med full utstyrsliste er tilgjengelig på House of Yachts’ hjemmeside.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Swan 48 har en flott layout på dekk, med hovedcockpit helt akter, et lite brodekk, samt en liten cockpit/sittebrønn ved luka ned til salongen. Båten kan fint seiles av en person. I regattasituasjoner eller seilas med aktivt mannskap er layouten meget hensiktsmessig. Stort ratt helt akter gjør finjusteringer på roret enkelt, og 5 store Lewmar Wincher hvorav 2 elektriske rundt cockpit gir fleksibilitet på seilføringen. Hovedcockpit har en stor beskyttende Sprayhood, samt en enkel luke direkte til eierkabinen.</p>\n<p class=\"font_7\">Skinnen til storseilskjøtet løper over brodekket foran sprayhooden, og er dermed ute av veien for mannskap og gjester. Foran skinnen finnes en liten fremskutt cockpit/sittebrønn, med egen sprayhood rundt luka samt to wincher. Fall og reveliner er trukket bakover mot cockpit, på hver side av sprayhooden. Dekket er selvfølgelig teak, og helt i baugen har båten baugspyd, perfekt for en code 0 eller genaker.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ned luka og hovedtrappa midt i båten, kommer du rett inn i salongen. Førsteinntrykket er velkjent Swan - lakkert kvalitetshåndverk, bygget av noen av verdens beste båtbyggere. Båten viser ingen tegn til slitasje nede, tross sine 25 år. Kartbord til styrbord, bysse til babord, og en behagelig salong med stor sofa samt spisestoler. Fremover i båten finnes to gjestekabiner med to køyer hver, samt et gjestebad i forpiggen.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Akter finnes en luksuriøs en suite eierkabin. &nbsp;God skapplass, masse komfort, stort speil og et separat bad, legger alt til rette for et behagelig liv til sjøs. Multi-instrumentene for vind, fart og kurs, har selvfølgelig egen monitor over sengen i eierkabinen. Swanens performance-DNA er dermed merkbart hele tiden, til tross for et høyt nivå av komfort og estetikk.</p>\n<p class=\"font_7\">S/Y Galatea er meget godt utstyrt, og har en flott vedlikeholdshistorikk, bl.a. med innendørs vinteropplag på Orust frem til 2024. Rod-rigg og elektriske wincher er selvfølgelig på plass - les på vår hjemmeside og last ned prospekt der for komplett utstyrsliste. Båten har blitt spart for lange havkryssinger, og har aldri vært over Atlanterhavet. Galatea er meget kapabel til lengre havstrekk med dagens utstyrsnivå.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten er salgsklar med motivert selger. Klar for salg og overtagelse omgående.&nbsp;</p>\n<p class=\"font_7\">Kontakt båtmegler Henrik Bratz på 47875838 for mer info, og avtale om visning av den unikt vakre Swan 48 S/Y Galatea.&nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Prospekt med full utstyrsliste lastes ned i fanen til venstre.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">&lt;iframe width=\"853\" height=\"480\" src=\"<a href=\"https://my.matterport.com/show/?m=LYfE1cTtvV9\" rel=\"noopener noreferrer\" target=\"_blank\">https://my.matterport.com/show/?m=LYfE1cTtvV9</a>\" frameborder=\"0\" allowfullscreen allow=\"autoplay; fullscreen; web-share; xr-spatial-tracking;\"&gt;&lt;/iframe&gt;</p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-06-11"}, "image_url": "https://static.wixstatic.com/media/ad1ced_140c493682d342aeb6559fb8cbefe310~mv2.webp", "_wix_title": "Swan 48", "_wix_year": "2000", "_not_sold": false}, {"slug": "capelli-tempest-1000", "action": "update", "hs_id": "351443280100", "props": {"boat_name": "Capelli Tempest 1000", "page_path2": "capelli-tempest-1000", "merke": "Capelli", "modell": "Tempest 1000", "arsmodell": "2020", "lengde_i_fot": "33 fot", "pris": "Solgt!", "price_two": "1595000", "motorfabrikant": "2 x Suzuki DF300BTX", "motortype": "Utenbords", "motorstorrelse": "600 HK", "customer_comment": "<p class=\"font_8\"><strong>Capelli Temest 1000 Open er er stor RIB som byr på større plass og komfort enn hva vi vanligvis forbinder med RIB i Norge. Med en romslig sittegruppe med tilhørende salong bord akter, stor solseng i baugen, wetbar med kjøleskap og en kabin med soveplass til 2 samt toalett, er dette en helt super båt for de flotte sommerdagene. Skulle du ha behov for enda mer soleplass kan salongen akter konverteres til ed gedigen solseng.&nbsp;<br>\n<br>\n</strong>Denne båten er re en klassisk r-båt, konstruert og med spec for racing ,&nbsp; men hun har også alle bekvemmeligheter under dekk.&nbsp;<br>\n</strong></em><br>\nFlirt &nbsp;IV ble bygget av Anker &amp; Jensen på Vollen i Asker og sjøsatt i &nbsp;1912. Den ble kontrahert av Grosserer Alf Rasmussen som da var nestleder &nbsp;i KNS. Han ønsket en ny båt for å konkurrere i Europa Uken som skulle &nbsp;gå av stabelen i Norge i 1914. Dette var datidens største &nbsp;idrettsarrangement som var arrangert i Norge noen sinne. Europa uken &nbsp;1914 skulle egentlig arrangeres i Spania, men<br>\nSam Eyde som var &nbsp;grunnlegger av Norsk Hydro, reiste til Spania og overtalte den spanske &nbsp;kongen om at Norge måtte få denne muligheten for å legge det til &nbsp;feiringen av den norske grunnloven som da var 100 år.<br>\n<br>\nMÅ OPPLEVES!</p>\n<p class=\"font_8\"><strong>Båten ligger innendørs i Sandfjord og sjøsettes i uke 15/16 . Ta kontakt for avtale om visning.</strong><br>\n<br>\n<strong>For mer info, kontakt:</strong><br>\n<strong>Jeanette Arntzen&nbsp;</strong><br>\n<strong>909 39 610&nbsp;</strong><br>\n<strong>jeanette@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-06-24"}, "image_url": "https://static.wixstatic.com/media/ad1ced_5d02e048a9cf43748d49cb6407d42487~mv2.jpg", "_wix_title": "1912 Anker & Jensen 9mR Flirt IV", "_wix_year": "1912", "_not_sold": false}, {"slug": "storebro-430-biscay", "action": "update", "hs_id": "351443262696", "props": {"boat_name": "Storebro 430 Biscay", "page_path2": "storebro-430-biscay", "merke": "Storebro", "modell": "430 Biscay", "arsmodell": "1997", "lengde_i_fot": "43 fot", "pris": "2.079.000,-", "price_two": "2079000", "motorfabrikant": "2 x Volvo Penta 63P", "motortype": "Innenbords", "motorstorrelse": "710 HK", "customer_comment": "<p class=\"font_7\"><strong>Nydelig klassisk Cabin Cruiser, gjennomgående preget av eleganse og kvalitetshåndverk. Svenske Storebro er kjent for høy kvalitet, og materialvalg av beste kvalitet i båtene sine. Håndbygget interiør i flott utført tre gir en meget eksklusiv og klassisk følelse i hele båten, og fornuftige oppgraderinger og modernisering tilfredsstiller moderne krav til funksjonalitet.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Akter finner du en stor badeplattform utført i teak, med badestige samt passasje til akterdekket. Selvfølgelig fortsetter teaken over på akterdekket, som er et hyggelig oppholdsområde med god plass og pen utførelse. Rekkverket i lakkert tre rundt akterdekket er en skikkelig Storebro-signatur, og gir et hyggelig estetisk uttrykk. Bordet kan foldes ut i en håndvending, og det er løse kvalitetsstoler stuvet like under dekket.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">På flybridgen fortsetter de gode materialene og pen finish. Stor solmadrass akter på flybridgen, samt en hyggelig sittegruppe og en fornuftig utformet styreposisjon. Storebroen har selvfølgelig teakdekk på flybridgen også, og stolene er nye.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Inne i salongen kommer virkelig det svenske tradisjonshåndverket til syne, med nydelig utformede flater og en behagelig romfølelse. Stor u-formet sofa til styrbord, samt en pen lesestol til babord. Styreposisjonen inne er et skikkelig høydepunkt, med store flater i pent behandlet tre; veldig ryddig, funksjonelt og elegant utført.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">I byssa finner du multimikro-ovn og komfyr med induksjonstopp, kjøleskap (130L), fryseboks, varmt og kaldt vann.</p>\n<p class=\"font_7\">Fremover har båten 2 flotte kabiner og 2 bad. Også her er båten preget av meget pent utført håndverk i kvalitetsmaterialer, som gir en hyggelig atmosfære. Storebro har virkelig vært tro mot tradisjonen i 430 Biscay, uten at det går på bekostning av anvendelighet eller plassutnyttelsen.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten bærer preg av pertentlig båthold, hyppige oppgraderinger, og har lange utstyrs- og vedlikeholdslister. Besøk hjemmesiden vår, eller ta kontakt, for å få prospekt med full utstyrsliste og relevant vedlikeholdshistorikk.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten er klar for salg, og ligger i Oslo. Ta kontakt for visning og mer informasjon.</strong></p>\n<p class=\"font_7\"><strong>Kontakt: Henrik Olaf Bratz - +47 47875838 - henrik@h-y.no</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_2763ea59ad764af3a61349d91f962cb9~mv2.webp", "_wix_title": "Storebro 430 Biscay", "_wix_year": "1997", "_not_sold": false}, {"slug": "beneteau-mc5", "action": "update", "hs_id": "351482889405", "props": {"boat_name": "Beneteau MC5", "page_path2": "beneteau-mc5", "merke": "Beneteau", "modell": "Monte Carlo 5", "arsmodell": "2015", "lengde_i_fot": "50 fot", "pris": "Solgt!", "price_two": "5990000", "motorfabrikant": "2 x Volvo Penta IPS-600", "motortype": "Innebords", "motorstorrelse": "880 HK", "customer_comment": "<p class=\"font_8\"><strong>Vi har for salg en nydelig Beneteau MC5. Båten er en utrolig velholdt 2015 modell, under sin andre eier. Her spares det ingenting på vedlikeholdet, hvilket skinner gjennom. Hun fremstår som ferieklar og kan vises etter avtale, sentralt på Østlandet. Sertifikatfri båt (under 15 meter).</strong></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Om båten:</strong></p>\n<p class=\"font_8\">Beneteau Monte Carlo 5 er en nydelig cabincruiser fra det franske verftets luksus-serie. Monte Carlo serien henter alle de flotte elementene fra yacht-serien til Beneteau; Monte Carlo Yachts. Det er delikate farge og tekstilvalg gjennom hele båten og små detaljer overalt som minner deg på at dette ikke er en typisk samlebåndsbygget båt. Med tre kabiner og to toalettrom (+1 uinnredet crew) bor hele familien godt ombord.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Planløsningen er svært god, og med sømløse overganger fra sone til sone oppleves hun som en meget stor 50-foter. Akterdekket er romslig, men i det du åpner skyvedørene fullt opp hviskes linjene mellom ute/inne ut og du får en enorm romfølelse. En behagelig løsning, spesielt de varmeste sommerdagene.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Fullt utstyrt bysse med ovn, to bluss, skikkelig ventilator og kjøl/frys samt isbitmaskin. Delikat salong med pop-up tv, BOSE-anlegg og to gode sofaer. BOSE-anlegget spiller både i salong, begge kabiner, utendørs på akterdekk og på flybridge. Førerposisjon med dobbelt sete i fartsretning, ergonomisk utformet med alt av instrumentering lett tilgjengelig. Dobble kartplottere fra Simrad, “rygge” -kamera og motordata i eget panel. Elektriske vinduer til både styrbord og babord for god lufting.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Lekker VIP i baugen med eget toalettrom. Store hengeskap og godt med oppbevaringsplass til klær, bager og utstyr. Toalettrommet har egen dusjnisje. Ekstra gjestekabin med to single køyer brukes idag som bodrom.</p>\n<p class=\"font_8\">Fantastisk masterkabin finner du midtskips i hele båtens bredde. Også her godt med skapplass til begge, og med tilhørende toalettrom, samt dusjalkove. Vegghengt TV, med video/stereo.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">På øverste dekk finner vi en nydelig flybridge. Enormt med plass både i sofa og førerposisjon samt stor solseng ved siden av. På fly finner du også både kjøleboks, koketopp og vask. Uinnredet crewkabin akter brukes idag som ekstra bodrom, men kan også innredes til en fjerde kabin.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Med Volvo Penta IPS er båten svært enkel å manøvrere, selv i trange havner. Babord motor har ca. 690 timer, mens styrbord har ca. 450. Styrbord motor ble byttet på garanti i 2018.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Full servicehistorikk. Båten lagres innendørs hver vinter i varmtlager som holder 18 grader.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Båten ligger sentralt på Østlandet og vises etter avtale med megler.</strong></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Ta kontakt for privat visning:</strong></p>\n<p class=\"font_8\"><strong>Sindre Jacobsen</strong></p>\n<p class=\"font_8\"><strong>938 40 189</strong></p>\n<p class=\"font_8\"><strong>sindre@h-y.no</strong></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><em>Om oss:</em></p>\n<p class=\"font_8\"><em>House of Yachts er din selvsagte samarbeidspartner når det kommer til kjøp og salg av båt i annenhåndsmarkedet.</em></p>\n<p class=\"font_8\"><em>Vi skiller oss fra våre konkurrenter ved å tilby personlig service og rådgiving, bilder og video av ypperste kvalitet, og en enkel og forutsigbar kostnadsmodell. Vårt fokus er å være en markedsledende aktør og samarbeidspartner, enten du er i markedet for å kjøpe, selge, bytte eller chartre.</em></p>\n<p class=\"font_8\"><em>Sammen kartlegger vi dine behov og ønsker, og finner riktig løsning for deg.</em></p>\n<p class=\"font_8\"><em>Gjennom et etablert internasjonalt nettverk kan vi bistå med å fremskaffe de fleste båter for import, eller tilrettelegge for ditt båthold i utlandet.</em></p>\n<p class=\"font_8\"><em>Vi kan bistå med frakt, forsikring, finansiering, verdivurdering og verditakst.</em></p>\n<p class=\"font_8\"><em>Vi tar forbehold om eventuelle feil i salgsoppgaven.</em></p>\n<p class=\"font_8\"><em>Fartøyet selges “as is”. Kjøpet er regulert av kjøpsloven og House of Yachts AS er kun mellomann og således ikke part i kjøpekontrakten.</em></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2023-07-15"}, "image_url": "https://static.wixstatic.com/media/ad1ced_ac5f54e69527434cbe95f46367ebdd24~mv2.jpg", "_wix_title": "Beneteau MC5", "_wix_year": "2015", "_not_sold": false}, {"slug": "grand-banks-52-europa", "action": "update", "hs_id": "351443229926", "props": {"boat_name": "Grand Banks 52 Europa", "page_path2": "grand-banks-52-europa", "merke": "Grand Banks", "modell": "52 Europa", "arsmodell": "2007", "lengde_i_fot": "56 fot", "pris": "Solgt!", "price_two": "6900000", "motorfabrikant": "2 x John Deere 6125AFM 75", "motortype": "Innenbords", "motorstorrelse": "1040 HK", "customer_comment": "<p class=\"font_7\"><strong>Vi har gleden av å presentere “Bermuda II” – en Grand Banks 52 Europa av sjelden kvalitet, og med en utstyrspakke og vedlikeholdshistorikk som gjør den til et opplagt valg for den som søker en trygg og raffinert langturbåt i 50-fotsklassen.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Dette er en modell med kultstatus blant kjennere: en ekte ocean cruiser med semideplasementskrog, tidløst håndverk og imponerende komfort både over og under dekk. Med Naiad stabilisatorer, baug- og hekkthruster, watermaker, separate vask/tørk fra Miele, og full walkaround-dekk, er dette et fartøy bygget for lange turer og krevende forhold – men også med hjemmekomfort for deg og dine.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Eksteriør og dekkskomfort</strong></p>\n<p class=\"font_7\">Ved første øyekast oser båten av klassisk Grand Banks-DNA: høyde, linjer, brede dekk og varm treverkssjarm. Teakdekk og mahoganydetaljer i høyglans strekker seg rundt hele båten, og brede dollbord gjør det trygt å bevege seg om bord – enten man er alene eller med familie.</p>\n<p class=\"font_7\">Den store cockpiten har god sitteplass rundt et spesiallaget spisebord i høyglans, med plass til 6–8 personer. Akterdekket er utstyrt med både wetbar og stor toppåpnet fryser, samt \"Southern Stainless Grill\" montert på rekka.</p>\n<p class=\"font_7\">Under akterdekket finner vi en enorm lazarette med plass til jolleutstyr, reservedeler og havneutstyr. Her nede finner vi også både vaskemaskin, tørketrommel, watermaker og adkomst til et meget oversiktlig maskinrom – der to solide John Deere 6125AFM75 (520 hk) motorer og en Onan 17,5 kW generator er installert.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Salong og hoveddekk</strong></p>\n<p class=\"font_7\">Salongen fremstår lys, tidløs og funksjonell, med pop-up flatskjerm, L-sofa med justerbart spisebord, to komfortable lenestoler og rikelig med oppbevaringsplass. Til styrbord ligger den U-formede byssa – godt utstyrt med komfyr, mikrobølgeovn, stekeovn, oppvaskmaskin og dobbel kjøleløsning – samt en lys og trivelig spisegruppe på babord side.</p>\n<p class=\"font_7\">Førerposisjonen på hoveddekk er midtstilt med komfortabel Stidd-stol, og gir god sikt 360°. Pilothouse-dører til begge sider gir direkte tilgang til dekk – en viktig funksjon ved manøvrering.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Kabinlayout</strong></p>\n<p class=\"font_7\">Under dekk finner vi en romslig 3-kabins layout:</p>\n<ul class=\"font_7\">\n  <li><p class=\"font_7\">Masterlugar midtskips (full bredde) – med skrivepult, sittebenk, stor dobbeltseng og eget bad m/ separat dusj og WC</p></li>\n  <li><p class=\"font_7\">Gjestelugar styrbord – med bred underkøye og tverrstilt overkøye</p></li>\n  <li><p class=\"font_7\">V-berth i forpiggen – god plass og komfort for voksne</p></li>\n  <li><p class=\"font_7\">Bad nummer to deles mellom de to fremre lugarene og fungerer også som dagstoalett</p></li>\n</ul>\n<p class=\"font_7\"><strong>Flybridge</strong></p>\n<p class=\"font_7\">Flybridgen har stor sosial sone med ekstra kjølekapasitet og fast plass til tender akter. Ombord følger Novurania RIB med 40 hk og en Davco-kran med 500 kg løftekapasitet.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Nøkkelutstyr:</strong></p>\n<ul class=\"font_7\">\n  <li><p class=\"font_7\">Naiad stabilisatorer</p></li>\n  <li><p class=\"font_7\">Sidepower baug- og hekkthruster</p></li>\n  <li><p class=\"font_7\">Raymarine navigasjonspakke</p></li>\n  <li><p class=\"font_7\">Watermaker (Village Marine)</p></li>\n  <li><p class=\"font_7\">Onan 17,5 kW generator</p></li>\n  <li><p class=\"font_7\">Miele vaskemaskin og tørketrommel</p></li>\n  <li><p class=\"font_7\">Fisher &amp; Paykel oppvaskmaskin</p></li>\n  <li><p class=\"font_7\">3 store kjøleenheter + ekstra fryser + bar-kjøleskap + grill</p></li>\n  <li><p class=\"font_7\">Satelitt-TV, Bose-anlegg, flatskjermer</p></li>\n  <li><p class=\"font_7\">Novurania RIB + 40 hk</p></li>\n  <li><p class=\"font_7\">Davco 500 kg kran</p></li>\n  <li><p class=\"font_7\">3 kabiner / 2 bad</p></li>\n  <li><p class=\"font_7\">Teakdekk og mahoganyrekker i høyglans</p></li>\n  <li><p class=\"font_7\">Skipsregistrert</p></li>\n</ul>\n<p class=\"font_7\">Dette er en <strong>svært velholdt og gjennomført Grand Banks 52 Europa</strong>, oppgradert og brukt med respekt. En klassisk og trygg båt som er sjelden å finne i Norge, og som tilbyr langt mer enn prisklassen ofte indikerer.</p>\n<p class=\"font_7\"><strong>Visning etter avtale. Båten ligger sjøsatt i nærheten av Oslo.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Sindre Jacobsen + 47 938 40189</strong></p>\n<p class=\"font_7\"><strong>sindre@h-y.no</strong></p>\n<p class=\"font_7\"><br></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-09-08"}, "image_url": "https://static.wixstatic.com/media/ad1ced_fb8f4fbca05c47cb98649f7bd2b84217~mv2.webp", "_wix_title": "Grand Banks 52 Europa", "_wix_year": "2007", "_not_sold": false}, {"slug": "chris-craft-28-corsair", "action": "update", "hs_id": "351388463330", "props": {"boat_name": "Chris-Craft 28 Corsair", "page_path2": "chris-craft-28-corsair", "merke": "Chris-Craft", "modell": "28 Corsair", "arsmodell": "2006", "lengde_i_fot": "30 fot", "pris": "Solgt!", "price_two": "540000", "motorfabrikant": "Volvo 8.1 GXI MPI", "motortype": "Innenbord", "motorstorrelse": "420 HK", "customer_comment": "<p style=\"font-size: 14px;\"><span style=\"font-size:14px;\"><span style=\"font-family:questrial,sans-serif;\"><span style=\"font-weight:bold;\">Vi har f&aring;tt inn for sal 6l V8 300", "motortype": "Utenbords", "motorstorrelse": "600 HK", "customer_comment": "<p class=\"font_7\"><strong>Nå har vi fått for salg en utrolig flott og topputstyrt Nimbus T11 X-Edition som ble levert ny av Aaby Marine våren 2023. Denne 40-fots båten skiller seg ut med sitt moderne skandinaviske design, og imponerende funksjoner. Båtens åpne layout gir en enestående følelse av frihet og bevegelse, med brede gangveier, en romslig cockpit og en salong med fleksible sitteplasser.&nbsp;</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Det gjør denne båten perfekt for avslappende turer og sosiale sammenkomster. Denne båten er oppgradert med X-edition, som innebærer bla. Foliert skrog, oppgraderte alcantara seter, dekor på motorer som tar opp fargen i skroget, x-edition logo i cockpit, etc.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Badeplattform med stige, oppbevaringsplass på begge sider og en større sittebenk som kan gjøres om til solseng er det første som møter deg når du går ombord akter i denne båten. Videre finner du en salong med fleksibelt sittearrangement som kan tilpasses ulike aktiviteter. Setene kan roteres og justeres for å skape forskjellige konfigurasjoner, som for eksempel en C-formet salong rundt det store teakbordet, en dobbel solseng, eller i båtens kjøreretning.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten har også rikelig med oppbevaringsplass, inkludert en stor lagringsplass under salongen på hele 2500L som kan åpnes med en hydraulisk mekanisme. Dette rommet er perfekt for oppbevaring av vannsportutstyr som SUP-er, wakeboards eller til og med en liten gummibåt. Ytterligere fasiliteter inkluderer en wet bar med to store kjøleskuffer, vask og keramisk koketopp (gass) med integrert avtrekksvifte, samt et oppgradert Fusion lydsystem av høy kvalitet.</p>\n<p class=\"font_7\">Cockpit er dekket av en t-top som gir god beskyttelse mot vær og vind, som også er utstyrt med tre stykker solcellepanel a´ 100W på toppen. Med tre gode seter i førerretning, joystickstyring for enklere manøvrering og godt utstyrt navigasjonshjelpemidler er denne båten perfekt både for den erfarne, men også uerfarne. Foran på båten er det ei stor solseng, og en sittebenk. Under denne benken har du en smart lasteluke direkte til kabin for bagasje el.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Under dekk finner du to separate kabiner. Hoved kabinen foran har en stor dobbeltseng, mens den mindre kabinen under styreposisjon har nok en dobbeltseng, og kan for eks. brukes som lagringsplass. Båten har også et bad med elektrisk toalett, vask og dusj. Dette gjør båten ideell for helgeturer, med nok plass til komfortabel overnatting for en liten familie eller et par.</p>\n<p class=\"font_7\">På hekken sitter det to ganger 300HK Mercury Verado V8 utført i et fint x edition desgin. &nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten har det nye dobbel steppet skrogsdesignet som gir en jevn overgang til planing og en stabil kjøring selv i røffere sjø. Drivstoffkapasiteten på denne båten er oppgitt til 850 liter og en ferskvannstank på 135 liter. Siste service er utført våren 2024.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten er registrert i Skipsregistret og kan belånes. Her er vi behjelpelige med gunstig finansiering og forsikring om ønskelig. Båten ligger i Drøbak, og vises kun etter avtale med megler. Ta kontakt for mer informasjon.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ta kontakt med:</p>\n<p class=\"font_7\"><strong>Sindre Jacobsen</strong>&nbsp;</p>\n<p class=\"font_7\">+47 938 40 189&nbsp;</p>\n<p class=\"font_7\">sindre@h-y.no</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Om oss:</strong> House of Yachts er din selvsagte samarbeidspartner når det kommer til kjøp og salg av båt i annenhåndsmarkedet.</p>\n<p class=\"font_7\">Vi skiller oss fra våre konkurrenter ved å tilby personlig service og rådgiving, bilder og video av ypperste kvalitet, og en enkel og forutsigbar kostnadsmodell. Vårt fokus er å være en markedsledende aktør og samarbeidspartner, enten du er i markedet for å kjøpe, selge, bytte eller chartre. Sammen kartlegger vi dine behov og ønsker, og finner riktig løsning for deg. Gjennom et etablert internasjonalt nettverk kan vi bistå med å fremskaffe de fleste båter for import, eller tilrettelegge for ditt båthold i utlandet. Vi kan bistå med frakt, forsikring, finansiering, verdivurdering og verditakst. Vi tar forbehold om eventuelle feil i salgsoppgaven. &nbsp;Kjøpet er regulert av kjøpsloven eller forbrukerkjøpsloven. Kjøper gjøres uttrykkelig oppmerksom på at House of Yachts AS opererer kun som mellommann og er således ikke solidarisk ansvarlig med selger. Selger har opplysningsplikt for eventuelle feil og mangler ved båten.</p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_2f1d7428bce74616affe82b43f008a7b~mv2.jpg", "_wix_title": "Nimbus T11", "_wix_year": "2023", "_not_sold": false}, {"slug": "axopar-25-cross-bow", "action": "update", "hs_id": "351475308730", "props": {"boat_name": "Axopar 25 Cross Bow", "page_path2": "axopar-25-cross-bow", "merke": "Axopar", "modell": "25 Cross Bow", "arsmodell": "2023", "lengde_i_fot": "25 fot", "pris": "Solgt!", "price_two": "799000", "motorfabrikant": "Yamaha 225 V6 4,2l", "motortype": "Utenbords", "motorstorrelse": "225 HK", "customer_comment": "<p class=\"font_7\"><strong>House of Yachts har nå en meget pen og velholdt 2023 Axopar 25 Cross Bow for salg. Kun 20 timer på motoren og profesjonell oppfølging i opplag, gjør at båten praktisk talt ikke har hatt slitasje siden levering. Finske Axopar har etter hvert blitt veldig synlige på fjorden, med sporty design og skarpe linjer. 25 Cross Bow har et litt utradisjonelt og asymmetrisk layout som mange setter pris på!</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten er moderne og usminket – her er det grått softdeck og et litt røft uttrykk, i kombinasjon med myk solseng og puter. I oppholdsområdet bak har du en U-sofa med integrerte koppholdere og komfortable puter i ryggen, og mulighet for et bord i midten. God lagringsplass under benker og i dørken.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Styreposisjonen og kabinen er plassert litt til styrbord i båten, som gir romslig og trygg passasje på motsatt side – et vellykket grep etter vår mening. Særlig passasjersetet er godt beskyttet, og setene er gode. Vindskjermen kan enkelt heves i bakkant, for å ta av litt ekstra for vinden i fart. Axopar 25 Cross Bow har gode sjøegenskaper, og med 225 V6 på hekken er båten god for godt over 40 knop.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ned i kabinen er det oversiktlig, lyst, rent og enkelt. God soveplass til to voksne, samt toalett og håndvask betyr at du har alt du trenger for lange dager på fjorden. Et større vindu opp mot soldekket gir godt lysinnfall, og kabinen er dermed et trivelig sted å være.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten ligger på vannet på Dronningen i Oslo, og er klar for fremvisning. Ny service utført ved sjøsetting.&nbsp;</strong></p>\n<p class=\"font_7\"><strong>Ta kontakt med Båtmegler Henrik Bratz på telefon 47875838 for visning!</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-06-11"}, "image_url": "https://static.wixstatic.com/media/ad1ced_9c951f353b4f4a768d29015f4333da61~mv2.webp", "_wix_title": "Axopar 25 Cross Bow", "_wix_year": "2023", "_not_sold": false}, {"slug": "bayliner-avanti-4085-express-cruiser", "action": "update", "hs_id": "351482888424", "props": {"boat_name": "Bayliner Avanti 4085 Express Cruiser", "page_path2": "bayliner-avanti-4085-express-cruiser", "merke": "Bayliner", "modell": "Avanti 4085", "arsmodell": "1999", "lengde_i_fot": "42 fot", "pris": "Solgt!", "price_two": "850000", "motorfabrikant": "2 x Cummins Diamond series", "motortype": "

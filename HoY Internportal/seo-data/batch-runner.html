mlager siden ny.</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Effie III er solgt ny i Sverige, til en Nordmann som importerte den hit. Hun har kun hatt to eiere i sin levetid, og det har vært stort fokus på vedlikehold, noe hun bærer preg av.</p>\n<p class=\"font_8\">Nåværende eier er utrolig fornøyd, men skal videre på større båt og således er hun nå klar for nye eventyr igjen.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Om båten:</strong></p>\n<p class=\"font_8\">Grand Banks 47 Heritage EU er 52 fot lang med plattform, men målt godt under 15 meter og seiles således sertifikatfri. Du får 3 kabiner med to bad.</p>\n<p class=\"font_8\">En romslig salong, stor pantry og meget hyggelig flybridge.</p>\n<p class=\"font_8\">Akterdekket er stort og nåværende eier har valgt å utstyre den med en frittstående spisestue.</p>\n<p class=\"font_8\">Kvaliteten er gjennomgående fra byggekvalitet i selve båten, til valg av utstyrsleverandører. Stidd kapteinsstoler med musestyring av Furuno kartsystemer. Lofrans Ankervinsj <em>(1200W)</em> med to spor <em>(kjetting/tau) </em>og dobbel rulle i baugen opereres enten via fotbryter eller fra cockpit.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Det er både baug og hekkthrustere <em>(Sleipner)</em>, og ved tilkobling av fjernkontroll på akterdekket kan du enkelt styre båten med joysticker. Svært enkel manøvrering.</p>\n<p class=\"font_8\">Motorrommet er enhver mekanikers drøm. Stort, lyst og like rent som resten av båten. Må sees og oppleves!</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">God oversikt for enkelt vedlikehold og service. Tømming av olje direkte fra bunnpanne via enkel oljepumpe og slange. <em>(Reverso Oil Change Kit)</em></p>\n<p class=\"font_8\">Det er Onan 9.5 kw generator <em>(ca 199 timer)</em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">På flybridge er det kran, og krybbe til jolle. <em>(Marquipt 600 Q6)</em></p>\n<p class=\"font_8\"><br></p>\n<p c tt ryddes vekk, for å frigjøre plass til arbeid eller last bak. Det er god passasje forbi styrhuset, og frem</p>\n<p class=\"font_7\">på dekk, hvor det er en flott solmadrass og luker til oppbevaring. Styrhuset kan åpnes med skyvedør til styrbord og akter. Interiøret er flott utført i kvalitetsmaterialer. Praktisk utstyr og detaljer, både fra fabrikk, som ekstrautstyr, og ettermontert av eier.&nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Til babord har du en U-formet sofa m salongbord, med ca 6 sitteplasser rundt bordet. Det er et stort kjøleskap med 2 skuffer under passasjerstolen til babord.&nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ellers kan vi trekke frem:</p>\n<ul class=\"font_7\">\n  <li><p class=\"font_7\">Elektrisk takluke, pantry m vask og gassbluss,&nbsp;</p></li>\n  <li><p class=\"font_7\">Ekstramadrass for konvertering til soveplass i styrhuset, og veldig godt med skap og skuffer.&nbsp;</p></li>\n  <li><p class=\"font_7\">Styreposisjonen er ergonomisk utformet, og eier har ettermontert en meget vellykket liten plattform, så man kan ståog føre båten med sikt fremover ut av takluka.&nbsp;</p></li>\n</ul>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Dette eksemplaret er utstyrt med all tenkelig elektronikk fra Garmin på en 12¨ skjerm, samt for- og akter-thruster, og mye mer. I kabinen foran finner du køyer, toalett-rom med vask og dusjmulighet, og alt du behøver for hyggelige overnattinger.&nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten befinner seg i Sandefjord og er klar for salg og levering.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Ta kontakt med Båtmegler Henrik Bratz på +47 47875838 for visning</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_877b37c67d694129ba56b15eceed8bcb~mv2.webp", "_wix_title": "Nordkapp 905 Grand Coupe", "_wix_year": "2021", "_not_sold": false}, {"slug": "marex-375", "action": "update ate-23-su---2022-shark-grey", "action": "update", "hs_id": "351443214562", "props": {"boat_name": "Cormate 23 SU - 2022 Shark Grey", "page_path2": "cormate-23-su---2022-shark-grey", "merke": "Cormate 23 Super Utility", "modell": "2022", "arsmodell": "2022", "lengde_i_fot": "23 fot", "pris": "Solgt!", "price_two": "889000", "motorfabrikant": "Mercruiser 6,2l V8 350", "motortype": "Innenbords", "motorstorrelse": "350 HK", "customer_comment": "<p class=\"font_7\"><strong>Vi har fått inn en særdeles lekker og fullspekket Cormate 23SU for salg – en båt som leverer både prestasjon og premiumfølelse i toppklasse. Dette er Super Utility-versjonen, utstyrt med den største bensinmotoren som leveres til modellen: En Mercury 6.2L V8 på 350 hk, DTS-giring. Med denne motorpakken oppgir produsenten en toppfart på over 60 knop – og du får et rått kraftoverskudd du virkelig merker på vannet.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Om båten:</strong></p>\n<p class=\"font_7\">Cormate 23 er resultatet av et ønske om å skape en brukervennlig og praktisk båt – uten å gi avkall på hverken finish eller kjøreegenskaper. Far og sønn Ranvig har lykkes med å fjerne unødvendige løsninger og heller fokusert på det som virkelig betyr noe for kvalitetsbevisste båtkjøpere.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Racing-DNAet til Cormate er tydelig i denne modellen. Skroget er bygget med deres egenutviklede “Monostep”-teknologi, som gir lav vekt og høy effektivitet – og det merkes. Konstruksjonen sørger for en trygg og retningsstabil kjøreopplevelse, selv i høy hastighet, og gir samtidig sportslig og presis respons bak rattet.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Effekten av dette skroget kan sammenlignes med omtrent 20 hestekrefters økning – og når det kombineres med en 350 hk V8 og high-performance propell, er resultatet en toppfart på ca 60 knop og en kjøreglede som må oppleves.</p>\n<p class=\"font_7\">Båten har kun gått ca. 82 tim n<br>\nHøydepunkter:<br>\n-Nærhet til sjø og strand hele året.<br>\n-Takterasse med jacuzzi&nbsp;<br>\n-Eget walk-in closet<br>\n-Vannbåren varme<br>\n-Generator&nbsp;<br>\n-Styreposisjon både ute og inne<br>\n-Båtplassen kan overtas av ny eier - meget sentralt på Vækerø/ Oslo<br>\n-Skipsregistrert<br>\n-En eier<br>\n<br>\n<strong>Husbåten ligger i Oslo. Ta kontakt for avtale om visning.<br>\n<br>\nFor mer info, kontakt:<br>\n<br>\nJeanette Arntzen&nbsp;<br>\n+47 909 39 610&nbsp;<br>\njeanette@h-y.no</strong><br>\n<br>\neller<br>\n<br>\n<strong>Sindre Jacobsen<br>\n+47 938 40 189<br>\nsindre@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2023-04-16"}, "image_url": "https://static.wixstatic.com/media/ad1ced_63b5657bb8c34ab58da3b52f18ec7120~mv2.jpg", "_wix_title": "Nordic Ocean Craft Catamaran", "_wix_year": "2017", "_not_sold": false}, {"slug": "delphia-40.3", "action": "update", "hs_id": "351443262706", "props": {"boat_name": "Delphia 40.3", "page_path2": "delphia-40.3", "merke": "Delphia", "modell": "40.3", "arsmodell": "2009", "lengde_i_fot": "40 fot", "pris": "Solgt!", "price_two": "970000", "motorfabrikant": "Volvo Penta D2-40", "motortype": "Innenbords", "motorstorrelse": "40 HK", "customer_comment": "<p class=\"font_7\">House of Yachts har nå for salg en lys, romslig og velseilende Delphia 40.3. Et rimelig og spennende valg for turseilere som legger vekt på enkel håndtering og god kvalitet. God layout med tre kabiner, to bad, stor salong og langsgående bysse. Her ligger alt til rette for lange familieturer med høy komfort!</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Med hvitt dekk og kantlist i aluminium er båten lett å vedlikeholde, og viser få tegn til slitasje. Dekket er stort, og preget av store vindusflater og luker. Båten har Seldén rullemast, hvor bommen/storseilet er skjøtet på hyttetaket like foran luka. Alle skjøter og fall er trukket til cockpit, så båten kan enkelt håndteres av en person.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Dørk og benker i cockpit er utført i teak, og midt i cockpit er det et pent fast teakbord. To relativt små ratt gjør det lett å finne en god styreposisjon, og fremkommeligheten fra ror-posisjonen og frem er god. Båten har full kalesje og sprayhood, som kan avsluttes like foran rattene, så de som ikke står til rors kan sitte tørt. Kalesjen kan også lukkes helt, og det er montert et separat varmeapparat til cockpit.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Salongen oppleves veldig lys og romslig med de mange vinduene i overbygget. Interiøret er av høy kvalitet med solide materialvalg. Vi trekker frem en imponerende ståhøyde på 2.05 i salongen. Den langsgående byssa har god benkeplass, en fin komfyr og to romslige kjøleskap.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Forover i båten finner man først en mellomgang med et stort skap til styrbord og bad til babord, samt forpiggen med dobbeltseng. Akter i båten finnes to stikk-kabiner, begge to fint innredet med skap og dobbeltkøyer.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten har vært demobåt for svensk forhandler fra 2009-2017, hvor nåværende eier kjøpte den.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Nåværende eier hadde en grunnstøting våren/sommeren 2025, og båten har etterfølgende blitt reparert og stivet opp hos Slevikkilen Båtbyggeri. Dokumentasjon finnes.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ligger i vannet ved Kråkerøy / Fredrikstad, og kan besiktiges omgående. Den blir tildekket i løpet av november, så hvis du vil se båten uten tildekking, oppfordrer vi til å ta kontakt med det samme.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Kontakt</p>\n<p class=\"font_7\">Henrik Bratz</p>\n<p class=\"font_7\">henrik@h-y.no</p>\n<p class=\"font_7\">+47 478 75 838</p>", "activated": "no", "status": "sold", "sold_date_proxy": "2026-02-23"}, "image_url": "https://static.wixstatic.com/media/ad1ced_19587fec0c854287a49187fbf70c22ff~mv2.webp", "_wix_title": "Delphia 40.3", "_wix_year": "2009", "_not_sold": false}, {"slug": "hanse-355", "action": "update", "hs_id": "351443141855", "props": {"boat_name": "Hanse 355", "page_path2": "hanse-355", "merke": "Hanse", "modell": "355", "arsmodell": "2011", "lengde_i_fot": "35 fot", "pris": "Solgt!", "price_two": "890000", "motorfabrikant": "Volvo Penta D1-20", "motortype": "Innenbords", "motorstorrelse": "18 HK", "customer_comment": "<p class=\"font_8\">Båten er tatt godt vare på av sine to eiere, og har sett vesentlige oppdraderinger i senere år.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Hanse 355 passer ypperlig for en familie på 3-4 personer. Størrelsen er en flott kombinasjon av plass om bord og enkel håndtering av båten.&nbsp;</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Denne utgaven er en 2-kabins versjon, som i tillegg til å ha et ekstra stort bad med separat dusj, også har en svært romslig oppbevaringsrom med plass for oppbevaring av alt fra ekstra seil, fendere til gummijolle eller sammenleggbare-/barnesykler.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Nåværende eier er en aktiv regattaseiler, og har i tillegg til å bygge opp en omfattende seilgarderobe, også gjort en rekke oppdrageringer med tanke på regattaoptimalisering, som dypere ror, dyneema akterstag, baugspyd, foldepropell, løygang i cockpit+++</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Båten ligger på vannet på Skjæløy Slipp, og kan vises etter avtale. Båtplass ut sesongen kan muligens medfølge.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Ta kontakt med</p>\n<p class=\"font_8\">Sondre Klungland</p>\n<p class=\"font_8\">924 62 418</p>\n<p class=\"font_8\">sondre@h-y.no</p>", "activated": "no", "status": "sold", "sold_date_proxy": "2021-06-30"}, "image_url": "https://static.wixstatic.com/media/b99d91_af1ed5d66f614a5690119674340b8826~mv2.jpg", "_wix_title": "Hanse 355", "_wix_year": "2011", "_not_sold": false} ss=\"font_8\">Båten ligger klar for visning, og ny sesong i Oslo.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Sindre Jacobsen</strong></p>\n<p class=\"font_8\"><strong>+ 47 938 40189</strong></p>\n<p class=\"font_8\"><strong>sindre@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2020-05-08"}, "image_url": "https://static.wixstatic.com/media/ad1ced_faf05085110642c7a6434152586aea54~mv2.jpg", "_wix_title": "Sandvik 945", "_wix_year": "1998", "_not_sold": false}, {"slug": "nimbus-250r", "action": "update", "hs_id": "351443213557", "props": {"boat_name": "Nimbus 250R", "page_path2": "nimbus-250r", "merke": "Nimbus", "modell": "250R", "arsmodell": "2001", "lengde_i_fot": "25 fot", "pris": "Solgt!", "price_two": "460000", "motorfabrikant": "Volvo Penta 5.7 GSi", "motortype": "Innenbords", "motorstorrelse": "280 HK", "customer_comment": "<p><span style=\"font-family:questrial,sans-serif\"><span style=\"font-style:italic\"><span style=\"font-weight:bold\">Vi har f&aring;tt inn for salg en godt utstyrt Nimbus 250R. B&aring;t og motor er godt vedlikeholdt. Bla. nye risere og manifolder i 2018, neste belgbytte f&oslash;rst i 2021!<br />\nPen b&aring;t med mye utstyr. </span></span><br />\n<br />\n<span style=\"font-weight:bold\">Om Nimbus 250R:&nbsp;</span><br />\nSj&oslash;sterk walk around konstruert av Ocke Mannerfelt.&nbsp;<br />\nMed dyp V-bunn p&aring; 24 grader og 2 step er dette et meget sj&oslash;sterkt skrog.<br />\nVindskjermen gir god ly for vinden, kalesjel&oslash;sningen er praktisk og gir deg mulighet til &aring; bruke b&aring;ten selv p&aring; regnfulle dager.<br />\nMulighet for &aring; snu f&oslash;rerposisjonen slik at 6 mennesker fint sitter rundt samme bord.<br />\n<br />\nB&aring;ten har en god, praktisk og romslig cabin, som fungerer ypperlig til &aring; sove i. Tilh&oslash;rende toalettrom og en liten pantry finner du ogs&aring; under dekk.<br />\n<br />\nF&oslash;rerplassen er meget oversiktlig, og inneh t alternativ til mer velkjente merker i samme segment. Med høy kalesje blir den romslig og praktisk i all slags vær.&nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Motoren har få timer (kun 350), og fikk sist service ved ca 330t.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Full utstyrsliste kan lastes ned houseofyachts.no.&nbsp;</strong></p>\n<p class=\"font_7\"><strong>Båten ligger i Oslo og er klar til overlevering – ta kontakt for besiktigelse.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Kontakt:&nbsp;</strong></p>\n<p class=\"font_7\"><strong>Båtmegler Henrik Olaf Bratz, 47875838.</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_59423122d2464cc7856baa0385c46f2b~mv2.webp", "_wix_title": "Grandezza 27S", "_wix_year": "2016", "_not_sold": false}, {"slug": "goldfish-28-tender-%23001", "action": "update", "hs_id": "351479077103", "props": {"boat_name": "Goldfish 28 Tender #001", "page_path2": "goldfish-28-tender-%23001", "merke": "Goldfish", "modell": "28 Tender", "arsmodell": "2011", "lengde_i_fot": "28 fot", "pris": "Solgt!", "price_two": "780000", "motorfabrikant": "2 x Evinrude E-Tec 200", "motortype": "Utenbords", "motorstorrelse": "400 HK", "customer_comment": "<p class=\"font_7\"><strong>Vi har fått for salg en helt spesiell Goldfish 28 Tender – nemlig byggenummer 001, den aller første som ble produsert! Med 2 x 200 hk på hekken leverer den både rå kjøreglede og lavt forbruk. Kombinasjonen hvit og grå, Natural Teak på dørken, gir båten et klassisk og elegant uttrykk.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten er prøvekjørt av oss og gjør godt over 50 knop, og leverer de utrolige kjøreegenskapene du kun får i en Goldfish. Båten er i god stand, har blitt fulgt opp med årlig service, og er nå klar for visning – allerede på vannet</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Utstyrt med blant annet:</p>\n r godt over 50 knop.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Fra øyeblikket du kommer om bord er det åpenbart at SeaSide 23 er kvalitetsmessig bygget. Solide materialer, og et håndverk som tilsier at båten uten problemer kommer til å tåle mange års bruk. I fart er også kvalitetsfølelsen slående – den går meget pent i vannet og det er ingen ting som føles løst eller knirkete. En meget kontant og solid følelse i sjøen.</p>\n<p class=\"font_7\">Dette eksemplaret er også usedvanlig velutstyrt, med både full kalesje (i tillegg til havnetrekk), Sleipner baugtruster, ankervinsj, Flexteak, navigasjonspakke fra Garmin, samt mye mer.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Med 8 sitteplasser om bord kan du ha med relativt mange gjester. Sittegruppen er meget fint utformet, og styreposisjonen er både beskyttet, ergonomisk og oversiktlig. Kabinen nede er romslig, med overnattingsmulighet for 2. Med full kalesje kan 2 personer også overnatte på solsengen. Det er toalett om bord.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Ta kontakt nå for visning! Båten er klar for levering, og kan sees i Drøbak.</strong></p>\n<p class=\"font_7\"><strong>Båtmegler Henrik Olaf Bratz</strong></p>\n<p class=\"font_7\"><strong>Tlf +47 47875838</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_179b85dfaae3429ea711f659bb8d0207~mv2.webp", "_wix_title": "Seaside 23 - 2023", "_wix_year": "2023", "_not_sold": false}, {"slug": "bavaria-40-cruiser", "action": "update", "hs_id": "351443141854", "props": {"boat_name": "Bavaria 40 Cruiser", "page_path2": "bavaria-40-cruiser", "merke": "Bavaria", "modell": "40 Cruiser", "arsmodell": "2011", "lengde_i_fot": "41 fot", "pris": "Solgt!", "price_two": "1375000", "motorfabrikant": "Volvo Penta D2-40", "motortype": "Innenbords", "motorstorrelse": "40 HK", "customer_comment": "<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">Vi har f&aring;tt inn for salg en 2011 Bavaria 40 Cruiser. B&aring;ten ble p&aring;kostet mye nytt utstyr i 2017.</span></span></p>\n\n<p style=\"font-size:14px\">&nbsp;</p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">Om b&aring;ten:<br />\nBavaria 40 Cruiser er en super seilb&aring;t som passer de fleste, og er ypperlig som familieseiler. Her f&aring;r du en meget romslig 40 foter med god komfort og en lys og luftig atmosf&aelig;re under dekk.<br />\nDen store nedfellbare sv&oslash;mmeplattformen gj&oslash;r cockpiten ekstra trivelig n&aring;r man ligger for anker eller i havn, og bidrar gir enda bedre n&aelig;rhet til sj&oslash;en. I 2017 fikk eier sydd formsydde puter i cockpit samt trekk til cockpitbordet og ratt.</span></span></p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">B&aring;ten har sengeplasser til 6 personer fordelt p&aring; tre lyse lugarer. To bad om bord, hvorav ett er tilknyttet rederlugaren i forpiggen.</span></span></p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">Dette er en b&aring;t som er sv&aelig;rt enkel &aring; h&aring;ndtere, og alle seil p&aring; rull gj&oslash;r seilingen uanstrengt. Baugthrusteren er et kj&aelig;rkomment hjelpemiddel i trange havner. Alle skj&oslash;ter og fall er trukket tilbake til cockpit. Dette er suveren som familiens f&oslash;rste seilb&aring;t!</span></span></p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">Forseil og gennaker er fra 2017. Begge levert av Elvstr&ouml;m.<br />\nMotoren er en Volvo Penta D2-40, som har tikket 1408 timer per 01.05.19.</span></span></p>\n\n<p style=\"font-size:14px\">&nbsp;</p>\n\n<p style=\"font-size:14px\"><span style=\"font-size:14px\"><span style=\"font-family:questrial,sans-serif\">Komplett s achts er din selvsagte samarbeidspartner når det kommer til kjøp og salg av båt i annenhåndsmarkedet.</em><br>\n<em>Vi skiller oss fra våre konkurrenter ved å tilby personlig service og rådgiving, og en enkel og forutsigbar kostnadsmodell.</em><br>\n<em>Vårt &nbsp;fokus er å være en markedsledende aktør og samarbeidspartner, enten du &nbsp;er i markedet for å kjøpe, selge, bytte eller charter. Sammen kartlegger &nbsp;vi dine behov og ønsker, og finner riktig løsning for deg.</em><br>\n<br>\n<em>Gjennom &nbsp;et etablert internasjonalt nettverk kan vi bistå med å fremskaffe de &nbsp;fleste båter for import, eller tilrettelegge for ditt båthold i &nbsp;utlandet.</em><br>\n<em>Vi kan bistå med frakt, forsikring, finansiering, &nbsp;verdivurdering og verditakst. Vi tar forbehold om eventuelle feil i &nbsp;salgsoppgaven. </em><br>\n<em>Fartøyet selges “as is”. Kjøpet er regulert av kjøpsloven og House of Yachts AS er kun </em><br>\n<em>mellomann og således ikke part i kjøpekontrakten.</em></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2023-04-16"}, "image_url": "https://static.wixstatic.com/media/ad1ced_45f2b2a29adf422bae65476ba16566c5~mv2.jpg", "_wix_title": "Goldfish 23 Tender - 2018", "_wix_year": "2018", "_not_sold": false}, {"slug": "dufour-44-performance", "action": "update", "hs_id": "351419699394", "props": {"boat_name": "Dufour 44 Performance", "page_path2": "dufour-44-performance", "merke": "Dufour", "modell": "44 Performance", "arsmodell": "2006", "lengde_i_fot": "44 fot", "pris": "Solgt!", "price_two": "1590000", "motorfabrikant": "Volvo Penta D2-55", "motortype": "Innenbords", "motorstorrelse": "55 HK", "customer_comment": "<p class=\"font_7\"><strong>House of Yachts presenterer en Dufour 44 Performance fra 2006. Flott og allsidig seilbåt, med gode seilegenskaper!</strong></p>\n<p class=\"font_7\">Med sin 44 Performance la Dufour ekstra vekt på seilegenskapene, og det merkes tydelig. Fra brygga ser man at båten er slank i vannlinjen, som i kombinasjon med høyreist mast og 3.300 kg blykjøl, gir bra performance på kryss.</p>\n<p class=\"font_7\">Dette eksemplaret har 4 kabiner, og rommer dermed et stort mannskap eller reisefølge. Foran i båten har du både forpigg med dobbeltkøye, en stikk-kabin med 2 køyer, samt bad.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">I salongen har båten et tradisjonelt oppsett med U-sofa og salongbord til babord og sofa til styrbord, samt en velutstyrt bysse og kartbord. Akter har den 2 kabiner med doble køyer, samt skapplass og enda et bad. Treverket i interiøret er i all hovedsak i god stand, og det er tydelig at båten har vært tett i alle år, med unntak av litt slitasje ved trappa ned fra cockpit.</p>\n<p class=\"font_7\">Salongbordet kan senkes, og konverteres til en litt smal dobbeltseng, hvilket betyr at båten har soveplass til 10 personer. Imponerende for en 44 fots seilbåt.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten har kun hatt 1 eier, og har blitt løpende vedlikeholdt og brukt både til tur og regatta. Etter vårt syn byr Dufour 44 Performance på masse båt for pengene, og er et godt valg for dem som ser etter seilbåt i dette segmentet. Fremtidige eiere kan se frem til et båthold hvor man kan være sikker på at det strukturelle i skrog og mast er på stell, og båten har gode seil med mange års bruk foran seg. Med hvitt dekk behøver du heller ikke bekymre deg for et aldrende teakdekk. Teaken i cockpit er i god stand.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten har hatt en strukturell utbedring og forbedring på Orust i 2022, etter en grunnstøting, som kan sies å ha gjort båten sterkere enn originalt.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Ta kontakt med båtmegler Henrik Olaf Bratz på +47 47875838 eller henrik@h-y.no for visning eller mer informasjon.&nbsp;</strong></p>\n<p class=\"font_7\"><strong>Båten ligger i Oslo, og er klar til overtagelse.</strong></p>", "activated": "no", "status": er bla: Generator, Watermaker, Dobbel Air-Condition anlegg, Ekstra varmeanlegg, Hydraulisk badeplattform med innfelt davitsystem, Joystickmanøvrering via Zeus podsystemet, Vinskap, Stor vask/tørk (9kg kombimaskin) og Lithium forbruksbatteribank med stor kapasitet.</strong></em></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Om båten:<br>\n</strong>Beneteau MC6S er et komplett flytende landsted. Her er alle fasiliteter ivaretatt, og du lever komfortabelt 6 mennesker ombord fordelt på 3 separate kabiner. (<em>Det finnes i tillegg en crewcabin, som dagens eier bruker til lager/oppbevaring).<br>\n</em><br>\nAkterdekket er romslig, og følelsen av rom øker betraktelig når vi åpner bakdørene og ser den terskel- og sømløse overgangen fra ute/inne. Da oppheves følelsen av definerte rom, og du får en dynamisk overgang fra salong og bysse, til akterdekk og videre ned ut mot badeplattform og sjøen. Akterdekket har også store, gode luker ned til motorrom, samt en ekstra utvendig styreposisjon til styrbord.<br>\n<br>\nElektrohydraulisk badeplattform med nedfelt daviter til jolle, pasarelle og et supersmart utekjøkken gir mye glede akterut.<br>\n<br>\nByssa har alle fasiliteter, det er vinskap, 50 cm Siemens oppvaskmaskin, Siemens stekeovn med pyrolyse og microfunksjon samt kjøl og frys. Ventilatoren er skikkelig, og kraftig nok til ordentlig matlaging, uten å forstyrre noen med stekeos. Båten har også sentralstøvsuger<br>\n<br>\nErgonomisk utført førerposisjon, med veldig god utsikt og oversikt. Fra markedets kanskje råeste kapteinsstol har du full kontroll over skuta. Både med musehjulsstyring av plottere og motordata samt Joysticken tilhørende Zeus podsystemet. Stor elektrisk takluke åpner helt opp og gir masse friluftsfølelse.</p>\n<p class=\"font_7\">Båten er overraskende enkel å manøvrere med Cummins Zeus Podsystem. Trykker du på skyhook blir båten liggende der du ønsker det automatisk for deg, mens du klargjør trosser og fendere. Et fantastisk system som gjø fortable sitteplasser. Store vinduer gir panoramautsikt og de elektriske taklukene slipper inn rikelig med naturlig lys, noe som skaper en lys og innbydende atmosfære. Spiseområdet og salongen er perfekte for både mindre middager og større sammenkomster. Her har du også mulighet til å slå ned sofabordet for å lage en ekstra seng.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Byssen om bord er godt utstyrt, her finner vi både komfyr, keramisk koketopp med fire soner, vask og rikelig med lagringsplass. Her kan du enkelt tilberede måltider mens du er på sjøen, og det åpne designet gjør det til et hyggelig sted å tilbringe tid. På finværsdager har du mulighet til å åpne det store vinduet fra byssen ut mot akterdekk. Dette skaper en sosial setting, og du kan for eksempel enkelt servere mat her.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Under dekk finner vi overflatematerialer av høy kvalitet, som trepaneler, skinn og moderne belysning. Hoved lugaren er romslig og utstyrt med en stor, komfortabel dobbeltseng og eget bad. Gjestekabinen er også av høy standard, med to enkeltsenger. Her legger man merke til god takhøyde og vinduer som slipper inn fint naturlig lys.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten har et stort fordekk med elektrisk ankervinsj. Høyt rekkverk og brede gangveier gjør det trygt og enkelt å bevege seg fra fordekket til akterdekket. Her har du svært romslig dekksplass, med mulighet for å sette ut både bord og stoler. Det er også luker som har rikelig med lagringsplass til diverse utstyr du vil ha med deg på tur.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Motorrommet på denne båten er lyst, romslig og åpent, noe som gjør vedlikehold og service enkelt. Denne Eastbay 45SX er utstyrt med to kraftige Cummins QSC 8,3L motorer som gir utmerket ytelse og lang rekkevidde, noe som gjør den ideell for lengre turer til sjøs. Båten er oppgitt med en drivstoffkapasitet på 1,938 liter, en ferskvannstank på 549 liter o >\n<p class=\"font_8\"><br></p>\n<p class=\"font_7\">Båten har hatt årlig service og innendørs vinteropplag hos profesjonelle aktører (Vollen, Skjærhalden, Hankø). Den er nylig polert og bunnstoffet (2025) og fremstår som svært godt vedlikeholdt. Motoren har kun 284 timer (juni 2025).</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten ligger klar for visning og rask levering på Lysaker.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Kontakt:</strong></p>\n<p class=\"font_7\"><strong>Henrik Bratz</strong></p>\n<p class=\"font_7\"><strong>+47 47875838</strong></p>\n<p class=\"font_7\"><strong>henrik(at)h-y.no</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_b6337a1fa20e42a1b424c482a6cce9e8~mv2.webp", "_wix_title": "Brig Eagle 8 - 2022", "_wix_year": "2022", "_not_sold": false}, {"slug": "ibiza-811-touring", "action": "update", "hs_id": "351361855723", "props": {"boat_name": "Ibiza 811 Touring", "page_path2": "ibiza-811-touring", "merke": "Ibiza", "modell": "811 Touring", "arsmodell": "2017", "lengde_i_fot": "27,2 fot", "pris": "Solgt!", "price_two": "950000", "motorfabrikant": "Suzuki 300 HK", "motortype": "Utenbords", "motorstorrelse": "300 HK", "customer_comment": "<p class=\"font_7\">Ibiza 811 Touring fra 2017 med kun 340 timer er en båt som virkelig leverer på både komfort og kjøreegenskaper. Her får du en velholdt daycruiser, fulgt opp med service og utstyrt for å nyte både dagsturer og helgeturer med familien.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Cockpiten er romslig og sosial, med stor U-sofa, vendbar passasjerstol og mulighet for solseng. Pantryet er komplett med kjøleskap, koketopp og vask – perfekt for lange dager på sjøen. Under dekk finner du soveplass til to voksne og to barn samt separat toalettrom, noe som gjør båten svært praktisk også på lengre turer.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ibiza er kjent for sine ersikt gjennom store vinduer, og med åpen Hardtop får du masser av luft og lys. En helt suveren løsning for norske forhold.</p>\n<p class=\"font_7\">Vårt eksemplar er utstyrt med Simrad Navigasjonspakke, videre oppgradert med radar, autopilot og VHF. Fra førerposisjon har du også mulighet til å kontrollere varmeapparat, lydanlegg og ankervinsj, samt baug- og hekktruster.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Salongen i S36HT er luksuriøs, preget av kvalitetsfinish og smakfull design. De polstrede setene gir utmerket komfort, med et flott spisebord i midten. Byssa er godt utstyrt, komplett med kokeplater, romslig kjøleskap og skapplass. Båten har to romslige lugarer med dobbeltsenger.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Maskinrommet på S36HT er lett tilgjengelig og godt organisert for enkel inspisering og vedlikehold. Motoren er en Volvo Penta D6 med under 10t siden forrige service, som yter 380HK.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Båten har ny service på drev og er nypolert, nyvasket og har nytt bunnstoff for 2025. Ta kontakt for visning omgående!</strong></p>\n<p class=\"font_7\"><strong>Henrik Bratz</strong></p>\n<p class=\"font_7\"><strong>47 87 58 38</strong></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_f309418c8c3148a682b19d48b9d940b6~mv2.jpg", "_wix_title": "Bavaria S36 HT", "_wix_year": "2020", "_not_sold": false}, {"slug": "anker-%26-jensen-8mr-1914-carmen-iv", "action": "update", "hs_id": "351482888439", "props": {"boat_name": "Anker & Jensen 8mR 1914 Carmen IV", "page_path2": "anker-%26-jensen-8mr-1914-carmen-iv", "merke": "Anker & Jensen", "modell": "8mR", "arsmodell": "1914", "lengde_i_fot": "43 fot", "pris": "590.000,-", "price_two": "590000", "motorfabrikant": "Volvo Penta D1-30", "motortype": "Innenbords", "motorstorrelse": "30 HK", "customer_comment": "<p class=\"font_8\"><em><strong>Vi er så heldige å ha fått inn for salg en meget pen Anker &amp; &nbsp;Jensen 8mR fra 1914&nbsp; - Carmen IV. Det er sjelden disse er tilgjengelig &nbsp;på markedet, og vi ser nå etter nye eiere som ønsker å føre historien &nbsp;videre og ta godt vare på henne.</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Carmen IV er tegnet av Chr Jensen og bygget av Anker &amp; Jensen i &nbsp;Vollen, et av de mest prestisjefylte verftene i Skandinavia med &nbsp;materialer og håndtverk i ypperste kvalitet.&nbsp;<br>\nSkroget er av mahogny &nbsp;på eikespant. Masten av Oregon pine og med sine 18,5 meter kan tunes. &nbsp;Setup for mast og rigg innfrir kravene til at hun er målt inn under R- &nbsp;regelen.&nbsp;&nbsp;<br>\nHun er den første 8-meteren som vant Færderseilasen i &nbsp;1947. I forbindelse med Færderseilasens 50 årsjubileum i 1997, ble &nbsp;Carmen IV totalrestaurert. Hun har også deltatt i flere VW-seilaser. <br>\n<br>\nNåværende &nbsp;eiere kjøpte Carmen IV i 2018 og seilet henne til Kragerø. De har tatt &nbsp;godt vare på henne siden, og mange har nok de siste årene fått oppleve &nbsp;hennes vakre skue i Kragerø' s skjærgård om sommeren.</p>\n<p class=\"font_8\">Det er en fryd å seile henne og hun må oppleves.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Båten ligger i opplagstelt på land i Kragerø. Ta kontakt for avtale om visning.</strong><br>\n<br>\n<strong>For mer info, kontakt:</strong><br>\n<br>\n<strong>Jeanette Arntzen&nbsp;</strong><br>\n<strong>909 39 610&nbsp;</strong><br>\n<strong>jeanette@h-y.no</strong><br>\n<br>\nOm oss:<br>\n<em>House of Yachts er din selvsagte samarbeidspartner når det kommer til kjøp og salg av båt i annenhåndsmarkedet.</em><br>\n<em>Vi skiller oss fra våre konkurrenter ved å tilby personlig service og rådgiving, og en enkel og forutsigbar kostnadsmodell.</em><br>\n<em>Vårt &nbsp;fokus er å være en markedsledende aktør og samarbeidspartner, enten du &nbsp;er i markedet for å kjøpe, selge, bytte eller charter. Sammen kartlegger &nbsp;vi dine behov og ønsker, og finner riktig løsning for deg.</em><br>\n<br>\n<em>Gjennom &nbsp;et etablert internasjonalt nettverk kan vi bistå med å fremskaffe de &nbsp;fleste båter for import, eller tilrettelegge for ditt båthold i &nbsp;utlandet.</em><br>\n<em>Vi kan bistå med frakt, forsikring, finansiering, &nbsp;verdivurdering og verditakst. Vi tar forbehold om eventuelle feil i &nbsp;salgsoppgaven.</em><br>\n<em>Fartøyet selges “as is”. Kjøpet er regulert av kjøpsloven og House of Yachts AS er kun</em><br>\n<em>mellomann og således ikke part i kjøpekontrakten.</em></p>", "activated": "no", "status": "for-sale"}, "image_url": "https://static.wixstatic.com/media/ad1ced_689b30f89917439a852bd581f3645ba0~mv2.jpg", "_wix_title": "Anker & Jensen 8mR 1914 Carmen IV", "_wix_year": "1914", "_not_sold": false}, {"slug": "goldfish-28-tender-%23057", "action": "update", "hs_id": "351445109976", "props": {"boat_name": "Goldfish 28 Tender #057", "page_path2": "goldfish-28-tender-%23057", "merke": "Goldfish", "modell": "28 Tender", "arsmodell": "2022", "lengde_i_fot": "28 fot", "pris": "Solgt!", "price_two": "1350000", "motorfabrikant": "Mercury 450R", "motortype": "Utenbords", "motorstorrelse": "450 HK", "customer_comment": "<p class=\"font_7\"><strong>House of Yachts presenterer her en nydelig hvit Goldfish 28 Tender, med sort interiør. Diskret uttrykk med helt rå ytelse og fartspotensiale! Goldfish 28 Tender har alt en båt i dette segmentet har bruk for, men ingenting overflødig eller unødvendig. Resultatet er en praktisk båt med gode løsninger - velegnet for både effektiv forflytning og behagelige dager på vannet.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Dette eksemplaret er utstyrt med Mercury 450R-motoren. Den har selvfølgelig meget imponerende ytelse, og er drivstofføkonomisk i marsj-fart. Motoren går utrolig pent, nesten helt uten vibrasjon eller støy ved lav fart. Den er en 4,6L kompressormatet V8 - aluminiumsblokk med doble overliggende kamaksler (DOHC). Motoren veier kun rett i overkant av 300kg, som er usedvanlig lite for en såpass kraftig maskin.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten har fått profesjonell oppfølging og service i opplag, og har 305t på telleren.</p>\n<p class=\"font_7\">Easy-konfigurasjonen med stort stoff er fleksibel, praktisk og pen. Ryggen kan flyttes frem og festes bak førerposisjonen, og man får dermed en fin bakovervendt solseng med hodestøtte. Dekket er utført i sort gripfoam, som sammen med sorte aluminiumsdetaljer gir en tydelig kontrast til det hvite skroget og konsollen.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Båten er byggenr 57 og har Infusion-skrog.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Ta kontakt i dag for visning. Båten ligger på vannet i Sandvika, frem til den eventuelt settes i vinteropplag i Moss.</strong></p>\n<p class=\"font_7\"><strong>Kontakt båtmegler Henrik Olaf Bratz - +47 47875838 - henrik@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-10-30"}, "image_url": "https://static.wixstatic.com/media/ad1ced_b4ec4c02d9cf48b88d17f062c04902f2~mv2.webp", "_wix_title": "Goldfish 28 Tender #057", "_wix_year": "2022", "_not_sold": false}, {"slug": "nimbus-280-coup%C3%A9", "action": "update", "hs_id": "351443201229", "props": {"boat_name": "Nimbus 280 Coupé", "page_path2": "nimbus-280-coup%C3%A9", "merke": "Nimbus", "modell": "280 Coupé", "arsmodell": "2004", "lengde_i_fot": "28 fot", "pris": "Solgt!", "price_two": "595000", "motorfabrikant": "Volvo Penta TAMD31P", "motortype": "Innenbords", "motorstorrelse": "150 HK", "customer_comment": "<p class=\"font_8\"><em><strong>Vi har fått inn for salg en pen Nimbus 280 Coupé fra 2004. Båten er godt utstyrt og godt holdt.</strong></em></p>\n<p class=\"font_8\">Enkel adkomst fra stor badeplattform gjennom hekkport, til akterdekket. Her er det god plass, med flere fine sitteplasser. Solid bakdør inn til en romslig salong, bysse til babord, ver 40 knop. Båten har kun én eier og beskjedne 40 timer på timetelleren.</strong></em></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">T9-modellen balanserer elegante linjer med praktisk fleksibilitet. I cockpiten finner du justerbare seter, romslig sosial sone rundt bord, full teakpakke og en smart wetbar med tilkobling for medfølgende Weber-grill. Bred badeplattform med integrert badestige og elektrisk ankervinsj gjør båten perfekt for sommerens badeliv.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Under dekk byr T9 på en romslig kabin med soveplass for to, godt naturlig lysinnslipp og et separat toalettrom – hvor toalettet aldri har vært i bruk. Lagringsmuligheter er gjennomført løst både over og under dekk.</p>\n<p class=\"font_7\">Sikkerhet er naturligvis sentralt: Båten har bredde i dollbord, solide håndrekker og en stabil plattform, som gjør den ideell også for barnefamilier.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Denne båten leveres klar for sesong, og er et attraktivt alternativ for deg som ønsker en moderne Nimbus med oppgradert motorisering og riktig utstyrsnivå – til en svært konkurransedyktig pris.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Nøkkelutstyr:</strong></p>\n<ul class=\"font_7\">\n  <li><p class=\"font_7\">Baugthruster</p></li>\n  <li><p class=\"font_7\">Zipwake autotrim-system</p></li>\n  <li><p class=\"font_7\">Simrad NSX 9\" kartplotter m/ sonar</p></li>\n  <li><p class=\"font_7\">Kalesje, sprayhood og havnetrekk</p></li>\n  <li><p class=\"font_7\">Wetbar + Weber-grill (ubrukt)</p></li>\n  <li><p class=\"font_7\">Elektrisk ankervinsj akter</p></li>\n  <li><p class=\"font_7\">Dusj på badeplattform</p></li>\n</ul>\n<p class=\"font_7\"><strong>Visning etter avtale. Båten ligger i vinteropplag i Leangbukta.</strong></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Ta kontakt med:</strong></p>\n<p class=\"font_7\"><strong>Sindre Jacobsen</strong></p>\n<p class=\"font_7\"><strong >Om båten:</strong></p>\n<p class=\"font_8\">Meget pen Axopar 28 Open. Godt utstyrt båt med bla. Targabøyle, Baugpropell og</p>\n<p class=\"font_8\">Trimtabs. Motoren er anerkjente Mercury 300 HK Verado, kun ca. 110 timer på telleren.</p>\n<p class=\"font_8\">Axopar er Europas raskest voksende båtmerke med fantastisk design, kvalitet,</p>\n<p class=\"font_8\">sjøegenskaper og bruksmuligheter.<br>\n <br>\nUtstyrt med premium pakke, se komplett utstyrsliste i prospektet. Få den tilsendt via epost i linken til venstre.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><strong>Ta kontakt med:</strong></p>\n<p class=\"font_8\"><strong>Sindre Jacobsen</strong></p>\n<p class=\"font_8\"><strong>938 40 189</strong></p>\n<p class=\"font_8\"><strong>sindre@h-y.no</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2024-01-26"}, "image_url": "https://static.wixstatic.com/media/ad1ced_825e02ff88a442f29e40e045e2132b20~mv2.jpg", "_wix_title": "Axopar 28 Open", "_wix_year": "2019", "_not_sold": false}, {"slug": "modesty-33-sc", "action": "update", "hs_id": "351443310797", "props": {"boat_name": "Modesty 33 SC", "page_path2": "modesty-33-sc", "merke": "Modesty", "modell": "33 SportsCruiser", "arsmodell": "2012", "lengde_i_fot": "33 fot", "pris": "Solgt!", "price_two": "845000", "motorfabrikant": "Mercruiser v6 4.2 liter", "motortype": "Innenbords", "motorstorrelse": "350 HK", "customer_comment": "<p class=\"font_8\"><em><strong>Vi har fått inn for salg en utrolig lekker Modesty 33 SC fra 2012! Denne rålekre, norske cruiseren fra 2012 byr på enormt med båtglede, smarte løsninger og en god dose lekre linjer.</strong></em></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Mercruiser v6 Diesel på 350 HK med kun 322 timer på telleren.&nbsp;</p>\n<p class=\"font_8\">Godt ustyrt, vi nevner bla: elektrisk ankervinsj akter med fjernkontroll, kjøleskap og baugpropell.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Båten er registrert i skipsregisteret, og vi kan dermed tilby finansiering. Ta kontakt for tilbud.</p>\n<p class=\"font_8\">Ligger pent i vannet, og med dyp v-bunn og steppet skrog bruker den lite drivstoff.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Kan sees på vår salgsbrygge på Lysaker, etter avtale med:</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\"><em><strong>Sindre Jacobsen</strong></em></p>\n<p class=\"font_8\"><em><strong>+ 47 938 40189</strong></em></p>\n<p class=\"font_8\"><em><strong>sindre@h-y.no</strong></em></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2021-11-10"}, "image_url": "https://static.wixstatic.com/media/ad1ced_7aea9fc9c3cc4a71b33f5bda0edb939d~mv2.jpg", "_wix_title": "Modesty 33 SC", "_wix_year": "2012", "_not_sold": false}, {"slug": "colin-archer-40", "action": "update", "hs_id": "351443229923", "props": {"boat_name": "Colin Archer 40", "page_path2": "colin-archer-40", "merke": "Colin Archer", "modell": "40", "arsmodell": "1981", "lengde_i_fot": "40 fot", "pris": "Solgt!", "price_two": "1099000", "motorfabrikant": "Mitsubishi / SABB", "motortype": "Innenbords", "motorstorrelse": "65 HK", "customer_comment": "<p class=\"font_7\">S/Y Vilde – formerly Caliope III – is now offered for sale by House of Yachts Oslo.</p>\n<p class=\"font_7\">This is a 40-foot, rock-solid Colin Archer yacht, built in 1981 at the highly esteemed Djupevåg Boatbuilders, based on the original</p>\n<p class=\"font_7\">Colin Archer drawings from 1902. Considerable refurbishment of hull and deck, done at Hardanger Fartøyvernsenter, in 2020, at</p>\n<p class=\"font_7\">cost of £75.000+. Reciepts and thorough documentation of the refit/restoration is available.</p>\n<p class=\"font_7\">Crafted with traditional Norwegian boatbuilding expertise and using only the finest materials, this vessel is both a gem and a</p>\n<p class=\"font_7\">highly dependable long-distance cruiser. If you're planning adventures in nearby or far-off waters, S/Y Vilde deserves your</p>\n<p class=\"font_7\">serious consideration. This is a proven, original Colin Archer design in exceptionally good condition. The boat is truly unique and</p>\n<p class=\"font_7\">must be experienced firsthand.</p>\n<p class=\"font_7\">In terms of wooden boats, S/Y Vilde is as close to maintenance-free as it gets.</p>\n<p class=\"font_7\">The hull is built from solid oak on oak frames. The woodwork is in remarkably good condition thanks to S/Y Vilde’s relatively</p>\n<p class=\"font_7\">young age and expert care. Above deck, everything is made from 2-inch thick Burmese teak, which has recently been</p>\n<p class=\"font_7\">refurbished. The quality and thickness of the teak is extraordinary—virtually impossible to find today. It is nearly maintenance-</p>\n<p class=\"font_7\">free: it only requires an occasional rinse or sweep—no sanding or oiling needed.</p>\n<p class=\"font_7\">S/Y Vilde is easy to sail. In and out of harbors, you're assisted by a powerful Sleipner bow thruster delivering 110 kg of thrust.</p>\n<p class=\"font_7\">Raising the sails is made simple with an electric winch for the mainsail halyard and a Furlex roller furler for the staysail. Under</p>\n<p class=\"font_7\">sail, the boat is highly predictable and surprisingly swift. On longer passages, the balanced rudder, autopilot, and optionally a</p>\n<p class=\"font_7\">wind vane make life onboard relaxed and manageable. She’s slimmer than most Colin Archers, and as a result, faster—having</p>\n<p class=\"font_7\">logged 192 nautical miles in 24 hours, averaging 8 knots in 15 m/s wind. S/Y Vilde is easily capable of long voyages, and has</p>\n<p class=\"font_7\">sailed the Caribbean twice in its current ownership, including Atlantic crossing via Greenland.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Below deck, you’ll find traditional craftsmanship at its finest. All woodwork is in oiled teak and in outstanding condition. The galley, saloon, and cabins are thoughtfully laid out for both comfort and functionality, ensuring pleasant voyages in all weather conditions.</p>\n<p class=\"font_7\">Everything is solid, nothing is worn, and the aesthetic is both historic and timeless. The interior reflects the owner's attention to detail, with smart, practical solutions throughout.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">A U-shaped settee to port and a longitudinal settee to starboard provide comfortable dining for six, or up to eight when needed. A pilot berth to starboard is ideal for children or for relaxing during a bit of a swell. The skylight and windows provide lovely natural light.</p>\n<p class=\"font_7\">Up forward, there's a spacious forepeak with two single berths and a double bed. Aft, you’ll find the toilet and a wide quarter berth.</p>\n<p class=\"font_7\">Plenty of documentation is available, also from the recent 2020 refit. The yacht is currently located at Nesøya in the Oslofjord and is ready for viewing.</p>\n<p class=\"font_7\">Contact us to see this exceptional piece of sailing and cultural heritage!</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><em><strong>S/Y Vilde, tidligere Caliope III, er nå til salgs hos oss i House of Yachts Sail Division.</strong></em></p>\n<p class=\"font_7\"><em><strong>Båten er en 40 fots bunnsolid Colin Archer bygget ved det meget anerkjente Djupevåg Båtbyggeri i 1981, fra originale Archer-tegninger fra 1902.&nbsp;</strong></em></p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Kvalitetsmessig tradisjonshåndverk, bygget utelukkende med materialer av helt ypperste klasse, gjør båten både til et smykke og det mest trofaste langturfartøy du kan tenke deg. Har du planer om eventyr i nære eller fjerne farvann, bør du virkelig vurdere S/Y Vilde; et velprøvd originalt Colin Archer-design i en vanvittig god stand. Båten er unik, og må<br>\noppleves. I trebåtsammenheng er S/Y Vilde det nærmeste du kommer vedlikeholdsfritt.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Skrog er i solid eik på eikespant, med hvit ishud. Sammenlignet med de fleste Colin Archere i dag, er treverket meget god stand, grunnet relativt ung alder og kyndig vedlikehold. Over dekk er alt utført i 2 toms Burmateak som nylig er gått over. Kvaliteten på teaken og den solide tykkelsen, finnes det nesten ikke maken til, og er ikke lenger å oppdrive. Teaken er så godt som vedlikeholdsfri - den vaskes/feies en sjelden gang. Ingen sliping eller olje.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">S/Y Vilde er lettseilt. Inn og ut av havn får du god hjelp av en Sleipner thruster som gir hele 110 kg. Når seilene skal opp, har du elektrisk winch på storseilfall, samt furlex på klyveren. Under seil har du en meget forutsigbar og overraskende rask båt. På lengre etapper gjør balanseroret, autopilot og eventuelt et vindror livet ombord lettvint. Båten er slankere enn de fleste Colin Archere, og dermed rask. Selger har logget 192nm på 24t, som gir en snittfart på 8kn i 15m/s vind.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Under dekk venter tradisjonshåndverk på sitt beste. Alt treverk er i oljet teak, og i en fantastisk god stand. Hensiktsmessig utforming av bysse, salong og kabiner legger alt til rette for både hygge og komfortable overfarter i all slags vær. Alt er solid, ingenting er nedslitt og estetikken er historisk og tidløs. Interiøret bærer preg av at eier har vært nøye og ryddig, og alt er gjennomtenkt og funksjonelt. U-sofa til babord og langsgående sofa til styrbord gir komfortabel spiseplass til 6, eller 8 ved behov. Loskøye til styrbord er supert for barn, og er ellers et rolig og komfortabelt sted å strekke bena i litt sjø. Skylight og vinduer gir fint lysinnfall.</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Videre har båten en romslig forpigg med 2 køyesenger samt en dobbeltseng. Akter finner du toalett og en bred stikk-køye. Ombord i S/Y Vilde finner nok alle seg en favorittkøye!</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Det er rikelig med dokumentasjon tilgjengelig, og vi anbefaler interessenter å lese prospekt og utstyrsliste på vår hjemmeside. Båten ligger ved Nesøya i Oslofjorden, og er klar for besiktigelse.&nbsp;</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\">Ta kontakt for visning av et ytterst funksjonelt stykke norsk seil- og kulturhistorie!</p>\n<p class=\"font_7\"><br></p>\n<p class=\"font_7\"><strong>Kontakt:</strong></p>\n<p class=\"font_7\"><strong>Båtmegler Henrik Olaf Bratz</strong></p>\n<p class=\"font_7\"><strong>Telefon 47 87 58 38</strong></p>", "activated": "no", "status": "sold", "sold_date_proxy": "2025-12-17"}, "image_url": "https://static.wixstatic.com/media/ad1ced_d6f3c900ea254755ad26e2e9af8bf264~mv2.webp", "_wix_title": "Colin Archer 40", "_wix_year": "1981", "_not_sold": false}, {"slug": "nordkapp-760-noblesse", "action": "update", "hs_id": "351388463328", "props": {"boat_name": "Nordkapp 760 Noblesse", "page_path2": "nordkapp-760-noblesse", "merke": "Nordkapp", "modell": "760 Noblesse", "arsmodell": "2011", "lengde_i_fot": "25 fot", "pris": "Solgt!", "price_two": "595000", "motorfabrikant": "Evinrude E-Tec 250", "motortype": "Utenbords", "motorstorrelse": "250 HK", "customer_comment": "<p class=\"font_8\"><strong>Vi har fått inn for salg en meget velholdt Nordkapp 760 Noblesse fra 2011. Klar for henting umiddelbart, ferdig stroppet og klar for sommerferie på en flott, registrert Tredal-henger med el.vinsj. Gjør det svært enkelt å slippsette båten.</strong></p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">Denne båten er utstyrt Evinrude E-Tec 250 HK, ca. 300 timer på telleren.</p>\n<p class=\"font_8\">Båten er første gang sjøsatt i 2012, og fremstår som pent holdt. Godt utstyrt med bla. baugpropell, kartplotter, ankervinsj med fjernkontroll og elektrisk toalett med septiktank.</p>\n<p class=\"font_8\"><br></p>\n<p class=\"font_8\">God sitteplass i cockpit for opptil 8 mennesker, forkabinen har soveplass til to voksne.</p>\n<p class=\"font_8\">Oversiktlig førerp

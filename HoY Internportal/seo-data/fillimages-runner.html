const ENDPOINT = 'https://silver-puffpuff-8a67de.netlify.app/.netlify/functions/wix-migrate?action=fillimages';
const KEY = 'hoy-fillimages-state';
let state = (function(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}})();

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function log(m,cls=''){const el=document.getElementById('log');const d=document.createElement('div');if(cls)d.className=cls;d.textContent='['+new Date().toLocaleTimeString()+'] '+m;el.appendChild(d);el.scrollTop=el.scrollHeight}

function render(){
  const tb=document.getElementById('rows');tb.innerHTML='';
  let ok=0,filled=0,sk=0,err=0;
  ITEMS.forEach((it,i)=>{
    const s=state[it.hs_id]||{status:'pending'};
    const tr=document.createElement('tr');tr.dataset.s=s.status;
    const link=`<a href="https://app-eu1.hubspot.com/contacts/26753504/record/2-145214665/${it.hs_id}" target="_blank">${it.hs_id}</a>`;
    const detail=s.error?('<span style="color:#991b1b">'+(s.error||'').slice(0,100)+'</span>'):(s.action==='filled'?'file '+s.file_id:(s.action==='skipped'?s.reason||'ok':(s.status==='done'?'OK':'')));
    tr.innerHTML=`<td>${i+1}</td><td><code>${it.slug}</code></td><td>${it._title||''}</td><td>${link}</td><td><span class="pill p-${s.status}">${s.status.toUpperCase()}</span></td><td>${detail}</td>`;
    tb.appendChild(tr);
    if(s.status==='done'||s.status==='filled'||s.status==='skipped')ok++;
    if(s.action==='filled')filled++;
    if(s.action==='skipped')sk++;
    if(s.status==='error')err++;
  });
  document.getElementById('c-ok').textContent=ok;
  document.getElementById('c-filled').textContent=filled;
  document.getElementById('c-skipped').textContent=sk;
  document.getElementById('c-err').textContent=err;
}
render();

async function runBatch(items){
  log('Sender batch av '+items.length+'…');
  items.forEach(it=>state[it.hs_id]={status:'running'});save();render();
  try{
    const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({boats:items.map(i=>({hs_id:i.hs_id,slug:i.slug,image_url:i.image_url}))})});
    const data=await res.json();
    if(!data.results)throw new Error('Bad response: '+JSON.stringify(data).slice(0,200));
    data.results.forEach(r=>{
      state[r.hs_id]={status:r.ok?(r.action||'done'):'error',action:r.action,error:r.error,reason:r.reason,file_id:r.file_id,duration_ms:r.duration_ms};
    });save();
    log(`Batch: ${data.ok}/${data.total} — filled:${data.filled} skipped:${data.skipped}`,'log-ok');
    if(data.failed)data.results.filter(r=>!r.ok).forEach(r=>log(` ✗ ${r.slug}: ${(r.error||r.reason||'').slice(0,120)}`,'log-err'));
  }catch(e){
    log('Batch failed: '+e.message,'log-err');
    items.forEach(it=>state[it.hs_id]={status:'error',error:e.message});save();
  }
  render();
}

document.getElementById('btn-next').addEventListener('click',async()=>{
  const size=parseInt(document.getElementById('bsize').value,10)||3;
  const pending=ITEMS.filter(it=>!state[it.hs_id]||state[it.hs_id].status==='pending'||state[it.hs_id].status==='error');
  if(pending.length===0){log('Ingen pending','log-ok');return}
  const b=document.getElementById('btn-next');b.disabled=true;
  await runBatch(pending.slice(0,size));
  b.disabled=false;
});
document.getElementById('btn-reset').addEventListener('click',()=>{if(confirm('Reset all?')){state={};save();render()}});
document.getElementById('btn-export').addEventListener('click',()=>{
  const lines=['slug,hs_id,status,action,file_id,error'];
  ITEMS.forEach(it=>{const s=state[it.hs_id]||{};lines.push([it.slug,it.hs_id,s.status||'pending',s.action||'',s.file_id||'','"'+(s.error||s.reason||'').replace(/"/g,'""')+'"'].join(','))});
  const b=new Blob([lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fillimages-results.csv';a.click();
});
log('Loaded '+ITEMS.length+' UPDATE-records with Wix image available.');
</script></body></html>
